name: Sandbox stop
description: Tear down a sandbox on the deploy host, optionally only when it exists

inputs:
  host:
    description: SSH destination for the deploy host
    required: true
  name:
    description: Sandbox name, e.g. pr123
    required: true
  state-dir:
    description: Directory holding <name>.meta markers; must match deploy.sh's SANDBOX_STATE_DIR
    required: false
    default: /var/lib/roadtrip-sandboxes
  require-existing:
    description: >
      When true, skip instead of tearing down if the sandbox has no marker.
      Tearing down unconditionally is not free — it prunes images on the shared
      deploy host and issues a Cloudflare delete — so callers that fire on every
      PR regardless of whether a sandbox exists should set this.
    required: false
    default: 'false'

outputs:
  torn-down:
    description: "'true' when a sandbox was actually torn down, 'false' when there was none"
    value: ${{ steps.stop.outputs.torn-down }}

runs:
  using: composite
  steps:
    - id: stop
      shell: bash
      env:
        SANDBOX_HOST: ${{ inputs.host }}
        SANDBOX_NAME: ${{ inputs.name }}
        SANDBOX_STATE_DIR: ${{ inputs.state-dir }}
        REQUIRE_EXISTING: ${{ inputs.require-existing }}
      run: |
        set -uo pipefail

        # Same rule deploy.sh enforces, applied before the value reaches the host.
        if ! printf '%s' "$SANDBOX_NAME" | grep -qE '^[a-z0-9][a-z0-9-]{0,62}$'; then
          echo "::error::sandbox name '$SANDBOX_NAME' is not valid; aborting"
          exit 1
        fi

        # Remote exit code meaning "no sandbox to tear down"; distinct from 0
        # (torn down) and from any real failure.
        absent_rc=3

        set +e
        ssh -o BatchMode=yes "$SANDBOX_HOST" \
          "bash -s -- '$SANDBOX_NAME' '$SANDBOX_STATE_DIR' '$REQUIRE_EXISTING' '$absent_rc'" <<'REMOTE'
        set -euo pipefail
        name="$1"
        state_dir="$2"
        require_existing="$3"
        absent_rc="$4"

        if [[ "$require_existing" == "true" && ! -f "${state_dir}/${name}.meta" ]]; then
          echo "==> no sandbox named ${name}; nothing to tear down"
          exit "$absent_rc"
        fi

        cd "$HOME/.roadtrip/current"
        SANDBOX_STATE_DIR="$state_dir" SANDBOX_CADDY_DIR="$HOME/.roadtrip/caddy/sandboxes" \
          scripts/deploy.sh sandbox-down "$name"
        REMOTE
        rc=$?
        set -e

        case "$rc" in
          0)            echo "torn-down=true"  >> "$GITHUB_OUTPUT" ;;
          "$absent_rc") echo "torn-down=false" >> "$GITHUB_OUTPUT" ;;
          *)            exit "$rc" ;;
        esac
