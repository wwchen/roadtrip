name: Sandbox
description: Start or stop a sandbox on the deploy host, including host access and status reporting

inputs:
  operation:
    description: "'start' to bring a sandbox up, 'stop' to tear it down"
    required: true
  slug:
    description: >
      Sandbox owner slug, e.g. pr532. Names the marker consumed by teardown and
      sweep. The deploy script maps it to one of the fixed public slots
      roadtrip-sb-1 and roadtrip-sb-2.
    required: true
  branch:
    description: Branch name for the build-info banner; falls back to the slug (start only)
    required: false
    default: ''
  pr-number:
    description: PR to report status on. Omit for sandboxes with no PR — nothing is posted.
    required: false
    default: ''
  reason:
    description: Why the sandbox was stopped, shown in the status comment
    required: false
    default: ''
  require-existing:
    description: >
      Stop only. When true, skip instead of tearing down if the sandbox has no
      marker. Tearing down unconditionally is not free — it prunes images on the
      shared deploy host and issues a Cloudflare delete — so callers that fire
      regardless of whether a sandbox exists should set this.
    required: false
    default: 'false'
  ts-oauth-client-id:
    description: Tailscale OAuth client id
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth secret
    required: true
  ssh-private-key:
    description: Deploy SSH private key
    required: true
  ssh-known-hosts:
    description: Deploy SSH known_hosts
    required: true
  github-token:
    description: Token used to read GHCR images and post status comments
    required: true

outputs:
  torn-down:
    description: "Stop only: 'true' when a sandbox was torn down, 'false' when there was none"
    value: ${{ steps.stop.outputs.torn-down }}
  url:
    description: "Start only: the sandbox URL"
    value: ${{ steps.start.outputs.url }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SLUG: ${{ inputs.slug }}
      run: |
        set -euo pipefail

        case "$OPERATION" in
          start|stop) ;;
          *) echo "::error::operation must be 'start' or 'stop', got '$OPERATION'"; exit 1 ;;
        esac

        # The rule deploy.sh enforces, applied before the value reaches the host.
        if ! printf '%s' "$SLUG" | grep -qE '^[a-z0-9][a-z0-9-]{0,62}$'; then
          echo "::error::slug '$SLUG' must be 1-63 lowercase letters, digits or hyphens"
          exit 1
        fi

    # The caller has already checked out the commit being deployed, so both SHAs
    # come from that tree rather than being passed back in alongside it.
    - name: Resolve commit SHAs
      id: shas
      if: inputs.operation == 'start'
      shell: bash
      run: |
        set -euo pipefail
        sha="$(git rev-parse HEAD)"
        data_sha="$(git rev-parse HEAD:data)"
        for pair in "commit:$sha" "data tree:$data_sha"; do
          if ! printf '%s' "${pair#*:}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::${pair%%:*} SHA '${pair#*:}' is not 40 hex characters"
            exit 1
          fi
        done
        {
          echo "sha=$sha"
          echo "data-sha=$data_sha"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      if: inputs.operation == 'start'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Wait for GHCR images
      if: inputs.operation == 'start'
      shell: bash
      env:
        APP_SHA: ${{ steps.shas.outputs.sha }}
        DATA_SHA: ${{ steps.shas.outputs.data-sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        images=(
          "ghcr.io/${REPO}/backend:${APP_SHA}"
          "ghcr.io/${REPO}/data:${DATA_SHA}"
        )
        max_attempts=60
        wait_seconds=20
        for attempt in $(seq 1 "$max_attempts"); do
          missing=()
          for image in "${images[@]}"; do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing+=("$image")
          done
          [ "${#missing[@]}" -eq 0 ] && exit 0
          printf 'Attempt %s/%s; waiting for %s\n' \
            "$attempt" "$max_attempts" "${missing[*]}"
          [ "$attempt" -lt "$max_attempts" ] && sleep "$wait_seconds"
        done
        printf 'Images were not published: %s\n' "${missing[*]}" >&2
        exit 1

    - name: Reach the deploy host
      uses: ./.github/actions/deploy-host-access
      with:
        ts-oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        ts-oauth-secret: ${{ inputs.ts-oauth-secret }}
        ssh-private-key: ${{ inputs.ssh-private-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}

    # Must run after the tailnet join and SSH setup above — it SSHes to the host.
    - name: Install runtime release
      if: inputs.operation == 'start'
      uses: ./.github/actions/install-release
      with:
        host: mini@mini-ca
        sha: ${{ steps.shas.outputs.sha }}

    - name: Start sandbox
      id: start
      if: inputs.operation == 'start'
      shell: bash
      env:
        SANDBOX_HOST: mini@mini-ca
        SLUG: ${{ inputs.slug }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ steps.shas.outputs.sha }}
        DATA_SHA: ${{ steps.shas.outputs.data-sha }}
      run: |
        set -euo pipefail
        sha="$SHA"
        data_sha="$DATA_SHA"
        output=""
        echo "==> starting ${SLUG} at ${sha} (data ${data_sha})"

        # Branch names may hold characters the remote shell would otherwise eat.
        branch_b64="$(printf '%s' "$BRANCH" | base64 -w0)"
        set +e
        output="$(ssh -o BatchMode=yes "$SANDBOX_HOST" \
          "bash -s -- '$SLUG' '$sha' '$branch_b64' '$data_sha'" <<'REMOTE'
        set -euo pipefail
        slug="$1"
        sha="$2"
        branch="$(printf '%s' "$3" | base64 -d)"
        data_sha="$4"

        cd "$HOME/.roadtrip/releases/$sha"
        # Passing the slug as both ref and owner name pins the teardown handle;
        # deploy.sh maps that owner to a fixed public slot.
        SANDBOX_SHA="$sha" SANDBOX_BUILD_SHA="$sha" SANDBOX_BRANCH="$branch" \
          ROADTRIP_DATA_SHA="$data_sha" SANDBOX_CADDY_DIR="$HOME/.roadtrip/caddy/sandboxes" \
          scripts/deploy.sh sandbox-up "$slug" "$slug"
        REMOTE
        )"
        rc=$?
        set -e
        printf '%s\n' "$output"
        if [[ "$rc" -ne 0 ]]; then
          exit "$rc"
        fi
        url="$(printf '%s\n' "$output" | sed -n 's/^Sandbox is live: //p' | tail -1)"
        if [[ -z "$url" ]]; then
          echo "::error::deploy.sh did not print a sandbox URL"
          exit 1
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: Stop sandbox
      id: stop
      if: inputs.operation == 'stop'
      shell: bash
      env:
        SANDBOX_HOST: mini@mini-ca
        SLUG: ${{ inputs.slug }}
        SANDBOX_STATE_DIR: /var/lib/roadtrip-sandboxes
        REQUIRE_EXISTING: ${{ inputs.require-existing }}
      run: |
        set -uo pipefail
        output=""

        # Remote exit code meaning "no sandbox to tear down"; distinct from 0
        # (torn down) and from any real failure.
        absent_rc=3

        set +e
        output="$(ssh -o BatchMode=yes "$SANDBOX_HOST" \
          "bash -s -- '$SLUG' '$SANDBOX_STATE_DIR' '$REQUIRE_EXISTING' '$absent_rc'" <<'REMOTE'
        set -euo pipefail
        slug="$1"
        state_dir="$2"
        require_existing="$3"
        absent_rc="$4"

        if [[ "$require_existing" == "true" && ! -f "${state_dir}/${slug}.meta" ]]; then
          found_by_slot="false"
          for marker in "${state_dir}"/*.meta; do
            [[ -e "$marker" ]] || continue
            if [[ "$(sed -n 's/^SLOT=//p' "$marker" 2>/dev/null | head -1)" == "$slug" ]]; then
              found_by_slot="true"
              break
            fi
          done
          if [[ "$found_by_slot" != "true" ]]; then
            echo "==> no sandbox named ${slug}; nothing to tear down"
            exit "$absent_rc"
          fi
        fi

        cd "$HOME/.roadtrip/current"
        SANDBOX_STATE_DIR="$state_dir" SANDBOX_CADDY_DIR="$HOME/.roadtrip/caddy/sandboxes" \
          scripts/deploy.sh sandbox-down "$slug"
        REMOTE
        )"
        rc=$?
        set -e
        printf '%s\n' "$output"

        case "$rc" in
          0)
            echo "torn-down=true"  >> "$GITHUB_OUTPUT"
            url="$(printf '%s\n' "$output" | sed -n 's/^Sandbox was: //p' | tail -1)"
            # An if-block, not `[[ ... ]] && echo`: this is the last command in
            # the branch and `esac` ends the step, so a false test under `set -e`
            # would fail a teardown that actually succeeded.
            if [[ -n "$url" ]]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
            fi
            ;;
          "$absent_rc") echo "torn-down=false" >> "$GITHUB_OUTPUT" ;;
          *)            exit "$rc" ;;
        esac

    - name: Report sandbox URL
      if: inputs.operation == 'start'
      shell: bash
      env:
        SANDBOX_URL: ${{ steps.start.outputs.url }}
      run: |
        echo "Sandbox live: ${SANDBOX_URL}" >> "$GITHUB_STEP_SUMMARY"

    # A stop that found nothing updates an existing status comment but does not
    # create a new one for PRs that never had a sandbox.
    - name: Status done
      if: >
        inputs.pr-number != '' &&
        (inputs.operation == 'start' || inputs.operation == 'stop')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SANDBOX_OPERATION: ${{ inputs.operation }}
        SANDBOX_SLUG: ${{ inputs.slug }}
        SANDBOX_REASON: ${{ inputs.reason }}
        SANDBOX_TORN_DOWN: ${{ steps.stop.outputs.torn-down }}
        SANDBOX_SHA: ${{ steps.shas.outputs.sha }}
        SANDBOX_BRANCH: ${{ inputs.branch }}
        SANDBOX_START_URL: ${{ steps.start.outputs.url }}
        SANDBOX_STOPPED_URL: ${{ steps.stop.outputs.url }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pr = Number('${{ inputs.pr-number }}');
          const operation = process.env.SANDBOX_OPERATION;
          const slug = process.env.SANDBOX_SLUG;
          const reason = process.env.SANDBOX_REASON;
          const sha = process.env.SANDBOX_SHA;
          const branch = process.env.SANDBOX_BRANCH;
          const startUrl = process.env.SANDBOX_START_URL;
          const stoppedUrl = process.env.SANDBOX_STOPPED_URL;
          const stoppedLabel = stoppedUrl || `\`${slug}\``;
          const tornDown = process.env.SANDBOX_TORN_DOWN;
          const marker = `<!-- sandbox-status:pr${pr} -->`;
          const runUrl =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const inlineCode = value => `\`${String(value).replace(/`/g, '\\`')}\``;
          const buildLines = [
            sha ? `- **Commit:** ${inlineCode(sha.slice(0, 12))}` : '',
            branch ? `- **Branch:** ${inlineCode(branch)}` : '',
          ].filter(Boolean).join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (operation === 'stop' && tornDown !== 'true' && !existing) {
            core.info(`No existing sandbox status comment for PR #${pr}; not creating one.`);
            return;
          }

          const body = operation === 'start'
            ? `${marker}\n### ✅ Sandbox live\n` +
              `- **URL:** ${startUrl}\n` +
              (buildLines ? `${buildLines}\n` : '') +
              `- **Stop:** comment \`/sandbox stop\`  ·  [logs](${runUrl})`
            : `${marker}\n### 🛑 Sandbox torn down\n` +
              `- **Was:** ${stoppedLabel}\n` +
              (tornDown === 'true' ? '' : `- No sandbox was present on the deploy host.\n`) +
              (reason ? `- Stopped because ${reason}\n` : '') +
              `- Re-create with \`/sandbox\`  ·  [logs](${runUrl})`;

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, body,
            });
          }

    - name: Status failed
      if: failure() && inputs.pr-number != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pr = Number('${{ inputs.pr-number }}');
          const marker = `<!-- sandbox-status:pr${pr} -->`;
          const verb = '${{ inputs.operation }}' === 'stop' ? 'teardown' : 'deploy';
          const runUrl =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `${marker}\n### ❌ Sandbox ${verb} failed\n` +
            `- See the [workflow run](${runUrl}) for details.`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: pr, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr, body,
            });
          }
