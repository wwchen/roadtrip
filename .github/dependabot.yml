version: 2

# Weekly rather than daily: this is a single-maintainer repo, and a daily
# cadence turns into PR noise that gets bulk-closed instead of reviewed.
# Grouping minor+patch bumps into one PR per ecosystem keeps the common case to
# a single review; majors stay separate because they need real attention.
updates:
  # Kotlin/Ktor backend. Gradle version catalogs and build.gradle.kts are both
  # picked up from the root build.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # kaml is coupled to Ktor: ktor-server-config-yaml 3.5.1 is compiled
      # against kaml 0.79.0, where YamlMap.get is a normal method. kaml 0.104.0
      # made YamlMap.get a reified inline fun, so Ktor's precompiled bytecode
      # calls a reified stub at runtime and throws UnsupportedOperationException
      # from ConfigLoader.load — failing ApplicationPropertiesTest (the real
      # cause of the #547/#554/#557 backend-test failures, verified by reverting
      # only kaml on #557's branch). kaml must track the version Ktor expects,
      # so bump it together with Ktor in a dedicated PR, not via the group.
      - dependency-name: "com.charleskorn.kaml:*"
        versions: [">=0.80.0"]
      # Ktor itself: hold 3.5.2+ out of the group until a coordinated Ktor +
      # kaml upgrade is done deliberately (they must move together).
      - dependency-name: "io.ktor:*"
        versions: [">=3.5.2"]
      - dependency-name: "io.ktor.plugin"
        versions: [">=3.5.2"]

  # Rec.gov companion sidecar — the only npm project in the tree. web/ is
  # dependency-free ES modules with no package.json, so there is nothing to
  # track there until one appears.
  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # No pip ecosystem: the fetchers in scripts/ and the secrets tooling declare
  # no dependencies (they are stdlib plus PyYAML), so there is no Python
  # manifest in the tree — point pip at a requirements.txt if that changes.

  # Pinned action majors (checkout@v4, codecov-action@v5, …) otherwise drift
  # until something breaks or a deprecation notice turns a run red.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
