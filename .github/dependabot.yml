version: 2

# Weekly rather than daily: this is a single-maintainer repo, and a daily
# cadence turns into PR noise that gets bulk-closed instead of reviewed.
# Grouping minor+patch bumps into one PR per ecosystem keeps the common case to
# a single review; majors stay separate because they need real attention.
updates:
  # Kotlin/Ktor backend. Gradle version catalogs and build.gradle.kts are both
  # picked up from the root build.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # kaml is ABI-coupled to Ktor. ktor-server-config-yaml is compiled against
      # kaml 0.79.x, where YamlMap.get is a normal method; kaml 0.104.0 made
      # YamlMap.get a reified inline fun, so Ktor's precompiled bytecode calls a
      # reified stub at runtime and throws UnsupportedOperationException from
      # ConfigLoader.load — failing ApplicationPropertiesTest. This was the real
      # (and only) cause of the #547/#554/#557 grouped-bump failures: verified
      # by reverting only kaml on #557 (full suite passes), and Ktor 3.5.2 with
      # kaml held at 0.74.0 also passes — so Ktor was never the problem. kaml
      # must track the version Ktor is built against; bump the two together in a
      # dedicated PR, not via the group.
      - dependency-name: "com.charleskorn.kaml:*"
        versions: [">=0.80.0"]

  # npm workspace root. LDS is installed from npm under the @lew-ds scope; keep
  # the framework package on 1.0.x while the app imports its Roadtrip theme,
  # which was removed from the 1.1.0 export map.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # No pip ecosystem: the fetchers in scripts/ and the secrets tooling declare
  # no dependencies (they are stdlib plus PyYAML), so there is no Python
  # manifest in the tree — point pip at a requirements.txt if that changes.

  # Pinned action majors (checkout@v4, codecov-action@v5, …) otherwise drift
  # until something breaks or a deprecation notice turns a run red.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the three Dockerfiles. Until now nothing watched these, so
  # cloudflared sat nine releases behind its upstream and the companion's
  # playwright tag drifted two minors away from the npm package it ships for.
  - package-ecosystem: docker
    directories:
      - /
      - /data
      - /companion
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The playwright image is ABI-coupled to companion/package.json: the image
      # carries the browser binaries, the npm package decides which build it
      # looks for, and a mismatch throws a missing-executable error out of
      # launchPersistentContext. Dependabot cannot bump a Dockerfile tag and an
      # npm dependency in one PR, so the image stays out of its hands and moves
      # with the package — the npm bump PR edits the tag too, and
      # CompanionPlaywrightLockstepTest fails the build when it doesn't.
      - dependency-name: "mcr.microsoft.com/playwright"

  # Service images in the compose files the deploy host and sandboxes run.
  # Rolling tags here (caddy:2-alpine) only ever produce major PRs, which is
  # the point of pinning them that way.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-compose-minor-and-patch:
        update-types: [minor, patch]
