version: 2

# Weekly rather than daily: this is a single-maintainer repo, and a daily
# cadence turns into PR noise that gets bulk-closed instead of reviewed.
# Grouping minor+patch bumps into one PR per ecosystem keeps the common case to
# a single review; majors stay separate because they need real attention.
updates:
  # Kotlin/Ktor backend. Gradle version catalogs and build.gradle.kts are both
  # picked up from the root build.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Kotlin 2.4 is a language/stdlib jump: its reified-inline ABI breaks
      # against Ktor's precompiled config helpers, so the grouped bump fails
      # backend tests (ApplicationPropertiesTest, UnsupportedOperationException
      # on ConfigLoader.load — see #547). Hold 2.4+ back so routine minor/patch
      # bumps keep grouping cleanly; do the Kotlin 2.4 upgrade in a dedicated PR
      # (bump Kotlin + kotlinx + a compatible Ktor together and fix fallout).
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.0"]
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [">=2.4.0"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [">=2.4.0"]

  # Rec.gov companion sidecar — the only npm project in the tree. web/ is
  # dependency-free ES modules with no package.json, so there is nothing to
  # track there until one appears.
  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # No pip ecosystem: the fetchers in scripts/ and the secrets tooling declare
  # no dependencies (they are stdlib plus PyYAML), so there is no Python
  # manifest in the tree — point pip at a requirements.txt if that changes.

  # Pinned action majors (checkout@v4, codecov-action@v5, …) otherwise drift
  # until something breaks or a deprecation notice turns a run red.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
