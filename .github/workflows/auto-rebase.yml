name: Auto-rebase open PRs

on:
  push:
    branches: [master]
  pull_request_target:
    types: [edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to rebase (blank = all conflicting)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-rebase-${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.pr_number || 'master' }}
  cancel-in-progress: false

jobs:
  rebase:
    # Run on master push, PR retarget-to-master, /rebase PR comment, or manual dispatch.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'master' &&
       github.event.changes.base.ref.from != null &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/rebase'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Use a GitHub App token (same one self-approve.yml uses) so force-pushes
      # to PR branches re-trigger ci.yml. Pushes from the default GITHUB_TOKEN
      # are intentionally suppressed by GitHub and do not fire workflows.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SELF_APPROVE_APPID }}
          private-key: ${{ secrets.SELF_APPROVE_PRIVATEKEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pick target PRs
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_PR: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          RETARGET_PR: ${{ github.event.pull_request.number }}
          RETARGET_HEAD: ${{ github.event.pull_request.head.ref }}
          RETARGET_BASE: ${{ github.event.pull_request.base.ref }}
          RETARGET_OLD_BASE: ${{ github.event.changes.base.ref.from }}
          RETARGET_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request_target" ]; then
            # GitHub retargeted a stacked PR from its parent branch to master.
            # Keep the old base so the rebase step can transplant only the
            # current PR's commits: rebase --onto origin/master old-base head.
            if [ "$RETARGET_IS_FORK" = "false" ] && \
               [ "$RETARGET_BASE" = "master" ] && \
               [ -n "$RETARGET_OLD_BASE" ]; then
              printf '%s %s %s\n' "$RETARGET_PR" "$RETARGET_HEAD" "$RETARGET_OLD_BASE" > prs.txt
            else
              : > prs.txt
            fi
          elif [ "$EVENT" = "issue_comment" ]; then
            # Single PR from /rebase comment. Optional explicit base ref:
            # `/rebase <commit-or-branch>` → use as the rebase --onto source.
            # Without an explicit base, fall back to patch-id rebase onto master.
            # Strip CR (GitHub delivers comment bodies with CRLF) before
            # parsing — otherwise the captured SHA carries a trailing \r and
            # every downstream lookup fails.
            comment_body=$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r')
            explicit_base=$(printf '%s' "$comment_body" | awk '/^\/rebase[[:space:]]+/{print $2}')
            gh pr view "$COMMENT_PR" --repo "$REPO" \
              --json number,headRefName,isCrossRepository,baseRefName \
              --jq 'select(.isCrossRepository == false and .baseRefName == "master") | "\(.number) \(.headRefName)"' \
              | awk -v base="$explicit_base" '{print $0 (base != "" ? " " base : "")}' \
              > prs.txt
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DISPATCH_PR" ]; then
            gh pr view "$DISPATCH_PR" --repo "$REPO" \
              --json number,headRefName,isCrossRepository,baseRefName \
              --jq 'select(.isCrossRepository == false and .baseRefName == "master") | "\(.number) \(.headRefName)"' \
              > prs.txt
          else
            # Push to master or manual dispatch w/o PR: only PRs whose merge
            # is currently CONFLICTING (typical for stacked PRs after the
            # bottom PR merges and GitHub retargets the next one to master).
            #
            # GitHub re-computes mergeability asynchronously after a push,
            # so a fresh `gh pr list` immediately after a merge typically
            # reports the still-stale UNKNOWN status. Poll until every open
            # same-repo PR has a definitive mergeable verdict (CONFLICTING /
            # MERGEABLE / UNMERGEABLE), or we hit the timeout. Without this
            # the workflow misses exactly the case it exists for: stacked
            # PRs whose parent just merged.
            attempt=0
            max_attempts=12   # 12 × 5s = 60s budget
            while : ; do
              attempt=$((attempt + 1))
              raw=$(gh pr list --repo "$REPO" --state open --base master \
                --json number,headRefName,isCrossRepository,mergeable)
              unknown=$(printf '%s' "$raw" \
                | jq '[.[] | select(.isCrossRepository == false and .mergeable == "UNKNOWN")] | length')
              if [ "$unknown" -eq 0 ] || [ "$attempt" -ge "$max_attempts" ]; then
                if [ "$unknown" -gt 0 ]; then
                  echo "::warning::$unknown PR(s) still UNKNOWN after $((attempt * 5))s; proceeding without them."
                fi
                break
              fi
              sleep 5
            done
            printf '%s' "$raw" \
              | jq -r '.[] | select(.isCrossRepository == false and .mergeable == "CONFLICTING") | "\(.number) \(.headRefName)"' \
              > prs.txt
          fi

          if [ ! -s prs.txt ]; then
            echo "No matching PRs."
          else
            cat prs.txt
          fi

      - name: Rebase
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          [ -s prs.txt ] || exit 0

          git fetch origin +refs/heads/master:refs/remotes/origin/master
          master_sha=$(git rev-parse origin/master)

          resolve_old_base_ref() {
            local old_base="$1"
            local old_base_sha

            # Raw commit SHA (full or short). Manual `/rebase <sha>` overrides
            # land here; the checkout has fetch-depth: 0 so any reachable SHA
            # on origin is already in the local object database.
            if git cat-file -e "$old_base^{commit}" 2>/dev/null; then
              git rev-parse "$old_base^{commit}"
              return 0
            fi
            if git fetch origin "$old_base" 2>/dev/null \
               && git cat-file -e "$old_base^{commit}" 2>/dev/null; then
              git rev-parse "$old_base^{commit}"
              return 0
            fi

            if git fetch origin "+refs/heads/$old_base:refs/remotes/origin/$old_base"; then
              printf 'origin/%s\n' "$old_base"
              return 0
            fi

            echo "Old base branch $old_base no longer exists on origin; looking up merged PR head." >&2
            old_base_sha=$(
              gh pr list --repo "$REPO" --state merged --head "$old_base" \
                --json headRefOid,mergedAt \
                --jq 'sort_by(.mergedAt) | last | .headRefOid // empty' \
                || true
            )

            if [ -n "$old_base_sha" ] && git cat-file -e "$old_base_sha^{commit}" 2>/dev/null; then
              printf '%s\n' "$old_base_sha"
              return 0
            fi

            echo "Could not resolve old base $old_base; falling back to patch-id rebase onto master." >&2
            return 1
          }

          # Find the parent-stack tip from `auto-rebase-meta: pre-squash-sha=`
          # comments posted by record-pre-squash-sha.yml at merge time. Walk
          # the last 30 merged PRs (newest first), and return the first
          # recorded SHA that is an ancestor of the branch but not of master.
          # That's the lowest still-present-in-branch commit from a parent PR.
          lookup_recorded_pre_squash_sha() {
            local branch="$1"
            local recorded
            recorded=$(
              gh pr list --repo "$REPO" --state merged --base master --limit 30 \
                --json number,mergedAt,comments \
                --jq '
                  sort_by(.mergedAt) | reverse
                  | .[]
                  | .comments[]?
                  | .body
                  | capture("auto-rebase-meta: pre-squash-sha=(?<sha>[0-9a-f]{40})")?
                  | .sha
                ' || true
            )
            for sha in $recorded; do
              if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
                git fetch origin "$sha" 2>/dev/null || continue
              fi
              if git merge-base --is-ancestor "$sha" "$branch" 2>/dev/null \
                && ! git merge-base --is-ancestor "$sha" origin/master 2>/dev/null; then
                printf '%s\n' "$sha"
                return 0
              fi
            done
            return 1
          }

          # `old_base` comes from one of:
          #   - pull_request_target retarget: the previous base branch name
          #   - issue_comment `/rebase <ref>`: an explicit commit or branch
          # When it's set we use `--onto master <old-base> <branch>` so the
          # rebase transplants only the PR's own commits. When unset we use
          # patch-id rebase against master (`git rebase master`), which works
          # for non-stacked PRs but can conflict on stacks where a parent
          # was rebased before squash-merging.
          while read -r pr_number branch old_base; do
            [ -z "$pr_number" ] && continue
            echo "::group::PR #$pr_number ($branch)"

            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"

            before_sha=$(git rev-parse HEAD)
            strategy=""
            if [ -n "${old_base:-}" ]; then
              if old_base_ref=$(resolve_old_base_ref "$old_base"); then
                echo "Rebasing $branch onto origin/master from old base $old_base ($old_base_ref)."
                rebase_args=(--onto origin/master "$old_base_ref" "$branch")
                strategy="--onto master from \`$old_base\` (\`$old_base_ref\`)"
              else
                rebase_args=("$master_sha")
                strategy="patch-id rebase onto master (\`$old_base\` could not be resolved)"
              fi
            else
              base=$(git merge-base HEAD "$master_sha")
              if [ "$base" = "$master_sha" ]; then
                echo "Already up to date with master."
                run_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
                gh pr comment "$pr_number" --repo "$REPO" --body \
                  "🤖 auto-rebase: already up to date with master, no rebase needed. ([log]($run_url))" \
                  || true
                git checkout --detach "$master_sha"
                echo "::endgroup::"
                continue
              fi
              # Look for a recorded pre-squash tip on a recently merged PR
              # whose SHA appears in this branch's ancestry but isn't on
              # master. record-pre-squash-sha.yml posts these markers when
              # any PR merges; squash-merge would otherwise collapse parent
              # commits into a new SHA, hiding the boundary from patch-id.
              if inferred_base=$(lookup_recorded_pre_squash_sha "$branch"); then
                echo "Rebasing $branch onto origin/master from recorded parent tip $inferred_base."
                rebase_args=(--onto origin/master "$inferred_base" "$branch")
                inferred_short=$(git rev-parse --short "$inferred_base")
                strategy="--onto master from recorded parent tip \`$inferred_short\`"
              else
                # `git rebase master` drops patches already in master by patch-id.
                # Works for unstacked PRs and shallow stacks; conflicts on
                # stacks where a parent rebased before squash-merging without
                # a recorded marker — in that case the user follows up with
                # `/rebase <commit>` to give an explicit base.
                rebase_args=("$master_sha")
                strategy="patch-id rebase onto master"
              fi
            fi

            run_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
            before_short=$(git rev-parse --short "$before_sha")
            if git rebase "${rebase_args[@]}"; then
              after_short=$(git rev-parse --short HEAD)
              if git push --force-with-lease origin "$branch"; then
                echo "Rebased and pushed."
                gh pr comment "$pr_number" --repo "$REPO" --body \
                  "🤖 auto-rebase: rebased \`$branch\` (\`$before_short\` → \`$after_short\`) using $strategy. ([log]($run_url))" \
                  || true
              else
                echo "Push rejected (branch moved). Skipping."
                gh pr comment "$pr_number" --repo "$REPO" --body \
                  "🤖 auto-rebase: rebase succeeded but force-push was rejected (branch moved). Try \`/rebase\` again, or rebase manually. ([log]($run_url))" \
                  || true
              fi
            else
              echo "Rebase conflict on PR #$pr_number; aborting."
              git rebase --abort || true
              gh pr comment "$pr_number" --repo "$REPO" --body \
                "🤖 auto-rebase: hit a conflict using $strategy. Try \`/rebase <commit>\` with the parent stack tip, or rebase locally. ([log]($run_url))" \
                || true
            fi

            git rebase --abort 2>/dev/null || true
            git checkout --detach "$master_sha"
            echo "::endgroup::"
          done < prs.txt
