name: CI

# Build-only. Production deploys are handled by the separate Deploy workflow
# (mini-ca runs the prod container via `make run env=prod`).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same PR/branch to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repo: nothing comments on PRs, pushes tags, or
# publishes packages. Codecov authenticates with its own token rather than the
# workflow's, so read-only `contents` covers the whole file.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_tests: ${{ steps.filter.outputs.backend_tests }}
      smoke: ${{ steps.filter.outputs.smoke }}
      web: ${{ steps.filter.outputs.web }}
      companion: ${{ steps.filter.outputs.companion }}
      companion_image: ${{ steps.filter.outputs.companion_image }}
      docker: ${{ steps.filter.outputs.docker }}
      scripts: ${{ steps.filter.outputs.scripts }}
      gradle_lint: ${{ steps.filter.outputs.gradle_lint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend_tests:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            smoke:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - '*.html'
              - 'web/**/*.js'
              - 'web/**/*.css'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            companion:
              - 'companion/**'
              - '.github/workflows/ci.yml'
            # Wider than `companion`: Compose owns the build (context, image
            # name), so a compose edit can break the image without touching
            # companion/. Kept separate from `docker` so a JS-only change
            # doesn't drag in a fat-jar build, and vice versa.
            companion_image:
              - 'companion/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            # The image is a thin runtime wrapper around the fat jar, so a
            # backend change is as much an image change as the Dockerfile is.
            # Frontend/static files are bind-mounted into sandboxes at runtime,
            # so a frontend-only PR also needs a GHCR image pushed or the
            # sandbox image-wait will time out.
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
              - 'web/**'
              - 'index.html'
              - 'availability.html'
              - 'watches.html'
              - '.github/workflows/ci.yml'
            # Everything the fast lint half reads: Grafana dashboards, the
            # secrets registry + vault tooling, and the Python that ruff and
            # the unittest sweep cover.
            scripts:
              - 'scripts/**'
              - 'secrets/**'
              - 'grafana/**'
              - '.github/workflows/ci.yml'
            # Generous on purpose: anything that can change what ktlint or
            # detekt see — Kotlin sources, the custom rule set, detekt config,
            # ktlint's .editorconfig, or the Gradle build that wires them up —
            # has to re-lint. A path missing here is a lint that silently
            # stops running.
            gradle_lint:
              - 'backend/**'
              - 'detekt-rules/**'
              - 'config/detekt/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - '.editorconfig'
              - '.github/workflows/ci.yml'

  # The fast, JVM-free half of linting. The Gradle half (ktlint/detekt) is
  # gradle-lint below — split so a docs-adjacent scripts/ change doesn't pay
  # for a Gradle daemon, and a backend change doesn't pay for pipx.
  lint:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate Grafana dashboards
        run: python3 scripts/validate_grafana_dashboards.py

      # The registry is the source of truth; docker-compose.secrets.yml is
      # generated from it. `generate --check` fails if the committed file is
      # stale, so `consumers` cannot drift from what Compose actually runs.
      # Needs no age key — CI never decrypts anything.
      - name: Validate secrets registry
        run: |
          python3 secrets/manage.py generate --check
          python3 secrets/manage.py check

      # The backend has ktlint and detekt; the repo's Python had nothing, which
      # left the vault tooling in secrets/manage.py unlinted. Rules are passed
      # here rather than in a ruff.toml deliberately: this is the correctness
      # core (pyflakes, syntax/import errors, bugbear) that the tree is already
      # clean against. Ruff's built-in default additionally enables a broad
      # pylint/style surface with ~65 pre-existing hits — adopting that is its
      # own cleanup. py39 is a real floor, not caution: macOS Command Line
      # Tools ships 3.9, and these fetchers run on dev machines, so UP must not
      # rewrite `dt.timezone.utc` into the 3.11-only `dt.UTC`.
      # Pinned so a ruff release can't change the lint verdict mid-PR; bump
      # deliberately.
      - name: ruff
        run: |
          pipx install ruff==0.16.0
          ruff check --isolated --target-version py39 \
            --select E4,E7,E9,F,B,UP secrets/ scripts/

      # Was `-p 'test_secrets.py'`, which ran 1 of the 10 script test modules
      # and let the other 9 rot — two of them were red on master for months.
      - name: Script + secrets tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  gradle-lint:
    needs: changes
    if: needs.changes.outputs.gradle_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck -x :backend:generateJooq
      - name: detekt
        run: ./gradlew :backend:detekt
      - name: detekt rule tests
        run: ./gradlew :detekt-rules:test

  # web/ has no package.json: the suites are dependency-free node:test modules
  # importing the browser sources directly, so there is nothing to install.
  web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Enumerated with find and handed to node as an explicit list rather than
      # left to a `web/**/*.test.mjs` pattern. The pattern is correct today
      # (verified: same 153 tests either way), but it only works while quoted —
      # unquoted, a shell without globstar collapses `**` to one directory level
      # and silently runs a subset. A job that goes green having tested a
      # fraction of the suite is worse than no job, so discovery is asserted
      # rather than trusted.
      - name: Run web unit tests
        run: |
          set --
          while IFS= read -r f; do set -- "$@" "$f"; done \
            < <(find web -name '*.test.mjs' | sort)
          echo "discovered $# web test files"
          if [ "$#" -eq 0 ]; then
            echo "no web test files found - discovery is broken"
            exit 1
          fi
          node --test "$@"

      # tokens.css is the only place a raw color may live. A hex that slips in
      # elsewhere survives every theme override, so this gates the same job.
      - name: Check color tokens
        run: node scripts/check-color-tokens.mjs

  companion-tests:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      # --ignore-scripts skips Playwright's browser download (~100MB+). The
      # suites stub the browser and only need `playwright` to resolve as a
      # module — src/browser.js imports it at load time, so omitting the
      # install entirely fails every suite that reaches it.
      - name: Install companion dependencies
        working-directory: companion
        run: npm ci --ignore-scripts
      - name: Run companion tests
        working-directory: companion
        run: npm test

  # The other half of what `make run env=prod` builds. Production builds this
  # one through Compose (`$(PROD_COMPOSE) build recgov-companion`), not `docker
  # build`, so CI drives the same Compose service rather than a hand-written
  # equivalent — otherwise a broken companion/Dockerfile, a failing `npm ci`
  # layer, or a build-context change still reaches mini-ca unbuilt and fails
  # mid-deploy. scripts/test_ci_image_builds.py asserts CI keeps building
  # everything the prod recipe does.
  companion-image:
    needs: changes
    if: needs.changes.outputs.companion_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # docker-compose.yml alone: docker-compose.secrets.yml only adds runtime
      # `secrets:` entries sourced from environment values CI deliberately
      # doesn't hold, and contributes nothing to the build.
      #
      # No GHA layer cache here, deliberately: Compose owns this build (that
      # parity with prod is the whole point of the job), and routing buildx
      # `--cache-to type=gha` through `docker compose build` needs either
      # cache_from/cache_to entries in the compose file or a `buildx bake`
      # indirection — both fork the build away from what prod actually runs.
      # BuildKit is pinned on explicitly so within-build layer reuse still
      # applies; cross-run caching lives on the plain-`docker build` backend
      # job below. If compose-native GHA cache lands upstream, revisit.
      - name: Build companion image
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
        run: docker compose -f docker-compose.yml --profile recgov-companion build recgov-companion

  # A broken Dockerfile used to surface for the first time on the prod host,
  # mid-deploy. The image only wraps the fat jar, so the jar has to exist first
  # — same order as `make run env=prod`.
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      # Container-driver builder: the default docker driver can't export a
      # cache, and `type=gha` needs an exporter. `install: true` aliases
      # `docker build` to buildx on this builder — without it the literal
      # `docker build` below still hits the docker driver and dies with
      # "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          install: true

      # BuildKit's gha cache backend authenticates with the runner's
      # cache-service credentials, which GitHub hands to JS actions but not to
      # `run` steps. docker/build-push-action wires them up internally, but
      # this job builds via the `docker build` CLI on purpose — the prod recipe
      # does, and scripts/test_ci_image_builds.py holds CI to it — so export
      # them for the step below instead. ACTIONS_CACHE_URL is deliberately NOT
      # exported: it points at the retired v1 cache service, which now answers
      # every request with an HTML "services aren't available" 400, and its
      # presence steers BuildKit away from the v2 endpoint (ACTIONS_RESULTS_URL).
      - name: Expose cache-service credentials to buildx
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      # --load lands the image in the local daemon the way plain `docker build`
      # does; the container-driver builder otherwise keeps it to itself.
      # ignore-error on cache-to: a cache-service outage should cost us the
      # cache, not the build — export failures are otherwise fatal.
      - name: Build backend image
        run: |
          docker build -t roadtrip/backend --target backend --load \
            --cache-from type=gha,scope=backend-image \
            --cache-to type=gha,scope=backend-image,mode=max,ignore-error=true \
            .

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image by SHA
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          # On pull_request events github.sha is the ephemeral merge commit, not
          # the PR branch tip.  The sandbox workflow resolves pr.head.sha and
          # polls GHCR for that tag — so we must push the head SHA, not the
          # merge SHA.  On push (master) github.event.pull_request.head.sha is
          # empty and the expression falls through to github.sha.
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          docker tag roadtrip/backend "$IMAGE:${SHA}"
          docker push "$IMAGE:${SHA}"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend_tests == 'true'
    # gradle test runs Testcontainers (Postgis-flavored Postgres in Docker).
    # ubuntu runners ship Docker, so this Just Works without service containers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run backend tests + coverage
        run: ./gradlew :backend:test :backend:koverXmlReport :backend:koverVerify

      # fail_ci_if_error was false, so a Codecov outage (or a revoked token)
      # silently removed the coverage gate instead of failing the run.
      #
      # Skipped for Dependabot: its runs can't read the Actions secrets store,
      # so CODECOV_TOKEN is empty and the tokenless upload is rejected on the
      # protected branch. Coverage doesn't change on a dependency bump anyway.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: backend/build/reports/kover/report.xml
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kover-report
          path: backend/build/reports/kover/
          retention-days: 7

  smoke:
    needs: [changes, backend-tests]
    if: >-
      always() &&
      needs.changes.outputs.smoke == 'true' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped')
    # End-to-end: importer hydrates Postgres from data/, backend serves
    # static site + /api/*, Playwright-JVM drives Chromium against it.
    # Mirrors the local `make qa` flow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadtrip
          POSTGRES_USER: roadtrip
          POSTGRES_PASSWORD: roadtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The backend takes its DB coordinates from the profile file, not env
      # vars, so the service container above must match what
      # application-local.yaml hardcodes: db roadtrip, user roadtrip, password
      # roadtrip, on localhost:5432. Change one and you must change the other.
      ROADTRIP_PROFILE: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - name: Start backend
        run: |
          jar=$(find backend/build/libs -name 'roadtrip-backend-*-all.jar' | head -1)
          PORT=8765 ROADTRIP_STATIC_DIR="${{ github.workspace }}" \
            nohup java -jar "$jar" > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8765/api/health >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; tail -100 backend.log; exit 1

      # Seed the canonical catalog with a tiny fixture so the serving smoke has
      # rows to render.
      # The new ETL pipeline is pinned out of CI for now (it needs upstream
      # auth + WAF-shaped fetches that don't fit here); this row gives the
      # FE a Banff/Parks-Canada-shaped Aspira pin which matches what the
      # smoke clicks on. Fetch + import remain exercisable locally via Tilt.
      #
      # Post-V44 shape: campground rows carry provider identity directly; the
      # old vendor_ref tables and canonical materialized views no longer exist.
      - name: Seed canonical catalog with smoke fixture
        run: |
          PGPASSWORD=roadtrip psql -h localhost -U roadtrip -d roadtrip <<'SQL'
          WITH campground AS (
              INSERT INTO campgrounds (
                  name, kind, data_provider, data_provider_ref, booking_provider, booking_provider_ref,
                  location, management, reservation_url, source_payload
              ) VALUES (
                  'Tunnel Mountain - Village 1',
                  'federal',
                  'aspira',
                  '-2147483648:-2147483622',
                  'aspira',
                  'pc:-2147483648:-2147483622:-2147483646',
                  '{"region":"AB","country":"CA"}'::jsonb,
                  '{"agency":"Parks Canada"}'::jsonb,
                  'https://reservation.pc.gc.ca/',
                  '{"transactionLocationId":-2147483648,"mapId":-2147483622,"resourceLocationId":-2147483646,"upstream":{"host":"reservation.pc.gc.ca","match_kind":"fixture"}}'::jsonb
              )
              RETURNING id
          ),
          poi AS (
              INSERT INTO pois (poi_type, geom)
              VALUES (
                  'campground',
                  ST_SetSRID(ST_GeomFromGeoJSON(
                      '{"type":"Point","coordinates":[-115.5309, 51.1917]}'
                  ), 4326)
              )
              RETURNING id
          )
          INSERT INTO poi_campgrounds (poi_id, campground_id)
          SELECT poi.id, campground.id
          FROM poi, campground;
          SQL

      # Chromium is a fixed-version (~150MB) download the install task otherwise
      # re-fetches every run (~40s). Cache it, keyed on the Playwright version
      # itself so only a real version bump invalidates it — hashing all of
      # build.gradle.kts churned the cache on every unrelated build edit. On a
      # hit installPlaywrightBrowsers is a no-op.
      - name: Extract Playwright version
        id: playwright
        run: |
          version="$(grep -oP 'playwrightVersion = "\K[^"]+' backend/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "playwrightVersion not found in backend/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright version: $version"
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      # -x generateJooq: the fat-jar step above already compiled main, so the
      # generated jOOQ sources exist and codegen's build-time Postgres isn't
      # needed again here (installing the browser only needs the smokeTest
      # classpath, which compiles the single SmokeTest class).
      - name: Install Playwright Chromium
        run: ./gradlew :backend:installPlaywrightBrowsers -x :backend:generateJooq

      - name: Run smoke
        run: QA_BASE_URL=http://127.0.0.1:8765 ./gradlew :backend:smokeTest --rerun -x :backend:generateJooq

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-test-reports
          path: backend/build/reports/tests/test/
          retention-days: 7

  # The single branch-protection check. The path-gated jobs above skip
  # routinely, so protection can't require them individually — a required
  # check that never reports blocks the merge forever. This aggregates:
  # skipped counts as pass (the filter decided the job wasn't needed), while
  # failure or cancellation of anything fails the whole run.
  ci-passed:
    needs:
      - changes
      - lint
      - gradle-lint
      - web-tests
      - companion-tests
      - companion-image
      - docker-build
      - backend-tests
      - smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad="$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')"
          if [ -n "$bad" ]; then
            echo "failed or cancelled: $bad"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"
