name: CI

# Build-only. Production deploys are handled by the separate Deploy workflow
# (mini-ca runs the prod container via `make run env=prod`).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same PR/branch to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repo: nothing comments on PRs, pushes tags, or
# publishes packages. Codecov authenticates with its own token rather than the
# workflow's, so read-only `contents` covers the whole file.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_tests: ${{ steps.filter.outputs.backend_tests }}
      smoke: ${{ steps.filter.outputs.smoke }}
      web: ${{ steps.filter.outputs.web }}
      companion: ${{ steps.filter.outputs.companion }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_tests:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            smoke:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - '*.html'
              - 'web/**/*.js'
              - 'web/**/*.css'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            companion:
              - 'companion/**'
              - '.github/workflows/ci.yml'
            # The image is a thin runtime wrapper around the fat jar, so a
            # backend change is as much an image change as the Dockerfile is.
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Grafana dashboards
        run: python3 scripts/validate_grafana_dashboards.py

      # The registry is the source of truth; docker-compose.secrets.yml is
      # generated from it. `generate --check` fails if the committed file is
      # stale, so `consumers` cannot drift from what Compose actually runs.
      # Needs no age key — CI never decrypts anything.
      - name: Validate secrets registry
        run: |
          python3 secrets/manage.py generate --check
          python3 secrets/manage.py check

      # The backend has ktlint and detekt; the repo's Python had nothing, which
      # left the vault tooling in secrets/manage.py unlinted. Rules are passed
      # here rather than in a ruff.toml deliberately: this is the correctness
      # core (pyflakes, syntax/import errors, bugbear) that the tree is already
      # clean against. Ruff's built-in default additionally enables a broad
      # pylint/style surface with ~65 pre-existing hits — adopting that is its
      # own cleanup. py39 is a real floor, not caution: macOS Command Line
      # Tools ships 3.9, and these fetchers run on dev machines, so UP must not
      # rewrite `dt.timezone.utc` into the 3.11-only `dt.UTC`.
      - name: ruff
        run: |
          pipx install ruff
          ruff check --isolated --target-version py39 \
            --select E4,E7,E9,F,B,UP secrets/ scripts/

      # Was `-p 'test_secrets.py'`, which ran 1 of the 10 script test modules
      # and let the other 9 rot — two of them were red on master for months.
      - name: Script + secrets tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck -x :backend:generateJooq
      - name: detekt
        run: ./gradlew :backend:detekt
      - name: detekt rule tests
        run: ./gradlew :detekt-rules:test

  # web/ has no package.json: the suites are dependency-free node:test modules
  # importing the browser sources directly, so there is nothing to install.
  web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Enumerated with find and handed to node as an explicit list rather than
      # left to a `web/**/*.test.mjs` pattern. The pattern is correct today
      # (verified: same 153 tests either way), but it only works while quoted —
      # unquoted, a shell without globstar collapses `**` to one directory level
      # and silently runs a subset. A job that goes green having tested a
      # fraction of the suite is worse than no job, so discovery is asserted
      # rather than trusted.
      - name: Run web unit tests
        run: |
          set --
          while IFS= read -r f; do set -- "$@" "$f"; done \
            < <(find web -name '*.test.mjs' | sort)
          echo "discovered $# web test files"
          if [ "$#" -eq 0 ]; then
            echo "no web test files found - discovery is broken"
            exit 1
          fi
          node --test "$@"

  companion-tests:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      # --ignore-scripts skips Playwright's browser download (~100MB+). The
      # suites stub the browser and only need `playwright` to resolve as a
      # module — src/browser.js imports it at load time, so omitting the
      # install entirely fails every suite that reaches it.
      - name: Install companion dependencies
        working-directory: companion
        run: npm ci --ignore-scripts
      - name: Run companion tests
        working-directory: companion
        run: npm test

  # A broken Dockerfile used to surface for the first time on the prod host,
  # mid-deploy. The image only wraps the fat jar, so the jar has to exist first
  # — same order as `make run env=prod`.
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar
      - name: Build backend image
        run: docker build -t roadtrip/backend --target backend .

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend_tests == 'true'
    # gradle test runs Testcontainers (Postgis-flavored Postgres in Docker).
    # ubuntu runners ship Docker, so this Just Works without service containers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run backend tests + coverage
        run: ./gradlew :backend:test :backend:koverXmlReport :backend:koverVerify

      # fail_ci_if_error was false, so a Codecov outage (or a revoked token)
      # silently removed the coverage gate instead of failing the run.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/build/reports/kover/report.xml
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: backend/build/reports/kover/
          retention-days: 7

  smoke:
    needs: [changes, backend-tests]
    if: >-
      always() &&
      needs.changes.outputs.smoke == 'true' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped')
    # End-to-end: importer hydrates Postgres from data/, backend serves
    # static site + /api/*, Playwright-JVM drives Chromium against it.
    # Mirrors the local `make qa` flow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadtrip
          POSTGRES_USER: roadtrip
          POSTGRES_PASSWORD: roadtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROADTRIP_DB_URL: jdbc:postgresql://localhost:5432/roadtrip
      ROADTRIP_DB_USER: roadtrip
      ROADTRIP_DB_PASSWORD: roadtrip
      DISPATCH_COMPANION_TOKEN: ci-dispatch-companion-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - name: Start backend
        run: |
          jar=$(ls backend/build/libs/roadtrip-backend-*-all.jar | head -1)
          PORT=8765 ROADTRIP_STATIC_DIR="${{ github.workspace }}" \
            nohup java -jar "$jar" > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8765/api/health >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; tail -100 backend.log; exit 1

      # Seed the canonical catalog with a tiny fixture so the serving smoke has
      # rows to render.
      # The new ETL pipeline is pinned out of CI for now (it needs upstream
      # auth + WAF-shaped fetches that don't fit here); this row gives the
      # FE a Banff/Parks-Canada-shaped Aspira pin which matches what the
      # smoke clicks on. Fetch + import remain exercisable locally via Tilt.
      #
      # Post-V44 shape: campground rows carry provider identity directly; the
      # old vendor_ref tables and canonical materialized views no longer exist.
      - name: Seed canonical catalog with smoke fixture
        run: |
          PGPASSWORD=roadtrip psql -h localhost -U roadtrip -d roadtrip <<'SQL'
          WITH campground AS (
              INSERT INTO campgrounds (
                  name, kind, data_provider, data_provider_ref, booking_provider, booking_provider_ref,
                  location, management, reservation_url, source_payload
              ) VALUES (
                  'Tunnel Mountain - Village 1',
                  'federal',
                  'aspira',
                  '-2147483648:-2147483622',
                  'aspira',
                  'pc:-2147483648:-2147483622:-2147483646',
                  '{"region":"AB","country":"CA"}'::jsonb,
                  '{"agency":"Parks Canada"}'::jsonb,
                  'https://reservation.pc.gc.ca/',
                  '{"transactionLocationId":-2147483648,"mapId":-2147483622,"resourceLocationId":-2147483646,"upstream":{"host":"reservation.pc.gc.ca","match_kind":"fixture"}}'::jsonb
              )
              RETURNING id
          ),
          poi AS (
              INSERT INTO pois (poi_type, geom)
              VALUES (
                  'campground',
                  ST_SetSRID(ST_GeomFromGeoJSON(
                      '{"type":"Point","coordinates":[-115.5309, 51.1917]}'
                  ), 4326)
              )
              RETURNING id
          )
          INSERT INTO poi_campgrounds (poi_id, campground_id)
          SELECT poi.id, campground.id
          FROM poi, campground;
          SQL

      # Chromium is a fixed-version (~150MB) download the install task otherwise
      # re-fetches every run (~40s). Cache it, keyed on build.gradle.kts so a
      # Playwright version bump invalidates the cache and reinstalls. On a hit
      # installPlaywrightBrowsers is a no-op.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/build.gradle.kts') }}
          restore-keys: ${{ runner.os }}-playwright-

      # -x generateJooq: the fat-jar step above already compiled main, so the
      # generated jOOQ sources exist and codegen's build-time Postgres isn't
      # needed again here (installing the browser only needs the smokeTest
      # classpath, which compiles the single SmokeTest class).
      - name: Install Playwright Chromium
        run: ./gradlew :backend:installPlaywrightBrowsers -x :backend:generateJooq

      - name: Run smoke
        run: QA_BASE_URL=http://127.0.0.1:8765 ./gradlew :backend:smokeTest --rerun -x :backend:generateJooq

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: backend/build/reports/tests/test/
          retention-days: 7
