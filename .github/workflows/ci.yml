name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_tests: ${{ steps.filter.outputs.backend_tests }}
      smoke: ${{ steps.filter.outputs.smoke }}
      frontend: ${{ steps.filter.outputs.frontend }}
      companion: ${{ steps.filter.outputs.companion }}
      companion_image: ${{ steps.filter.outputs.companion_image }}
      data_image: ${{ steps.filter.outputs.data_image }}
      scripts: ${{ steps.filter.outputs.scripts }}
      gradle_lint: ${{ steps.filter.outputs.gradle_lint }}
      schema_equivalence: ${{ steps.filter.outputs.schema_equivalence }}
      package_tests: ${{ steps.filter.outputs.package_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend_tests:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'codecov.yml'
              # A hand edit to the generated API types must run the backend job that
              # checks them, even in an otherwise frontend-only PR.
              - 'frontend/src/api/generated/**'
              - '.github/workflows/ci.yml'
            smoke:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'scripts/build-workspaces.mjs'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'scripts/build-workspaces.mjs'
              - 'scripts/check-color-tokens.mjs'
              - 'scripts/check-feature-boundaries.mjs'
              - 'scripts/check-feature-boundaries.test.mjs'
              - 'scripts/check-package-boundaries.mjs'
              - 'scripts/check-package-boundaries.test.mjs'
              - 'scripts/check-css-blocks.mjs'
              - 'scripts/check-token-usage.mjs'
              - '.github/workflows/ci.yml'
            companion:
              - 'companion/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            companion_image:
              - 'companion/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/companion-image-key.sh'
              - '.github/workflows/ci.yml'
            data_image:
              - 'data/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'secrets/**'
              - 'grafana/**'
              - 'deploy/**'
              - 'Dockerfile'
              - 'Tiltfile'
              - 'docker-compose*.yml'
              - '.github/actions/**'
              - '.github/workflows/**'
            # Both sides of the comparison, because the drift being caught is a
            # Flyway migration landing with no matching Drizzle change — a filter
            # watching only packages/ would skip the gate on exactly that push.
            # packages/** rather than packages/db/**: campsiteKinds from
            # @roadtrip/domain is baked into the campsites_kind_wire_check
            # constraint, so a domain edit alone can move the emitted schema.
            schema_equivalence:
              - 'packages/**'
              - 'backend/src/main/resources/db/migration/**'
              - 'scripts/schema-equivalence.mjs'
              - 'scripts/schema-equivalence.test.mjs'
              - 'scripts/schema-reference.mjs'
              - 'scripts/schema-reference.test.mjs'
              - 'scripts/build-workspaces.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            package_tests:
              - 'packages/**'
              - 'scripts/schema-reference.mjs'
              - 'scripts/schema-reference.d.mts'
              - 'scripts/build-workspaces.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            gradle_lint:
              - 'backend/**'
              - 'detekt-rules/**'
              - 'config/detekt/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - '.editorconfig'
              - '.github/workflows/ci.yml'

  # Flyway stores a checksum for every migration it has applied, so a V*.sql
  # that already ran is immutable. Editing one only surfaces at deploy time,
  # against the one database that already has the old checksum recorded — which
  # is exactly how it bit us before. Catch it on the PR instead.
  migration-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject edits to applied migrations
        env:
          BASE_REF: ${{ github.base_ref }}
          MIGRATION_DIR: backend/src/main/resources/db/migration
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # Added files are fine; R__*.sql repeatables are re-applied by design.
          touched="$(git diff --name-status --diff-filter=MDR \
            "origin/${BASE_REF}...HEAD" -- "$MIGRATION_DIR" \
            | awk -F'\t' '$2 ~ /\/V[^\/]*\.sql$/')"
          if [ -n "$touched" ]; then
            echo "::error::Applied Flyway migrations are immutable."
            printf '%s\n' "$touched"
            echo
            echo "Flyway records a checksum for every migration it applies, so"
            echo "editing, renaming, or deleting a V*.sql that already ran makes"
            echo "validation fail on the next deploy against an existing database."
            echo "Add a new V<n>__*.sql that carries the change forward instead."
            exit 1
          fi
          echo "No applied migrations were modified."

  # Claude Code creates worktrees with `git sparse-checkout set --cone`, which can
  # only enumerate directories to include — it cannot subtract one. So the list in
  # .claude/settings.json has to name every directory we want, and a new top-level
  # directory that nobody adds there just goes missing from worktrees. Deliberately
  # unfiltered: the change that needs catching is a directory no path filter knows
  # about yet.
  worktree-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Claude worktree sparsePaths
        run: node scripts/check-worktree-sparse-paths.mjs

  lockfile-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every install resolves from the root lockfile
        run: node --test scripts/check-single-lockfile.test.mjs

  image-key-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the companion image tag covers everything its build reads
        run: python3 -m unittest scripts.test_ci_image_builds -v

  lint:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Grafana dashboards
        run: python3 scripts/validate_grafana_dashboards.py

      - name: Validate secrets registry
        run: |
          python3 secrets/manage.py generate --check
          python3 secrets/manage.py check

      - name: ruff
        run: |
          pipx install ruff==0.16.0
          ruff check --isolated --target-version py39 \
            --select E4,E7,E9,F,B,UP secrets/ scripts/

      - name: Script + secrets tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  gradle-lint:
    needs: changes
    if: needs.changes.outputs.gradle_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # Mirrored locally by `make test` (see Makefile), which runs these same
      # checks in one Gradle invocation. generateJooq is excluded here only
      # because ktlint runs on its own in this job and needs no generated
      # sources; make cannot exclude it, since the same invocation compiles
      # and runs :backend:test.
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck -x :backend:generateJooq
      - name: detekt
        run: ./gradlew :backend:detekt
      - name: detekt rule tests
        run: ./gradlew :detekt-rules:test

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Check frontend architecture
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Check package boundaries
        run: |
          node --test scripts/check-package-boundaries.test.mjs
          node scripts/check-package-boundaries.mjs

      - name: Check color tokens
        run: node scripts/check-color-tokens.mjs

      - name: Check CSS block structure
        run: node scripts/check-css-blocks.mjs

      - name: Check design token usage
        run: node scripts/check-token-usage.mjs

  # Mirrored locally by `make test`. packages/db no longer builds on install, so
  # the gate needs `npm run build` ahead of it — the same prelude frontend-tests
  # runs, which is why this is its own job rather than a step there: that job has
  # no business booting Postgres, and backend-tests has Docker but no npm install.
  # The amd64-only PostGIS image runs natively on these runners, so the emulation
  # cost paid locally does not apply here.
  schema-equivalence:
    needs: changes
    if: needs.changes.outputs.schema_equivalence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      # The test file, not the bare script: its container subtest makes the same
      # clean comparison the script does and then injects a column to prove the
      # gate can still fail, at the same single PostGIS boot. The pooler subtest
      # skips when its sidecar cannot be established, so a fixture cannot fail
      # this job.
      - name: Check the Drizzle migrations still reproduce the Flyway schema
        run: node --test scripts/schema-equivalence.test.mjs

      # normalize is what the comparison above trusts. These tests are the ones
      # that fail when an edit to it stops distinguishing types, nullability or
      # defaults — the one change the injected-column proof cannot see.
      - name: Check the schema normalizer still distinguishes what the gate compares
        run: node --test scripts/schema-reference.test.mjs

  # Mirrored locally by `make test`. One job for both suites: the domain suite
  # runs in well under a second, so a job of its own would spend more on
  # checkout, npm ci and build than it ever saved. The db suite boots PostGIS
  # containers, which is why this sits apart from frontend-tests.
  package-tests:
    needs: changes
    if: needs.changes.outputs.package_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Run @roadtrip/domain tests
        run: npm run test --workspace @roadtrip/domain

      - name: Run @roadtrip/db tests
        run: npm run test --workspace @roadtrip/db

      # tsconfig.json leaves the test files out of the build and vitest strips
      # types without checking them, so these are the only steps that type-check
      # the tests (and scripts/schema-reference.d.mts).
      - name: Type-check @roadtrip/domain including tests
        run: npm run typecheck --workspace @roadtrip/domain

      - name: Type-check @roadtrip/db including tests
        run: npm run typecheck --workspace @roadtrip/db

  companion-tests:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install companion dependencies
        run: npm ci --workspace campsite-companion --ignore-scripts
      - name: Run companion tests
        working-directory: companion
        run: npm test

  companion-image:
    needs: changes
    if: needs.changes.outputs.companion_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build companion image
        run: docker build -f companion/Dockerfile -t roadtrip/recgov-companion .

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push companion image by input hash
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          INPUT_HASH="$(scripts/companion-image-key.sh)"
          IMAGE="ghcr.io/${{ github.repository }}/recgov-companion:${INPUT_HASH}"
          docker tag roadtrip/recgov-companion "$IMAGE"
          docker push "$IMAGE"

  data-image:
    needs: changes
    if: needs.changes.outputs.data_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build data image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          TREE_SHA="$(git rev-parse HEAD:data)"
          IMAGE="ghcr.io/${{ github.repository }}/data:${TREE_SHA}"
          docker build \
            --build-arg "ROADTRIP_DATA_SHA=${TREE_SHA}" \
            -t "$IMAGE" \
            data

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push data image by tree SHA
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TREE_SHA="$(git rev-parse HEAD:data)"
          IMAGE="ghcr.io/${{ github.repository }}/data:${TREE_SHA}"
          docker push "$IMAGE"

  docker-build:
    needs: changes
    # Unconditional on push: deploy pulls backend:<sha> for every master commit,
    # so the image must exist even when the commit touched nothing it builds.
    # On PRs, skip the fat-jar + buildx build only when nothing that lands in
    # the image changed — `smoke` covers backend/frontend/gradle, `scripts`
    # covers the Dockerfile, compose files and deploy tooling. Kept wider than
    # the image's own inputs on purpose: `/sandbox` on a PR waits on
    # backend:<head-sha>, so a PR that plausibly gets a sandbox must build one.
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.smoke == 'true' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose cache-service credentials to buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: Build backend image
        run: |
          docker buildx build -t roadtrip/backend --target backend --load \
            --cache-from type=gha,scope=backend-image \
            --cache-to type=gha,scope=backend-image,mode=max,ignore-error=true \
            .

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image by SHA
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          docker tag roadtrip/backend "$IMAGE:${SHA}"
          docker push "$IMAGE:${SHA}"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # checkApiTypes and contractLedgerCheck both run over the backend's own
      # classpath, so they need the same compile — and therefore the same Docker —
      # :backend:test already needs. They belong here, never in gradle-lint.
      - name: Run backend tests + coverage + contract checks
        run: ./gradlew :backend:test :backend:koverXmlReport :backend:koverVerify :backend:checkApiTypes :backend:contractLedgerCheck

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/build/reports/kover/report.xml
          flags: backend
          # Advisory: fork PRs get no CODECOV_TOKEN and Codecov outages are not
          # a coverage regression. koverVerify above is the hard gate.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kover-report
          path: backend/build/reports/kover/
          retention-days: 7

  smoke:
    # Deliberately not `needs: backend-tests`. Smoke shares no artifact with
    # it -- it re-checks-out and rebuilds the fat jar and frontend itself --
    # so that edge only ever served to spare a runner when the unit tests were
    # already red. It cost every master push the sum of the two jobs before
    # deploy could start, and `ci-passed` fails on either one regardless, so
    # the gate is unchanged by running them side by side.
    needs: [changes]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadtrip
          POSTGRES_USER: roadtrip
          POSTGRES_PASSWORD: roadtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROADTRIP_PROFILE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - name: Build frontend
        run: |
          npm ci --workspace roadtrip-frontend
          npm run build --workspace roadtrip-frontend

      - name: Start backend
        run: |
          jar=$(find backend/build/libs -name 'roadtrip-backend-*-all.jar' | head -1)
          PORT=8765 ROADTRIP_STATIC_DIR="${{ github.workspace }}" \
            nohup java -jar "$jar" > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8765/api/health >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; tail -100 backend.log; exit 1

      - name: Seed canonical catalog with smoke fixture
        run: |
          PGPASSWORD=roadtrip psql -h localhost -U roadtrip -d roadtrip <<'SQL'
          WITH campground AS (
              INSERT INTO campgrounds (
                  name, kind, data_provider, data_provider_ref, booking_provider, booking_provider_ref,
                  location, management, reservation_url, source_payload
              ) VALUES (
                  'Tunnel Mountain - Village 1',
                  'federal',
                  'aspira',
                  '-2147483648:-2147483622',
                  'aspira',
                  'pc:-2147483648:-2147483622:-2147483646',
                  '{"region":"AB","country":"CA"}'::jsonb,
                  '{"agency":"Parks Canada"}'::jsonb,
                  'https://reservation.pc.gc.ca/',
                  '{"transactionLocationId":-2147483648,"mapId":-2147483622,"resourceLocationId":-2147483646,"upstream":{"host":"reservation.pc.gc.ca","match_kind":"fixture"}}'::jsonb
              )
              RETURNING id
          ),
          poi AS (
              INSERT INTO pois (poi_type, geom)
              VALUES (
                  'campground',
                  ST_SetSRID(ST_GeomFromGeoJSON(
                      '{"type":"Point","coordinates":[-115.5309, 51.1917]}'
                  ), 4326)
              )
              RETURNING id
          )
          INSERT INTO poi_campgrounds (poi_id, campground_id)
          SELECT poi.id, campground.id
          FROM poi, campground;
          SQL

      - name: Extract Playwright version
        id: playwright
        run: |
          version="$(grep -oP 'playwrightVersion = "\K[^"]+' backend/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "playwrightVersion not found in backend/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright version: $version"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: ./gradlew :backend:installPlaywrightBrowsers -x :backend:generateJooq

      - name: Run smoke
        run: QA_BASE_URL=http://127.0.0.1:8765 ./gradlew :backend:smokeTest --rerun -x :backend:generateJooq

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-reports
          path: backend/build/reports/tests/smokeTest/
          retention-days: 7

  ci-passed:
    needs:
      - changes
      - migration-guard
      - worktree-guard
      - lockfile-guard
      - image-key-guard
      - lint
      - gradle-lint
      - frontend-tests
      - schema-equivalence
      - package-tests
      - companion-tests
      - companion-image
      - data-image
      - docker-build
      - backend-tests
      - smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad="$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')"
          if [ -n "$bad" ]; then
            echo "failed or cancelled: $bad"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"
