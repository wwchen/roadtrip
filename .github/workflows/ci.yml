name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_tests: ${{ steps.filter.outputs.backend_tests }}
      smoke: ${{ steps.filter.outputs.smoke }}
      frontend: ${{ steps.filter.outputs.frontend }}
      companion: ${{ steps.filter.outputs.companion }}
      companion_image: ${{ steps.filter.outputs.companion_image }}
      data_image: ${{ steps.filter.outputs.data_image }}
      scripts: ${{ steps.filter.outputs.scripts }}
      gradle_lint: ${{ steps.filter.outputs.gradle_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend_tests:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            smoke:
              - 'backend/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/check-color-tokens.mjs'
              - 'scripts/check-feature-boundaries.mjs'
              - 'scripts/check-feature-boundaries.test.mjs'
              - 'scripts/check-css-blocks.mjs'
              - 'scripts/check-token-usage.mjs'
              - '.github/workflows/ci.yml'
            companion:
              - 'companion/**'
              - '.github/workflows/ci.yml'
            companion_image:
              - 'companion/**'
              - '.github/workflows/ci.yml'
            data_image:
              - 'data/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'secrets/**'
              - 'grafana/**'
              - 'deploy/**'
              - 'Dockerfile'
              - 'Tiltfile'
              - 'docker-compose*.yml'
              - '.github/actions/**'
              - '.github/workflows/**'
            gradle_lint:
              - 'backend/**'
              - 'detekt-rules/**'
              - 'config/detekt/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - '.editorconfig'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Grafana dashboards
        run: python3 scripts/validate_grafana_dashboards.py

      - name: Validate secrets registry
        run: |
          python3 secrets/manage.py generate --check
          python3 secrets/manage.py check

      - name: ruff
        run: |
          pipx install ruff==0.16.0
          ruff check --isolated --target-version py39 \
            --select E4,E7,E9,F,B,UP secrets/ scripts/

      - name: Script + secrets tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  gradle-lint:
    needs: changes
    if: needs.changes.outputs.gradle_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: ktlint
        run: ./gradlew :backend:ktlintCheck -x :backend:generateJooq
      - name: detekt
        run: ./gradlew :backend:detekt
      - name: detekt rule tests
        run: ./gradlew :detekt-rules:test

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend architecture
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Check color tokens
        run: node scripts/check-color-tokens.mjs

      - name: Check CSS block structure
        run: node scripts/check-css-blocks.mjs

      - name: Check design token usage
        run: node scripts/check-token-usage.mjs

  companion-tests:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install companion dependencies
        working-directory: companion
        run: npm ci --ignore-scripts
      - name: Run companion tests
        working-directory: companion
        run: npm test

  companion-image:
    needs: changes
    if: needs.changes.outputs.companion_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build companion image
        run: docker build -t roadtrip/recgov-companion ./companion

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push companion image by tree SHA
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TREE_SHA="$(git rev-parse HEAD:companion)"
          IMAGE="ghcr.io/${{ github.repository }}/recgov-companion:${TREE_SHA}"
          docker tag roadtrip/recgov-companion "$IMAGE"
          docker push "$IMAGE"

  data-image:
    needs: changes
    if: needs.changes.outputs.data_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build data image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          TREE_SHA="$(git rev-parse HEAD:data)"
          IMAGE="ghcr.io/${{ github.repository }}/data:${TREE_SHA}"
          docker build \
            --build-arg "ROADTRIP_DATA_SHA=${TREE_SHA}" \
            -t "$IMAGE" \
            data

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push data image by tree SHA
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TREE_SHA="$(git rev-parse HEAD:data)"
          IMAGE="ghcr.io/${{ github.repository }}/data:${TREE_SHA}"
          docker push "$IMAGE"

  docker-build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expose cache-service credentials to buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: Build backend image
        run: |
          docker buildx build -t roadtrip/backend --target backend --load \
            --cache-from type=gha,scope=backend-image \
            --cache-to type=gha,scope=backend-image,mode=max,ignore-error=true \
            .

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image by SHA
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          docker tag roadtrip/backend "$IMAGE:${SHA}"
          docker push "$IMAGE:${SHA}"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run backend tests + coverage
        run: ./gradlew :backend:test :backend:koverXmlReport :backend:koverVerify

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/build/reports/kover/report.xml
          flags: backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-report
          path: backend/build/reports/kover/
          retention-days: 7

  smoke:
    needs: [changes, backend-tests]
    if: >-
      always() &&
      needs.changes.outputs.smoke == 'true' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadtrip
          POSTGRES_USER: roadtrip
          POSTGRES_PASSWORD: roadtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadtrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROADTRIP_PROFILE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build backend fat-jar
        run: ./gradlew :backend:buildFatJar

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start backend
        run: |
          jar=$(find backend/build/libs -name 'roadtrip-backend-*-all.jar' | head -1)
          PORT=8765 ROADTRIP_STATIC_DIR="${{ github.workspace }}" \
            nohup java -jar "$jar" > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8765/api/health >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"; tail -100 backend.log; exit 1

      - name: Seed canonical catalog with smoke fixture
        run: |
          PGPASSWORD=roadtrip psql -h localhost -U roadtrip -d roadtrip <<'SQL'
          WITH campground AS (
              INSERT INTO campgrounds (
                  name, kind, data_provider, data_provider_ref, booking_provider, booking_provider_ref,
                  location, management, reservation_url, source_payload
              ) VALUES (
                  'Tunnel Mountain - Village 1',
                  'federal',
                  'aspira',
                  '-2147483648:-2147483622',
                  'aspira',
                  'pc:-2147483648:-2147483622:-2147483646',
                  '{"region":"AB","country":"CA"}'::jsonb,
                  '{"agency":"Parks Canada"}'::jsonb,
                  'https://reservation.pc.gc.ca/',
                  '{"transactionLocationId":-2147483648,"mapId":-2147483622,"resourceLocationId":-2147483646,"upstream":{"host":"reservation.pc.gc.ca","match_kind":"fixture"}}'::jsonb
              )
              RETURNING id
          ),
          poi AS (
              INSERT INTO pois (poi_type, geom)
              VALUES (
                  'campground',
                  ST_SetSRID(ST_GeomFromGeoJSON(
                      '{"type":"Point","coordinates":[-115.5309, 51.1917]}'
                  ), 4326)
              )
              RETURNING id
          )
          INSERT INTO poi_campgrounds (poi_id, campground_id)
          SELECT poi.id, campground.id
          FROM poi, campground;
          SQL

      - name: Extract Playwright version
        id: playwright
        run: |
          version="$(grep -oP 'playwrightVersion = "\K[^"]+' backend/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "playwrightVersion not found in backend/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "playwright version: $version"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: ./gradlew :backend:installPlaywrightBrowsers -x :backend:generateJooq

      - name: Run smoke
        run: QA_BASE_URL=http://127.0.0.1:8765 ./gradlew :backend:smokeTest --rerun -x :backend:generateJooq

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-reports
          path: backend/build/reports/tests/smokeTest/
          retention-days: 7

  ci-passed:
    needs:
      - changes
      - lint
      - gradle-lint
      - frontend-tests
      - companion-tests
      - companion-image
      - data-image
      - docker-build
      - backend-tests
      - smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          bad="$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')"
          if [ -n "$bad" ]; then
            echo "failed or cancelled: $bad"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"
