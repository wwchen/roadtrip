name: Deploy

# SSHes to mini-ca, fast-forwards the deploy checkout, then runs
# `make run env=prod` with GitHub-provided production secrets/vars exported
# for Docker Compose. Wraps a Tailscale join (mini-ca isn't on the public
# internet) around the SSH step.
#
# Triggers only when files that affect the running service change. Doc-only
# pushes, RFCs, and Tilt config don't burn deploy minutes. Manual override
# via workflow_dispatch for "redeploy without a code change" needs.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'grafana/**'
      - 'data/**'
      - 'docker-compose*.yml'
      - 'index.html'
      - 'availability.html'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# Don't queue concurrent deploys — if a second push lands while the first
# is still running, cancel-in-progress would risk leaving the stack in a
# partial state. Serial: latest push waits, but completes the running run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: bind to a GitHub Environment if you want approval gates or
    # per-env secrets. Leaving unset for now keeps things simple.
    # environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Join the tailnet so we can ssh mini-ca over Tailscale. OAuth client
      # is preferred over a static auth key: scoped to the `ci` tag, the
      # node is ephemeral, and the credentials can be rotated without
      # touching the workflow.
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key — fail fast if mini-ca's identity ever changes.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Single ssh invocation so any failure (git pull, Gradle build, image
      # build, Compose up, targeted restarts) returns non-zero and fails the
      # workflow. The generated remote script is piped over SSH, not printed,
      # so secret values don't land in logs.
      - name: Deploy on mini-ca
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'mini-ca' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'mini' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/workspace/roadtrip' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'roadtrip' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'roadtrip' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER || 'admin' }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_DB_USER: ${{ vars.GRAFANA_DB_USER || 'grafana_reader' }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://roadtrip.floo.ca/dash/' }}
          GRAFANA_SLACK_WEBHOOK_URL: ${{ secrets.GRAFANA_SLACK_WEBHOOK_URL }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          TESLA_COOKIES: ${{ secrets.TESLA_COOKIES }}
          COOKIE_BOT_URL: ${{ vars.COOKIE_BOT_URL }}
          COOKIE_BOT_TOKEN: ${{ secrets.COOKIE_BOT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.SLACK_ALERT_CHANNEL || secrets.SLACK_ALERT_CHANNEL }}
        run: |
          {
            printf 'export DEPLOY_DIR=%q\n' "$DEPLOY_DIR"
            printf 'export BACKEND_IMAGE=%q\n' "roadtrip/backend"
            for name in \
              POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
              GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD \
              GRAFANA_DB_USER GRAFANA_DB_PASSWORD GRAFANA_ROOT_URL GRAFANA_SLACK_WEBHOOK_URL \
              CLOUDFLARE_TUNNEL_TOKEN MAPBOX_TOKEN RIDB_API_KEY TESLA_COOKIES \
              COOKIE_BOT_URL COOKIE_BOT_TOKEN SLACK_BOT_TOKEN SLACK_ALERT_CHANNEL
            do
              value="${!name:-}"
              if [ -n "$value" ]; then
                printf 'export %s=%q\n' "$name" "$value"
              fi
            done
            cat <<'REMOTE'
          set -euo pipefail
          deploy_dir="${DEPLOY_DIR/#\~/$HOME}"
          cd "$deploy_dir"
          before=$(git rev-parse HEAD)
          git pull --ff-only
          after=$(git rev-parse HEAD)
          DEPLOY_BEFORE_SHA="$before" DEPLOY_AFTER_SHA="$after" make run env=prod
          REMOTE
          } | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se'

      - name: Health check
        run: |
          # Probe via the public tunnel URL so we're verifying what users see,
          # not the LAN-side container. Override DEPLOY_HEALTH_URL via repo
          # variable if the tunnel hostname changes.
          base="${{ vars.DEPLOY_BASE_URL || 'https://roadtrip.floo.ca' }}"
          health_url="${{ vars.DEPLOY_HEALTH_URL || 'https://roadtrip.floo.ca/api/health' }}"
          for _ in $(seq 1 30); do
            if curl -fsS "$health_url" >/dev/null; then
              for path in /pois /reservables /watches /availability; do
                curl -fsS "$base$path" >/dev/null
                echo "health: $base$path OK"
              done
              echo "health: $health_url OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed: $health_url"
          exit 1
