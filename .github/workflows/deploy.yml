name: Deploy

# SSHes to mini-ca, fast-forwards the deploy checkout, then runs
# `make run env=prod`. Runtime secrets pass through this workflow without being
# read by it: they ride along encrypted in secrets/, and the host decrypts them
# with its own age key into /run/secrets mounts. CI deliberately holds no
# decryption key — the secrets below are credentials *for* the pipeline, not app
# config. A push that changes only secrets/ still has to deploy, though, which is
# why that path is a trigger: the vault is where runtime config lives. Wraps a
# Tailscale join (mini-ca isn't on the public internet) around the SSH step.
#
# Triggers only when files that affect the running service change. Doc-only
# pushes, RFCs, and Tilt config don't burn deploy minutes. Manual override
# via workflow_dispatch for "redeploy without a code change" needs.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'grafana/**'
      - 'data/**'
      - 'docker-compose*.yml'
      - 'index.html'
      - 'availability.html'
      - 'web/**'
      # A vault change is a runtime config change: the host decrypts these on
      # deploy, so a new client id or rotated token has to reach it the same way
      # code does. Without this, `manage.py set` lands on master and never ships.
      - 'secrets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# Don't queue concurrent deploys — if a second push lands while the first
# is still running, cancel-in-progress would risk leaving the stack in a
# partial state. Serial: latest push waits, but completes the running run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: bind to a GitHub Environment if you want approval gates or
    # per-env secrets. Leaving unset for now keeps things simple.
    # environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Join the tailnet so we can ssh mini-ca over Tailscale. OAuth client
      # is preferred over a static auth key: scoped to the `ci` tag, the
      # node is ephemeral, and the credentials can be rotated without
      # touching the workflow.
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key — fail fast if mini-ca's identity ever changes.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Single ssh invocation so any failure (git pull, Gradle build, image
      # build, or Compose recreate) returns non-zero and fails the workflow.
      - name: Deploy on mini-ca
        run: |
          ssh -o BatchMode=yes mini@mini-ca \
            'set -e
             cd ~/workspace/roadtrip
             git pull --ff-only
             make run env=prod
             running="$(docker compose --profile tunnel --profile pois ps --services --status running)"
             for service in backend grafana loki alloy tempo prometheus; do
               echo "$running" | grep -qx "$service"
             done'

      # The app's own prod config is the single source for its origin — the same
      # value AuthConfig derives the OIDC redirect URI from, for the same reason:
      # two sources for one URL is how you end up probing a hostname the app
      # stopped serving. The repo variables remain as overrides for a tunnel
      # rename, but the default is read, not restated.
      - name: Resolve deploy URLs
        run: |
          root_url="$(ruby -ryaml -e 'puts YAML.safe_load(File.read("backend/src/main/resources/application-prod.yaml"))["roadtrip"]["web"]["root-url"]')"
          # Trailing slash stripped the way WebAppConfig strips it, so "$base$path"
          # can't produce a doubled slash.
          base="${{ vars.DEPLOY_BASE_URL }}"
          base="${base:-${root_url%/}}"
          health="${{ vars.DEPLOY_HEALTH_URL }}"
          {
            echo "DEPLOY_BASE=$base"
            echo "DEPLOY_HEALTH=${health:-$base/api/health}"
          } >> "$GITHUB_ENV"
          echo "resolved base: $base"

      - name: Health check
        run: |
          # Probe via the public tunnel URL so we're verifying what users see,
          # not the LAN-side container.
          for _ in $(seq 1 30); do
            if curl -fsS "$DEPLOY_HEALTH" >/dev/null; then
              for path in /pois /reservables /watches /availability; do
                curl -fsS "$DEPLOY_BASE$path" >/dev/null
                echo "health: $DEPLOY_BASE$path OK"
              done
              echo "health: $DEPLOY_HEALTH OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed: $DEPLOY_HEALTH"
          exit 1

      # The checks above pass with sign-in completely broken: every page returns
      # 200 and /api/me reports auth_enabled:true whenever the three auth secrets
      # are merely *present*. Only the provider knows whether the client id and
      # callback URL it received are ones it recognises, so drive one real hop of
      # the handshake and let it answer.
      - name: Verify sign-in handshake
        run: |
          # Not `status`: zsh makes that read-only, so anyone pasting this to
          # debug by hand gets a confusing failure instead of a result.
          http_code="$(curl -s -o /dev/null -D headers.txt -w '%{http_code}' "$DEPLOY_BASE/auth/login")"
          if [ "$http_code" != "302" ]; then
            echo "auth: $DEPLOY_BASE/auth/login returned $http_code, expected 302 (sign-in disabled?)"
            exit 1
          fi
          authorize="$(tr -d '\r' < headers.txt | sed -n 's/^[Ll]ocation: //p' | head -1)"
          if [ -z "$authorize" ]; then
            echo "auth: /auth/login redirected with no Location header"
            exit 1
          fi
          # Query string carries state/nonce/PKCE — log only the endpoint.
          echo "auth: /auth/login -> ${authorize%%\?*}"
          http_code="$(curl -s -o authorize.html -w '%{http_code}' "$authorize")"
          case "$http_code" in
            200|302) echo "auth: provider accepted the callback URL (HTTP $http_code)" ;;
            *)
              echo "auth: provider rejected the authorize request (HTTP $http_code)"
              # The reason is prose inside an HTML error page ("Callback URL
              # mismatch. <uri> is not in the list of allowed callback URLs"), so
              # strip tags rather than pattern-match a class name that will drift.
              tr -d '\n' < authorize.html \
                | sed -e 's#<style[^>]*>[^<]*</style>##g' -e 's#<script[^>]*>[^<]*</script>##g' \
                      -e 's/<[^>]*>/ /g' -e 's/  */ /g' \
                | cut -c1-400
              exit 1
              ;;
          esac

      # `ps --status running` above passes for a wedged Alloy or a full Loki disk.
      # Ask Prometheus instead. promtool ships inside the image, so this needs no
      # published ports.
      - name: Verify telemetry pipeline
        run: |
          ssh -o BatchMode=yes mini@mini-ca \
            'set -e
             cd ~/workspace/roadtrip
             q() {
               docker compose --profile tunnel --profile pois exec -T prometheus \
                 promtool query instant http://localhost:9090 "$1" \
                 | sed -n "s/.*=> \([0-9.]*\) @.*/\1/p" | head -1
             }
             # 60s agent export interval, so give a fresh stack time to fill in.
             for attempt in $(seq 1 20); do
               collectors="$(q "count(up{job=~\"alloy|loki|tempo\"} == 1) or vector(0)")"
               backend="$(q "count(jvm_thread_count) or vector(0)")"
               collectors="${collectors%%.*}"
               backend="${backend%%.*}"
               if [ "${collectors:-0}" -ge 3 ] && [ "${backend:-0}" -ge 1 ]; then
                 echo "telemetry: 3/3 collectors up, backend metrics flowing"
                 exit 0
               fi
               echo "telemetry: collectors=${collectors:-0}/3 backend_metrics=${backend:-0} (attempt $attempt)"
               sleep 10
             done
             echo "telemetry pipeline check failed"
             exit 1'
