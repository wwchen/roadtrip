name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve independently versioned images
        run: |
          echo "DEPLOY_DATA_SHA=$(git rev-parse HEAD:data)" >> "$GITHUB_ENV"
          echo "DEPLOY_COMPANION_SHA=$(git rev-parse HEAD:companion)" >> "$GITHUB_ENV"

      - name: Reach the deploy host
        uses: ./.github/actions/deploy-host-access
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Install runtime release
        uses: ./.github/actions/install-release
        with:
          host: mini@mini-ca
          sha: ${{ env.DEPLOY_SHA }}

      # The symlink flip is the last statement on purpose: deploy.sh exits
      # non-zero when the health gate fails, so `current` keeps naming the
      # release that is actually running — which is also what the script's own
      # rollback reads to find its target.
      #
      # The remote script goes through a file rather than an inline heredoc so
      # the transcript can be teed to a log the failure report reads back.
      - name: Deploy on mini-ca
        id: deploy
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/deploy-remote.sh" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          data_sha="$2"
          companion_sha="$3"
          release="$HOME/.roadtrip/releases/$sha"
          cd "$release"
          scripts/deploy.sh prod "$sha" "$data_sha" "$companion_sha" master
          ln -sfn "$release" "$HOME/.roadtrip/current"
          REMOTE
          ssh -o BatchMode=yes mini@mini-ca \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_DATA_SHA' '$DEPLOY_COMPANION_SHA'" \
            < "$RUNNER_TEMP/deploy-remote.sh" 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log"

      # deploy.sh rolls production back to the previous release when the health
      # gate fails, and the job still fails either way — so say which of the
      # three states the host was left in instead of making someone read the
      # SSH transcript to find out whether prod is serving.
      - name: Report deploy outcome
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          log="$RUNNER_TEMP/deploy.log"
          rolled_back=""
          rollback_failed=""
          no_rollback=""
          if [ -f "$log" ]; then
            rolled_back="$(sed -n 's/^==> ROLLBACK OK: //p' "$log" | tail -1)"
            rollback_failed="$(sed -n 's/^==> ROLLBACK FAILED: //p' "$log" | tail -1)"
            no_rollback="$(sed -n 's/^==> ROLLBACK UNAVAILABLE: //p' "$log" | tail -1)"
          fi
          if [ -n "$rollback_failed" ]; then
            summary="Deploy of $DEPLOY_SHA failed AND the rollback failed — production needs manual recovery: $rollback_failed"
          elif [ -n "$rolled_back" ]; then
            summary="Deploy of $DEPLOY_SHA failed; production was rolled back: $rolled_back"
          elif [ -n "$no_rollback" ]; then
            summary="Deploy of $DEPLOY_SHA failed and could not be rolled back: $no_rollback"
          else
            summary="Deploy of $DEPLOY_SHA failed before the health gate; see the step log above."
          fi
          echo "### Deploy failed" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$summary"

      - name: Report deployed commit
        run: echo "deployed $DEPLOY_SHA"

      - name: Resolve deploy URLs
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          root_url="$(python3 scripts/prod_base_url.py)"
          base="${{ vars.DEPLOY_BASE_URL }}"
          base="${base:-$root_url}"
          health="${{ vars.DEPLOY_HEALTH_URL }}"
          {
            echo "DEPLOY_BASE=$base"
            echo "DEPLOY_HEALTH=${health:-$base/api/health/ready}"
          } >> "$GITHUB_ENV"
          echo "resolved base: $base"

      # Only the readiness probe gets the outer wait loop; everything after it
      # runs once, so each of those needs its own retry or a single transient
      # blip fails a deploy that in fact succeeded.
      - name: Health check
        run: |
          gate_attempts=30
          gate_delay=2
          retries=3
          retry_delay=2
          probe() {
            curl -fsS --retry "$retries" --retry-all-errors --retry-delay "$retry_delay" "$@"
          }

          for _ in $(seq 1 "$gate_attempts"); do
            if curl -fsS "$DEPLOY_HEALTH" >/dev/null; then
              for path in / /watches /availability; do
                probe "$DEPLOY_BASE$path" >/dev/null
                echo "health: $DEPLOY_BASE$path OK"
              done
              if ! probe "$DEPLOY_BASE/" | grep -q 'id="root"'; then
                echo "health: / is not the React shell — frontend/dist missing or shadowed"
                exit 1
              fi
              echo "health: / is the React shell OK"
              probe "$DEPLOY_BASE/api/build-info" \
                | DEPLOY_SHA="$DEPLOY_SHA" python3 -c 'import json,os,sys; info=json.load(sys.stdin); expected={"env":"prod","sha":os.environ["DEPLOY_SHA"],"branch":"master"}; actual={key:info.get(key) for key in expected}; actual == expected or sys.exit(f"build-info mismatch: expected {expected}, got {actual}"); print("health: build-info prod SHA master OK")'
              echo "health: $DEPLOY_HEALTH OK"
              exit 0
            fi
            sleep "$gate_delay"
          done
          echo "health check failed: $DEPLOY_HEALTH"
          exit 1

      # These two probes read a status code rather than failing the transfer, so
      # curl's own --retry never fires on the case that matters (a transient 502
      # is a successful transfer without -f). Hence the explicit loops; the curl
      # flags still cover connection-level blips.
      - name: Verify sign-in handshake
        run: |
          retries=3
          retry_delay=2
          probe() {
            curl -s --retry "$retries" --retry-all-errors --retry-delay "$retry_delay" "$@"
          }

          http_code=""
          for attempt in $(seq 1 "$retries"); do
            http_code="$(probe -o /dev/null -D headers.txt -w '%{http_code}' "$DEPLOY_BASE/auth/login")"
            if [ "$http_code" = "302" ]; then
              break
            fi
            if [ "$attempt" -lt "$retries" ]; then
              echo "auth: /auth/login returned $http_code; retrying"
              sleep "$retry_delay"
            fi
          done
          if [ "$http_code" != "302" ]; then
            echo "auth: $DEPLOY_BASE/auth/login returned $http_code, expected 302 (sign-in disabled?)"
            exit 1
          fi
          authorize="$(tr -d '\r' < headers.txt | sed -n 's/^[Ll]ocation: //p' | head -1)"
          if [ -z "$authorize" ]; then
            echo "auth: /auth/login redirected with no Location header"
            exit 1
          fi
          echo "auth: /auth/login -> ${authorize%%\?*}"
          http_code=""
          for attempt in $(seq 1 "$retries"); do
            http_code="$(probe -o authorize.html -w '%{http_code}' "$authorize")"
            case "$http_code" in
              200|302) break ;;
            esac
            if [ "$attempt" -lt "$retries" ]; then
              echo "auth: provider returned $http_code; retrying"
              sleep "$retry_delay"
            fi
          done
          case "$http_code" in
            200|302) echo "auth: provider accepted the callback URL (HTTP $http_code)" ;;
            *)
              echo "auth: provider rejected the authorize request (HTTP $http_code)"
              tr -d '\n' < authorize.html \
                | sed -e 's#<style[^>]*>[^<]*</style>##g' -e 's#<script[^>]*>[^<]*</script>##g' \
                      -e 's/<[^>]*>/ /g' -e 's/  */ /g' \
                | cut -c1-400
              exit 1
              ;;
          esac

      - name: Verify telemetry pipeline
        run: |
          ssh -o BatchMode=yes mini@mini-ca "bash -s -- '$DEPLOY_DATA_SHA'" <<'REMOTE'
          set -e
          data_sha="$1"
          cd "$HOME/.roadtrip/current"
          export ROADTRIP_DATA_VOLUME="roadtrip-data-$data_sha"
          q() {
            docker compose --profile tunnel --profile pois exec -T prometheus \
              promtool query instant http://localhost:9090 "$1" \
              | sed -n "s/.*=> \([0-9.]*\) @.*/\1/p" | head -1
          }
          for attempt in $(seq 1 20); do
            collectors="$(q "count(up{job=~\"alloy|loki|tempo\"} == 1) or vector(0)")"
            backend="$(q "count(jvm_thread_count) or vector(0)")"
            collectors="${collectors%%.*}"
            backend="${backend%%.*}"
            if [ "${collectors:-0}" -ge 3 ] && [ "${backend:-0}" -ge 1 ]; then
              echo "telemetry: 3/3 collectors up, backend metrics flowing"
              exit 0
            fi
            echo "telemetry: collectors=${collectors:-0}/3 backend_metrics=${backend:-0} (attempt $attempt)"
            sleep 10
          done
          echo "telemetry pipeline check failed"
          exit 1
          REMOTE
