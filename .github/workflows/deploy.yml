name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve independently versioned images
        run: |
          echo "DEPLOY_DATA_SHA=$(git rev-parse HEAD:data)" >> "$GITHUB_ENV"
          echo "DEPLOY_COMPANION_SHA=$(git rev-parse HEAD:companion)" >> "$GITHUB_ENV"

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.98.10

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install runtime release
        uses: ./.github/actions/install-release
        with:
          host: mini@mini-ca
          sha: ${{ env.DEPLOY_SHA }}

      - name: Deploy on mini-ca
        run: |
          ssh -o BatchMode=yes mini@mini-ca "bash -s -- '$DEPLOY_SHA' '$DEPLOY_DATA_SHA' '$DEPLOY_COMPANION_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          data_sha="$2"
          companion_sha="$3"
          release="$HOME/.roadtrip/releases/$sha"
          cd "$release"
          scripts/deploy.sh prod "$sha" "$data_sha" "$companion_sha" master
          ln -sfn "$release" "$HOME/.roadtrip/current"
          REMOTE

      - name: Report deployed commit
        run: echo "deployed $DEPLOY_SHA"

      - name: Resolve deploy URLs
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          root_url="$(python3 scripts/prod_base_url.py)"
          base="${{ vars.DEPLOY_BASE_URL }}"
          base="${base:-$root_url}"
          health="${{ vars.DEPLOY_HEALTH_URL }}"
          {
            echo "DEPLOY_BASE=$base"
            echo "DEPLOY_HEALTH=${health:-$base/api/health/ready}"
          } >> "$GITHUB_ENV"
          echo "resolved base: $base"

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$DEPLOY_HEALTH" >/dev/null; then
              for path in / /watches /availability; do
                curl -fsS "$DEPLOY_BASE$path" >/dev/null
                echo "health: $DEPLOY_BASE$path OK"
              done
              if ! curl -fsS "$DEPLOY_BASE/" | grep -q 'id="root"'; then
                echo "health: / is not the React shell — frontend/dist missing or shadowed"
                exit 1
              fi
              echo "health: / is the React shell OK"
              curl -fsS "$DEPLOY_BASE/api/build-info" \
                | DEPLOY_SHA="$DEPLOY_SHA" python3 -c 'import json,os,sys; info=json.load(sys.stdin); expected={"env":"prod","sha":os.environ["DEPLOY_SHA"],"branch":"master"}; actual={key:info.get(key) for key in expected}; actual == expected or sys.exit(f"build-info mismatch: expected {expected}, got {actual}"); print("health: build-info prod SHA master OK")'
              echo "health: $DEPLOY_HEALTH OK"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed: $DEPLOY_HEALTH"
          exit 1

      - name: Verify sign-in handshake
        run: |
          http_code="$(curl -s -o /dev/null -D headers.txt -w '%{http_code}' "$DEPLOY_BASE/auth/login")"
          if [ "$http_code" != "302" ]; then
            echo "auth: $DEPLOY_BASE/auth/login returned $http_code, expected 302 (sign-in disabled?)"
            exit 1
          fi
          authorize="$(tr -d '\r' < headers.txt | sed -n 's/^[Ll]ocation: //p' | head -1)"
          if [ -z "$authorize" ]; then
            echo "auth: /auth/login redirected with no Location header"
            exit 1
          fi
          echo "auth: /auth/login -> ${authorize%%\?*}"
          http_code="$(curl -s -o authorize.html -w '%{http_code}' "$authorize")"
          case "$http_code" in
            200|302) echo "auth: provider accepted the callback URL (HTTP $http_code)" ;;
            *)
              echo "auth: provider rejected the authorize request (HTTP $http_code)"
              tr -d '\n' < authorize.html \
                | sed -e 's#<style[^>]*>[^<]*</style>##g' -e 's#<script[^>]*>[^<]*</script>##g' \
                      -e 's/<[^>]*>/ /g' -e 's/  */ /g' \
                | cut -c1-400
              exit 1
              ;;
          esac

      - name: Verify telemetry pipeline
        run: |
          ssh -o BatchMode=yes mini@mini-ca "bash -s -- '$DEPLOY_DATA_SHA'" <<'REMOTE'
          set -e
          data_sha="$1"
          cd "$HOME/.roadtrip/current"
          export ROADTRIP_DATA_VOLUME="roadtrip-data-$data_sha"
          q() {
            docker compose --profile tunnel --profile pois exec -T prometheus \
              promtool query instant http://localhost:9090 "$1" \
              | sed -n "s/.*=> \([0-9.]*\) @.*/\1/p" | head -1
          }
          for attempt in $(seq 1 20); do
            collectors="$(q "count(up{job=~\"alloy|loki|tempo\"} == 1) or vector(0)")"
            backend="$(q "count(jvm_thread_count) or vector(0)")"
            collectors="${collectors%%.*}"
            backend="${backend%%.*}"
            if [ "${collectors:-0}" -ge 3 ] && [ "${backend:-0}" -ge 1 ]; then
              echo "telemetry: 3/3 collectors up, backend metrics flowing"
              exit 0
            fi
            echo "telemetry: collectors=${collectors:-0}/3 backend_metrics=${backend:-0} (attempt $attempt)"
            sleep 10
          done
          echo "telemetry pipeline check failed"
          exit 1
          REMOTE
