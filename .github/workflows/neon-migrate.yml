name: Neon migrate

on:
  workflow_call:
    secrets:
      NEON_MIGRATE_URL:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: neon-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply Neon migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_MIGRATE_URL is not set; Neon migrations cannot be applied"
            exit 1
          fi
          npm run migrate --workspace @roadtrip/db
