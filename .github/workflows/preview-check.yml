name: Preview check

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read
  statuses: write

env:
  STATUS_CONTEXT: Preview check
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}
  PROBE_NAME: Mahood Lake
  PROBE_BBOX: -120.2,52.1,-120.0,52.3

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the deployment from Vercel's event
        id: target
        run: |
          event=$GITHUB_EVENT_PATH
          jq -e '.client_payload | .environment and .url and .git.sha' "$event" >/dev/null \
            || { echo "unexpected Vercel event; client_payload has: $(jq -c '.client_payload | keys? // .' "$event")"; exit 1; }
          if [ "$(jq -r .client_payload.environment "$event")" != preview ]; then echo skip=true >> "$GITHUB_OUTPUT"; exit 0; fi
          url=$(jq -r .client_payload.url "$event")
          case "$url" in https://*) ;; *) url="https://$url" ;; esac
          { echo skip=false; echo "url=$url"; echo "sha=$(jq -r .client_payload.git.sha "$event")"; } >> "$GITHUB_OUTPUT"

      - name: Mark the deployed commit pending
        if: steps.target.outputs.skip == 'false'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="Searching the preview for $PROBE_NAME"

      - name: Check out the probe script
        if: steps.target.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Search for the probe campground and open its page through the app
        if: steps.target.outputs.skip == 'false'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || { echo "VERCEL_AUTOMATION_BYPASS_SECRET is not set"; exit 1; }
          node scripts/probe-deployment.mjs catalog

      - name: Report the result on the deployed commit
        if: always() && steps.target.outputs.skip == 'false'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; description="The preview serves $PROBE_NAME"; else state=failure; description="The preview did not serve $PROBE_NAME"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="$description"
