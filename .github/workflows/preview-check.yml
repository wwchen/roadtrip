name: Preview check

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read
  statuses: write

env:
  STATUS_CONTEXT: Preview check
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Read the deployment from Vercel's event
        id: target
        run: node scripts/check-preview.mjs target --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Mark the deployed commit pending
        if: steps.target.outputs.skip == 'false'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="Searching the preview for the probe campground"

      - name: Search for the probe campground and open its page through the app
        if: steps.target.outputs.skip == 'false'
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-preview.mjs check

      - name: Report the result on the deployed commit
        if: always() && steps.target.outputs.skip == 'false'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; description="The preview serves the probe campground"; else state=failure; description="The preview did not serve the probe campground"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" -f description="$description"
