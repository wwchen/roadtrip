name: Rec.gov login probe

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - companion/src/recgovSession.js
      - companion/src/recgovLoginProbe.js
      - companion/src/runRecgovLoginProbe.js
      - .github/workflows/recgov-login-probe.yml

permissions:
  contents: read

env:
  SCREENSHOT_DIR: recgov-login-probe
  SCREENSHOT_RETENTION_DAYS: 14
  ISSUE_TITLE: The rec.gov login probe cannot find a login field
  ISSUE_LIST_LIMIT: 200
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install companion dependencies
        run: npm ci --workspace campsite-companion --ignore-scripts
      - name: Install Chromium
        working-directory: companion
        run: npx playwright install --with-deps chromium
      - name: Open rec.gov's login dialog and find each field
        id: probe
        working-directory: companion
        env:
          RECGOV_LOGIN_PROBE_SCREENSHOT_DIR: ${{ github.workspace }}/${{ env.SCREENSHOT_DIR }}
        run: npm run -s recgov:login-probe
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SCREENSHOT_DIR }}
          path: ${{ env.SCREENSHOT_DIR }}
          retention-days: ${{ env.SCREENSHOT_RETENTION_DAYS }}
          if-no-files-found: ignore

  report:
    needs: probe
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the probe's issue
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit "$ISSUE_LIST_LIMIT" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | first | .number // empty")
          if [ "$PROBE_RESULT" = success ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "The probe passed. Run: $RUN_URL"; fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing. Run: $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" --body "Run: $RUN_URL"
          fi
