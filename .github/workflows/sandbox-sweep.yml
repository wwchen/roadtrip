name: Sandbox sweep

# Backstop for sandboxes the close-teardown never retired: PRs closed before
# that job existed, teardowns that failed, and sandboxes on PRs that stay open.
# Runs entirely from GitHub Actions so it needs no host cron to be installed.
on:
  schedule:
    # Every 30 minutes, so the TTL is enforced within ~30m of expiry.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: sandbox-sweep
  cancel-in-progress: false

env:
  SANDBOX_HOST: mini@mini-ca
  # Must match deploy.sh's SANDBOX_STATE_DIR.
  SANDBOX_STATE_DIR: /var/lib/roadtrip-sandboxes

jobs:
  # Reclaiming disk is its own job, not a step on `stop`: the daemon deadlocks
  # on a full disk whether or not any sandbox needs reaping, and `stop` runs
  # only when there are targets. No `needs`, so it never delays a reap.
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Only so the local composite action below can be resolved.
      - name: Check out sweep tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reach the deploy host
        uses: ./.github/actions/deploy-host-access
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Reclaims only what we own or what Docker calls anonymous, so nothing
      # here depends on knowing what else shares the host.
      - name: Reclaim disk on the deploy host
        env:
          RECLAIM_FREE_TARGET_GB: ${{ vars.RECLAIM_FREE_TARGET_GB || 20 }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$SANDBOX_HOST" \
            "bash -s -- '$RECLAIM_FREE_TARGET_GB'" <<'REMOTE'
          set -euo pipefail
          target_gb="$1"
          free_gb() { df -Pk "$HOME" | awk 'NR==2 {print int($4 / 1024 / 1024)}'; }

          before="$(free_gb)"
          echo "==> free before: ${before}GB (target ${target_gb}GB)"

          # Label-scoped because the host is shared. Images stay dangling-only
          # so this cannot fight deploy.sh's tag retention. No build cache pass:
          # builder.gc in daemon.json caps it without racing a deploy.
          docker container prune --force \
            --filter "label=ca.floo.roadtrip.managed=true" | tail -1
          docker image prune --force \
            --filter "label=ca.floo.roadtrip.managed=true" | tail -1
          docker volume prune --force --all \
            --filter "label=ca.floo.roadtrip.managed=true" | tail -1
          # Without --all this reaches only anonymous volumes, so no named one
          # is ever a candidate however long its stack has been down.
          docker volume prune --force | tail -1

          after="$(free_gb)"
          echo "==> free after: ${after}GB (reclaimed $(( after - before ))GB)"
          docker system df
          if [ "$after" -lt "$target_gb" ]; then
            echo "::warning::deploy host has ${after}GB free, under the ${target_gb}GB target; deploys will fail preflight until space is reclaimed"
          fi
          REMOTE

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.decide.outputs.targets }}
      count: ${{ steps.decide.outputs.count }}

    steps:
      # Only so the local composite action below can be resolved.
      - name: Check out sweep tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reach the deploy host
        uses: ./.github/actions/deploy-host-access
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: List live sandboxes
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$SANDBOX_HOST" \
            "bash -s -- '$SANDBOX_STATE_DIR'" > "$RUNNER_TEMP/sandboxes.tsv" <<'REMOTE'
          set -euo pipefail
          state_dir="$1"
          shopt -s nullglob
          for meta in "$state_dir"/*.meta; do
            name="$(basename "$meta" .meta)"
            start=""
            while IFS='=' read -r key val; do
              [[ "$key" == "START_EPOCH" ]] && start="$val"
            done < "$meta"
            printf '%s\t%s\n' "$name" "${start:-0}"
          done
          REMOTE
          echo "==> live sandboxes (name, start epoch):"
          cat "$RUNNER_TEMP/sandboxes.tsv"

      - name: Decide what to reap
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SANDBOX_TTL_HOURS: ${{ vars.SANDBOX_TTL_HOURS || 2 }}
        with:
          script: |
            const fs = require('fs');
            const ttlHours = Number(process.env.SANDBOX_TTL_HOURS);
            const ttlSeconds = ttlHours * 3600;
            const now = Math.floor(Date.now() / 1000);
            const lines = fs
              .readFileSync(`${process.env.RUNNER_TEMP}/sandboxes.tsv`, 'utf8')
              .split('\n')
              .filter(line => line.trim());

            const targets = [];
            for (const line of lines) {
              const [name, startRaw] = line.split('\t');
              const start = Number(startRaw);
              // A marker with no usable START_EPOCH is itself a dangling
              // sandbox, so treat it as infinitely old rather than skipping it.
              const age = Number.isFinite(start) && start > 0 ? now - start : Infinity;
              let reason = null;

              const pr = /^pr(\d+)$/.exec(name);
              if (pr) {
                try {
                  const { data } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: Number(pr[1]),
                  });
                  if (data.state === 'closed') reason = 'its PR is closed';
                } catch (error) {
                  if (error.status !== 404) throw error;
                  reason = 'its PR no longer exists';
                }
              }
              if (!reason && age === Infinity) {
                reason = 'its start time could not be read';
              } else if (!reason && age > ttlSeconds) {
                reason = `it passed the ${ttlHours}h limit`;
              }

              if (reason) {
                targets.push({ name, reason, pr: pr ? pr[1] : '' });
                core.info(`reap ${name} — ${reason}`);
              } else {
                core.info(`keep ${name} — age ${Math.round(age / 60)}m`);
              }
            }

            core.setOutput('targets', JSON.stringify(targets));
            core.setOutput('count', String(targets.length));
            core.summary.addRaw(
              targets.length
                ? `Reaping ${targets.length}: ` +
                    targets.map(t => `\`${t.name}\` (${t.reason})`).join(', ')
                : 'No sandboxes to reap.',
            );
            await core.summary.write();

  stop:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One bad sandbox must not strand the others, and teardown prunes images
      # on the shared deploy host, so serialise.
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - name: Check out sandbox tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plan is a snapshot; require-existing keeps a sandbox torn down in
      # the meantime from failing the sweep. Sandboxes named other than pr<N>
      # have no PR, so pr-number is blank and no comment is posted.
      - name: Stop sandbox
        uses: ./.github/actions/sandbox
        with:
          operation: stop
          slug: ${{ matrix.target.name }}
          require-existing: 'true'
          pr-number: ${{ matrix.target.pr }}
          reason: ${{ matrix.target.reason }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          github-token: ${{ github.token }}
