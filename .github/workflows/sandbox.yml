name: Sandbox

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed, synchronize]
  workflow_dispatch:
    inputs:
      operation:
        description: What to do
        type: choice
        options:
          - start
          - stop
        default: start
        required: true
      slug:
        description: Sandbox slug, e.g. pr532 or demo
        type: string
        required: true
      branch:
        description: Branch to deploy; defaults to the branch this run was launched from (start only)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  packages: read
  pull-requests: write

concurrency:
  group: >-
    sandbox-${{ github.event.issue.number || github.event.pull_request.number
    || github.event.inputs.slug }}
  cancel-in-progress: false

jobs:
  sandbox:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'synchronize' || github.event.action == 'closed') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/sandbox'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Collapses both entry points into one shape: what to do, to which slug,
      # from which ref, and whether there is a PR to report back to.
      - name: Resolve request
        id: req
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const SANDBOX_TORN_DOWN_HEADING = '### 🛑 Sandbox torn down';
            const SANDBOX_TEARING_DOWN_HEADING = '### 🔄 Sandbox: Tearing down';
            const SANDBOX_TEARDOWN_FAILED_HEADING = '### ❌ Sandbox teardown failed';

            function setRequest(request) {
              core.setOutput('operation', request.operation || 'skip');
              core.setOutput('slug', request.slug || '');
              core.setOutput('branch', request.branch || '');
              core.setOutput('ref', request.ref || '');
              core.setOutput('pr_number', request.prNumber || '');
              core.setOutput('trigger', request.trigger || '');
              core.setOutput('require_existing', request.requireExisting || 'false');
              core.setOutput('reason', request.reason || '');
            }

            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs;
              const branch = inputs.branch || context.ref.replace('refs/heads/', '');
              setRequest({
                operation: inputs.operation,
                slug: inputs.slug,
                branch,
                ref: branch,
                trigger: 'manual dispatch',
              });
              core.info(`dispatch: ${inputs.operation} ${inputs.slug} from ${branch}`);
              return;
            }

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const marker = `<!-- sandbox-status:pr${pr.number} -->`;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              const teardownStatus = existing && (
                existing.body.includes(SANDBOX_TORN_DOWN_HEADING) ||
                existing.body.includes(SANDBOX_TEARING_DOWN_HEADING) ||
                existing.body.includes(SANDBOX_TEARDOWN_FAILED_HEADING)
              );
              if (!existing || teardownStatus) {
                setRequest({ operation: 'skip', prNumber: String(pr.number) });
                core.info(`PR #${pr.number} has no active sandbox status comment; skipping ${context.payload.action}.`);
                return;
              }

              if (context.payload.action === 'closed') {
                setRequest({
                  operation: 'stop',
                  slug: `pr${pr.number}`,
                  prNumber: String(pr.number),
                  trigger: 'PR closed',
                  requireExisting: 'true',
                  reason: 'this PR closed',
                });
                core.info(`PR #${pr.number} closed; retiring existing sandbox.`);
                return;
              }

              setRequest({
                operation: 'start',
                slug: `pr${pr.number}`,
                branch: pr.head.ref,
                ref: pr.head.sha,
                prNumber: String(pr.number),
                trigger: 'new commit',
              });
              core.info(`PR #${pr.number} new head ${pr.head.sha}; redeploying existing sandbox.`);
              return;
            }

            const body = (context.payload.comment.body || '').replace(/\r/g, '').trim();
            const operation =
              body === '/sandbox' ? 'start' : body === '/sandbox stop' ? 'stop' : 'unknown';
            setRequest({
              operation,
              prNumber: String(context.issue.number),
              trigger: 'PR comment',
            });
            if (operation === 'unknown') {
              core.info(`unrecognised command: ${body}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Sandboxes are limited to branches in this repository.');
              return;
            }
            setRequest({
              operation,
              slug: `pr${context.issue.number}`,
              branch: pr.head.ref,
              ref: pr.head.sha,
              prNumber: String(context.issue.number),
              trigger: 'PR comment',
            });
            core.info(`PR #${context.issue.number} head ${pr.head.sha} ref ${pr.head.ref}`);

      - name: Post unknown-command comment
        if: steps.req.outputs.operation == 'unknown'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Unrecognised sandbox command. Valid commands:\n` +
                    `- \`/sandbox\` — spin up a sandbox for this PR\n` +
                    `- \`/sandbox stop\` — tear down the sandbox`,
            });

      - name: Status workflow started
        if: >
          steps.req.outputs.pr_number != '' &&
          (steps.req.outputs.operation == 'start' ||
           (steps.req.outputs.operation == 'stop' &&
            steps.req.outputs.require_existing != 'true'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SANDBOX_OPERATION: ${{ steps.req.outputs.operation }}
          SANDBOX_REF: ${{ steps.req.outputs.ref }}
          SANDBOX_BRANCH: ${{ steps.req.outputs.branch }}
          SANDBOX_TRIGGER: ${{ steps.req.outputs.trigger }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = Number('${{ steps.req.outputs.pr_number }}');
            const operation = process.env.SANDBOX_OPERATION;
            const isStop = operation === 'stop';
            const marker = `<!-- sandbox-status:pr${pr} -->`;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const inlineCode = value => `\`${String(value).replace(/`/g, '\\`')}\``;
            const lines = [
              `- **Status:** workflow started — [live logs](${runUrl})`,
            ];
            if (!isStop && process.env.SANDBOX_REF) {
              lines.push(`- **Commit:** ${inlineCode(process.env.SANDBOX_REF.slice(0, 12))}`);
            }
            if (!isStop && process.env.SANDBOX_BRANCH) {
              lines.push(`- **Branch:** ${inlineCode(process.env.SANDBOX_BRANCH)}`);
            }
            if (process.env.SANDBOX_TRIGGER) {
              lines.push(`- **Trigger:** ${process.env.SANDBOX_TRIGGER}`);
            }
            const body = `${marker}\n### 🔄 Sandbox: ${isStop ? 'Tearing down' : 'Deploying'}…\n` +
              lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

      # Start checks out the commit being deployed — the sandbox action reads
      # both SHAs from that tree. Stop needs only the tooling, so it takes the
      # ref this workflow was loaded from.
      - name: Check out commit to deploy
        if: steps.req.outputs.operation == 'start'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.req.outputs.ref }}

      - name: Check out sandbox tooling
        if: steps.req.outputs.operation == 'stop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sandbox
        if: steps.req.outputs.operation == 'start' || steps.req.outputs.operation == 'stop'
        uses: ./.github/actions/sandbox
        with:
          operation: ${{ steps.req.outputs.operation }}
          slug: ${{ steps.req.outputs.slug }}
          branch: ${{ steps.req.outputs.branch }}
          pr-number: ${{ steps.req.outputs.pr_number }}
          reason: ${{ steps.req.outputs.reason }}
          require-existing: ${{ steps.req.outputs.require_existing }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          github-token: ${{ github.token }}
