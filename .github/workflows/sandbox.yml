name: Sandbox

# Reacts to /sandbox (spin up) and /sandbox stop (tear down) PR comments.
# The job gate is the entire security boundary: only OWNER or COLLABORATOR
# comments can start the job.  An outsider's /sandbox comment is silently
# ignored because the job-level `if:` evaluates to false before any step runs.
#
# The workflow SSHes to mini-ca (same host as deploy.yml) over Tailscale and
# runs scripts/sandbox_up.sh or scripts/sandbox_down.sh on the host.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# Serialize per-PR so a rapid /sandbox then /sandbox stop don't race.
concurrency:
  group: sandbox-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sandbox:
    # Security gate (ALL conditions must hold):
    #   1. The comment is on a pull request (not a plain issue).
    #   2. The commenter is OWNER or COLLABORATOR of the repo.
    #   3. The comment body starts with /sandbox.
    # GitHub evaluates this before any step runs, so an unauthorized commenter
    # gets no job execution at all — not even the checkout step.
    if: >
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/sandbox')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The SSH target.  Must match deploy.yml's ssh invocations.
      SANDBOX_HOST: mini@mini-ca

    steps:
      # ── 1. Resolve PR head SHA ────────────────────────────────────────────────
      # The issue_comment event carries no PR head SHA, so we must fetch it
      # from the API.  We also capture the PR number for consistent naming.
      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('pr_number', String(context.issue.number));
            core.info(`PR #${context.issue.number} head SHA: ${pr.head.sha} ref: ${pr.head.ref}`);

      # ── 2. Parse the command ──────────────────────────────────────────────────
      # Trim the comment body and branch on EXACT matches only:
      #   /sandbox       → spin up
      #   /sandbox stop  → teardown
      #   anything else  → unknown (posts a usage comment; up/stop/host steps skip)
      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          body="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | xargs)"
          case "$body" in
            "/sandbox")
              echo "action=up" >> "$GITHUB_OUTPUT"
              echo "Parsed: up"
              ;;
            "/sandbox stop")
              echo "action=stop" >> "$GITHUB_OUTPUT"
              echo "Parsed: stop"
              ;;
            *)
              echo "action=unknown" >> "$GITHUB_OUTPUT"
              echo "Parsed: unknown (body: $body)"
              ;;
          esac

      # ── 2a. Create/reuse the status comment ──────────────────────────────────
      # A single comment per PR (keyed by a hidden marker) that we EDIT through
      # the lifecycle — triggered → deploying → live/failed — so the reviewer
      # always sees current state and a run link instead of wondering whether the
      # trigger fired.  Find-or-create keeps re-runs on one comment, not many.
      - name: Init status comment
        id: status
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'Tearing down' : 'Spinning up';
            const body = `${marker}\n### 🔄 Sandbox: ${verb}…\n` +
              `- **Commit:** \`${sha}\`\n` +
              `- **Status:** triggered — [live logs](${process.env.RUN_URL})`;
            // Reuse an existing status comment for this PR if present.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            let id;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
              id = existing.id;
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
              id = created.id;
            }
            core.setOutput('comment_id', String(id));

      # ── 2b. Post usage hint for unrecognised subcommands ─────────────────────
      - name: Post unknown-command comment
        if: steps.cmd.outputs.action == 'unknown'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Unrecognised sandbox command. Valid commands:\n` +
                    `- \`/sandbox\` — spin up a sandbox for this PR\n` +
                    `- \`/sandbox stop\` — tear down the sandbox`,
            });

      # ── 3. Wait (opportunistically) for the head-SHA GHCR image ──────────────
      # CI publishes ghcr.io/<repo>/backend:<sha> ONLY when a PR changes
      # docker-relevant paths (ci.yml `docker` filter); a scripts/docs/frontend
      # PR produces no image for its head SHA.  So this step no longer hard-fails
      # on absence: it polls briefly to let an in-progress build land (giving the
      # exact image when there is one), then proceeds regardless.  The host step
      # resolves the actual image to run — head SHA if present, else the newest
      # ancestor that has an image — so a code-less PR still gets a sandbox.
      #
      # Uses the GHCR OCI distribution API (GET .../manifests/<sha>) with a
      # bearer from the token exchange; no docker login needed for the check.
      - name: Wait for GHCR image
        if: steps.cmd.outputs.action == 'up'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # NOT `set -e`: this step is purely opportunistic — it gives an
          # in-flight CI build up to 2 min to publish the head-SHA image so the
          # sandbox runs the exact commit.  If anything here fails (token
          # exchange, network, no image), we must still PROCEED: the host step
          # resolves the real image (head or newest ancestor).  Aborting here
          # would defeat the fallback and strand a code-less PR.
          set -uo pipefail
          image_ref="ghcr.io/${REPO}/backend:${HEAD_SHA}"
          echo "Polling briefly for head-SHA image: ${image_ref}"

          token_url="https://ghcr.io/token?scope=repository:${REPO}/backend:pull&service=ghcr.io"
          bearer="$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" "$token_url" 2>/dev/null \
                    | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null)"
          if [ -z "${bearer}" ]; then
            echo "Could not get a GHCR token; skipping the opportunistic wait — host step resolves the image."
            exit 0
          fi

          # Short opportunistic wait (6 × 20 s = 2 min): long enough to catch a
          # build that's finishing, short enough not to stall a code-less PR.
          MAX_ATTEMPTS=6
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            status="$(curl -sL -o /dev/null -w '%{http_code}' \
                       -H "Authorization: Bearer ${bearer}" \
                       "https://ghcr.io/v2/${REPO}/backend/manifests/${HEAD_SHA}")"
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: HTTP ${status}"
            if [ "$status" = "200" ]; then
              echo "Head-SHA image present: ${image_ref}"
              exit 0
            fi
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep 20
          done
          echo "No head-SHA image yet; the host step will fall back to the newest ancestor image."

      # ── 4. Join tailnet ───────────────────────────────────────────────────────
      # Verbatim from deploy.yml lines 187-195: same action SHA, same secrets,
      # same tags, same pinned version.
      # Guard: only join for real actions — an unknown command should post the
      # usage comment and do nothing credential-bearing.
      - name: Join tailnet
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # A concrete client version, not `latest`: a sandbox deploy should not
          # change behavior because Tailscale cut a release between two pushes.
          version: 1.98.10

      # ── 5. Configure SSH ──────────────────────────────────────────────────────
      # Verbatim from deploy.yml lines 197-211: same secret names, same
      # file paths, same chmod sequence.
      # Guard: same rationale as Join tailnet — skip for unknown commands.
      - name: Configure SSH
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Create the file 0600 *before* writing the key into it — a
          # write-then-chmod leaves a window where the default-umask file
          # holds the private key.
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          # Pinned host key — fail fast if mini-ca's identity ever changes.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ── 6. Run on host ────────────────────────────────────────────────────────
      # Host-side script availability: deploy.yml does `git fetch --prune origin`
      # then `git checkout --detach <sha>` inside ~/workspace/roadtrip (see
      # deploy.yml lines 227-234).  We mirror that pattern so the sandbox scripts
      # at the PR head SHA are present before invoking them.
      #
      # For /sandbox stop we only need the down script; we still do a fetch so the
      # sandbox_down.sh at the current HEAD is used (the name-based API is stable
      # so any recent checkout is fine, but a fetch is cheap and consistent).
      #
      # sandbox_up.sh arg contract (scripts/sandbox_up.sh):
      #   sandbox_up.sh <ref> [name]
      # When <ref> is a pure integer it auto-derives the name as "pr<N>".
      # We pass the PR NUMBER as <ref> so the name is stable across re-runs,
      # regardless of which SHA we're deploying.
      # SANDBOX_SHA is passed as an env var so the script uses it as the image tag.
      #
      # SECURITY: PR-controlled values (HEAD_SHA, HEAD_REF, PR_NUMBER) must never
      # be interpolated raw into an SSH command string — a branch name like
      # "evil';touch foo" would break out of single-quotes.  The fix has two parts:
      #
      #   (a) Validate HEAD_SHA (must be 40 hex digits) and PR_NUMBER (must be
      #       digits only) on the runner before use.  These are whitelistable.
      #
      #   (b) HEAD_REF (branch name) can contain any character Git allows, so it
      #       cannot be safely whitelisted.  Instead: base64-encode it on the runner
      #       (output is alnum+/= only, shell-safe inside single-quotes) and decode
      #       inside the remote heredoc.  The heredoc body is quoted (<<'REMOTE')
      #       so it is literal on the runner; values reach the remote shell only as
      #       positional args or via safe-character base64.
      # ── 6a. Status: deploying ────────────────────────────────────────────────
      - name: Status deploying
        if: (steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop') && steps.status.outputs.comment_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'Tearing down' : 'Deploying to the host';
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### 🔄 Sandbox: ${verb}…\n` +
                `- **Commit:** \`${sha}\`\n` +
                `- **Status:** deploying — [live logs](${process.env.RUN_URL})`,
            });

      - name: Run on host (up)
        if: steps.cmd.outputs.action == 'up'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          # Validate runner-controlled values before use.
          if ! printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::HEAD_SHA '$HEAD_SHA' is not a 40-hex SHA; aborting"
            exit 1
          fi
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::PR_NUMBER '$PR_NUMBER' is not numeric; aborting"
            exit 1
          fi
          # base64-encode the branch name: alnum+/= is safe inside single-quotes.
          HEAD_REF_B64="$(printf '%s' "$HEAD_REF" | base64 -w0)"
          ssh -o BatchMode=yes "$SANDBOX_HOST" "bash -s -- '$HEAD_SHA' '$HEAD_REF_B64' '$PR_NUMBER' '$REPO'" <<'REMOTE'
          set -euo pipefail
          head_sha="$1"
          head_ref="$(printf '%s' "$2" | base64 -d)"
          pr_number="$3"
          repo="$4"
          cd ~/workspace/roadtrip
          git fetch --prune origin
          git checkout --detach "$head_sha"

          # ── Resolve the backend IMAGE sha (may differ from the code sha) ─────
          # CI only publishes ghcr.io/<repo>/backend:<sha> when a PR changes
          # docker-relevant paths (see ci.yml `docker` filter).  A scripts/docs/
          # frontend-only PR has no image for its head SHA, so fall back to the
          # newest ANCESTOR commit that does have one — the backend jar isn't
          # PR-specific for those PRs, and the PR's own static assets/scripts
          # (checked out above / bind-mounted) are what's under review.
          # `docker manifest inspect` needs no special API scope; the host is
          # already logged in to GHCR for pulls.
          image_sha=""
          for cand in $(git rev-list --max-count=50 "$head_sha"); do
            if docker manifest inspect "ghcr.io/${repo}/backend:${cand}" >/dev/null 2>&1; then
              image_sha="$cand"; break
            fi
          done
          if [ -z "$image_sha" ]; then
            echo "error: no backend image found for $head_sha or its last 50 ancestors" >&2
            exit 1
          fi
          if [ "$image_sha" != "$head_sha" ]; then
            echo "==> no image for head $head_sha; using ancestor image $image_sha (backend jar only; PR code is checked out)"
          fi
          SANDBOX_SHA="$image_sha" SANDBOX_BRANCH="$head_ref" scripts/sandbox_up.sh "$pr_number"
          REMOTE

      - name: Run on host (stop)
        if: steps.cmd.outputs.action == 'stop'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          # Validate PR_NUMBER before use.
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::PR_NUMBER '$PR_NUMBER' is not numeric; aborting"
            exit 1
          fi
          ssh -o BatchMode=yes "$SANDBOX_HOST" "bash -s -- '$PR_NUMBER'" <<'REMOTE'
          set -euo pipefail
          pr_number="$1"
          cd ~/workspace/roadtrip
          git fetch --prune origin
          scripts/sandbox_down.sh "pr${pr_number}"
          REMOTE

      # ── 7. Post result back ───────────────────────────────────────────────────
      # sandbox_up.sh uses SANDBOX_TUNNEL_ZONE (default: floo.ca) to form the
      # URL.  Mirror that default here; override via repo var SANDBOX_TUNNEL_ZONE
      # if the zone is ever renamed.  floo.ca (one label under the apex) is
      # required for the free *.floo.ca TLS cert to cover sandbox hostnames.
      - name: Status live
        if: steps.cmd.outputs.action == 'up' && steps.status.outputs.comment_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SANDBOX_TUNNEL_ZONE: ${{ vars.SANDBOX_TUNNEL_ZONE || 'floo.ca' }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const zone = process.env.SANDBOX_TUNNEL_ZONE;
            const pr   = process.env.PR_NUMBER;
            const sha  = (process.env.HEAD_SHA || '').slice(0, 12);
            // Must match deploy.sh's SANDBOX_HOST_PREFIX (roadtrip-sb-) + name
            // (pr<N>) so the URL is the host the Caddy vhost serves.
            const url  = `https://roadtrip-sb-pr${pr}.${zone}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### ✅ Sandbox live\n` +
                `- **URL:** ${url}\n` +
                `- **Commit:** \`${sha}\`\n` +
                `- **Stop:** comment \`/sandbox stop\`  ·  [logs](${process.env.RUN_URL})`,
            });

      - name: Status stopped
        if: steps.cmd.outputs.action == 'stop' && steps.status.outputs.comment_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const pr = process.env.PR_NUMBER;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### 🛑 Sandbox torn down\n` +
                `- **Was:** \`roadtrip-sb-pr${pr}\`\n` +
                `- Re-create with \`/sandbox\`  ·  [logs](${process.env.RUN_URL})`,
            });

      # ── Status: failed ───────────────────────────────────────────────────────
      # MUST be the LAST step: a step with `if: failure()` runs only when reached
      # in sequence AND a prior step has already failed.  Placed here, it catches
      # a failure in ANY earlier step (image wait, tailnet, SSH, the host deploy)
      # and flips the status comment to a terminal ❌.  Earlier in the job it
      # would miss the most common failure — the host deploy — leaving the
      # comment stuck on "deploying…".  Edits the existing comment, or posts a
      # new one if the failure predated the status comment.
      - name: Status failed
        if: failure() && (steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'teardown' : 'deploy';
            const body = `${marker}\n### ❌ Sandbox ${verb} failed\n` +
              `- **Commit:** \`${sha}\`\n` +
              `- See the [workflow run](${process.env.RUN_URL}) for details.`;
            const id = process.env.COMMENT_ID;
            if (id) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: Number(id), body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
