name: Sandbox

# Sandboxes are retired by sandbox-sweep.yml, which reaps any sandbox whose PR
# has closed, so there is no teardown-on-close job here.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: What to do
        type: choice
        options:
          - start
          - stop
        default: start
        required: true
      slug:
        description: Sandbox slug, e.g. pr532 or demo
        type: string
        required: true
      branch:
        description: Branch to deploy; defaults to the branch this run was launched from (start only)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: sandbox-${{ github.event.issue.number || github.event.inputs.slug }}
  cancel-in-progress: false

jobs:
  sandbox:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/sandbox'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Collapses both entry points into one shape: what to do, to which slug,
      # from which ref, and whether there is a PR to report back to.
      - name: Resolve request
        id: req
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs;
              const branch = inputs.branch || context.ref.replace('refs/heads/', '');
              core.setOutput('operation', inputs.operation);
              core.setOutput('slug', inputs.slug);
              core.setOutput('branch', branch);
              core.setOutput('ref', branch);
              core.setOutput('pr_number', '');
              core.info(`dispatch: ${inputs.operation} ${inputs.slug} from ${branch}`);
              return;
            }

            const body = (context.payload.comment.body || '').replace(/\r/g, '').trim();
            const operation =
              body === '/sandbox' ? 'start' : body === '/sandbox stop' ? 'stop' : 'unknown';
            core.setOutput('operation', operation);
            core.setOutput('pr_number', String(context.issue.number));
            if (operation === 'unknown') {
              core.info(`unrecognised command: ${body}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Sandboxes are limited to branches in this repository.');
              return;
            }
            core.setOutput('slug', `pr${context.issue.number}`);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('ref', pr.head.sha);
            core.info(`PR #${context.issue.number} head ${pr.head.sha} ref ${pr.head.ref}`);

      - name: Post unknown-command comment
        if: steps.req.outputs.operation == 'unknown'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Unrecognised sandbox command. Valid commands:\n` +
                    `- \`/sandbox\` — spin up a sandbox for this PR\n` +
                    `- \`/sandbox stop\` — tear down the sandbox`,
            });

      # Start checks out the commit being deployed — the sandbox action reads
      # both SHAs from that tree. Stop needs only the tooling, so it takes the
      # ref this workflow was loaded from.
      - name: Check out commit to deploy
        if: steps.req.outputs.operation == 'start'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.req.outputs.ref }}

      - name: Check out sandbox tooling
        if: steps.req.outputs.operation == 'stop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image SHAs
        if: steps.req.outputs.operation == 'start'
        run: |
          set -euo pipefail
          {
            echo "APP_SHA=$(git rev-parse HEAD)"
            echo "DATA_SHA=$(git rev-parse HEAD:data)"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.req.outputs.operation == 'start'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for GHCR image
        if: steps.req.outputs.operation == 'start'
        env:
          APP_SHA: ${{ env.APP_SHA }}
          DATA_SHA: ${{ env.DATA_SHA }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/${REPO}/backend:${APP_SHA}"
            "ghcr.io/${REPO}/data:${DATA_SHA}"
          )
          MAX_ATTEMPTS=60
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            missing=()
            for image in "${images[@]}"; do
              docker manifest inspect "$image" >/dev/null 2>&1 || missing+=("$image")
            done
            [ "${#missing[@]}" -eq 0 ] && exit 0
            printf 'Attempt %s/%s; waiting for %s\n' \
              "$ATTEMPT" "$MAX_ATTEMPTS" "${missing[*]}"
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep 20
          done
          printf 'Images were not published: %s\n' "${missing[*]}" >&2
          exit 1

      # install-release packages the checkout, so it stays in the workflow; the
      # action owns everything that touches the sandbox itself.
      - name: Sandbox
        if: steps.req.outputs.operation != 'unknown'
        uses: ./.github/actions/sandbox
        with:
          operation: ${{ steps.req.outputs.operation }}
          slug: ${{ steps.req.outputs.slug }}
          branch: ${{ steps.req.outputs.branch }}
          pr-number: ${{ steps.req.outputs.pr_number }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          github-token: ${{ github.token }}
