name: Sandbox

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: sandbox-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sandbox:
    if: >
      github.event.issue.pull_request != null &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/sandbox')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANDBOX_HOST: mini@mini-ca

    steps:
      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Sandboxes are limited to branches in this repository.');
              return;
            }
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('pr_number', String(context.issue.number));
            core.info(`PR #${context.issue.number} head SHA: ${pr.head.sha} ref: ${pr.head.ref}`);

      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          body="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | xargs)"
          case "$body" in
            "/sandbox")
              echo "action=up" >> "$GITHUB_OUTPUT"
              echo "Parsed: up"
              ;;
            "/sandbox stop")
              echo "action=stop" >> "$GITHUB_OUTPUT"
              echo "Parsed: stop"
              ;;
            *)
              echo "action=unknown" >> "$GITHUB_OUTPUT"
              echo "Parsed: unknown (body: $body)"
              ;;
          esac

      - name: Init status comment
        id: status
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'Tearing down' : 'Spinning up';
            const body = `${marker}\n### 🔄 Sandbox: ${verb}…\n` +
              `- **Commit:** \`${sha}\`\n` +
              `- **Status:** triggered — [live logs](${process.env.RUN_URL})`;
            // Reuse an existing status comment for this PR if present.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            let id;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
              id = existing.id;
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
              id = created.id;
            }
            core.setOutput('comment_id', String(id));

      - name: Post unknown-command comment
        if: steps.cmd.outputs.action == 'unknown'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Unrecognised sandbox command. Valid commands:\n` +
                    `- \`/sandbox\` — spin up a sandbox for this PR\n` +
                    `- \`/sandbox stop\` — tear down the sandbox`,
            });

      - name: Resolve data tree SHA
        if: steps.cmd.outputs.action == 'up'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Export data tree SHA
        if: steps.cmd.outputs.action == 'up'
        run: echo "DATA_SHA=$(git rev-parse HEAD:data)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.cmd.outputs.action == 'up'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for GHCR image
        if: steps.cmd.outputs.action == 'up'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          DATA_SHA: ${{ env.DATA_SHA }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/${REPO}/backend:${HEAD_SHA}"
            "ghcr.io/${REPO}/data:${DATA_SHA}"
          )
          MAX_ATTEMPTS=60
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            missing=()
            for image in "${images[@]}"; do
              docker manifest inspect "$image" >/dev/null 2>&1 || missing+=("$image")
            done
            [ "${#missing[@]}" -eq 0 ] && exit 0
            printf 'Attempt %s/%s; waiting for %s\n' \
              "$ATTEMPT" "$MAX_ATTEMPTS" "${missing[*]}"
            [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && sleep 20
          done
          printf 'Images were not published: %s\n' "${missing[*]}" >&2
          exit 1

      - name: Join tailnet
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.98.10

      - name: Configure SSH
        if: steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install runtime release
        if: steps.cmd.outputs.action == 'up'
        uses: ./.github/actions/install-release
        with:
          host: ${{ env.SANDBOX_HOST }}
          sha: ${{ steps.pr.outputs.head_sha }}

      - name: Status deploying
        if: (steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop') && steps.status.outputs.comment_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'Tearing down' : 'Deploying to the host';
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### 🔄 Sandbox: ${verb}…\n` +
                `- **Commit:** \`${sha}\`\n` +
                `- **Status:** deploying — [live logs](${process.env.RUN_URL})`,
            });

      - name: Run on host (up)
        if: steps.cmd.outputs.action == 'up'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          DATA_SHA: ${{ env.DATA_SHA }}
        run: |
          if ! printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::HEAD_SHA '$HEAD_SHA' is not a 40-hex SHA; aborting"
            exit 1
          fi
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::PR_NUMBER '$PR_NUMBER' is not numeric; aborting"
            exit 1
          fi
          HEAD_REF_B64="$(printf '%s' "$HEAD_REF" | base64 -w0)"
          ssh -o BatchMode=yes "$SANDBOX_HOST" "bash -s -- '$HEAD_SHA' '$HEAD_REF_B64' '$PR_NUMBER' '$DATA_SHA'" <<'REMOTE'
          set -euo pipefail
          head_sha="$1"
          head_ref="$(printf '%s' "$2" | base64 -d)"
          pr_number="$3"
          data_sha="$4"
          release="$HOME/.roadtrip/releases/$head_sha"
          cd "$release"

          SANDBOX_SHA="$head_sha" SANDBOX_BUILD_SHA="$head_sha" SANDBOX_BRANCH="$head_ref" ROADTRIP_DATA_SHA="$data_sha" SANDBOX_CADDY_DIR="$HOME/.roadtrip/caddy/sandboxes" scripts/deploy.sh sandbox-up "$pr_number"
          REMOTE

      - name: Run on host (stop)
        if: steps.cmd.outputs.action == 'stop'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::PR_NUMBER '$PR_NUMBER' is not numeric; aborting"
            exit 1
          fi
          ssh -o BatchMode=yes "$SANDBOX_HOST" "bash -s -- '$PR_NUMBER'" <<'REMOTE'
          set -euo pipefail
          pr_number="$1"
          cd "$HOME/.roadtrip/current"
          SANDBOX_CADDY_DIR="$HOME/.roadtrip/caddy/sandboxes" scripts/deploy.sh sandbox-down "pr${pr_number}"
          REMOTE

      - name: Status live
        if: steps.cmd.outputs.action == 'up' && steps.status.outputs.comment_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SANDBOX_TUNNEL_ZONE: ${{ vars.SANDBOX_TUNNEL_ZONE || 'floo.ca' }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const zone = process.env.SANDBOX_TUNNEL_ZONE;
            const pr   = process.env.PR_NUMBER;
            const sha  = (process.env.HEAD_SHA || '').slice(0, 12);
            // Must match deploy.sh's SANDBOX_HOST_PREFIX (roadtrip-sb-) + name
            // (pr<N>) so the URL is the host the Caddy vhost serves.
            const url  = `https://roadtrip-sb-pr${pr}.${zone}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### ✅ Sandbox live\n` +
                `- **URL:** ${url}\n` +
                `- **Commit:** \`${sha}\`\n` +
                `- **Stop:** comment \`/sandbox stop\`  ·  [logs](${process.env.RUN_URL})`,
            });

      - name: Status stopped
        if: steps.cmd.outputs.action == 'stop' && steps.status.outputs.comment_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const pr = process.env.PR_NUMBER;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: `${marker}\n### 🛑 Sandbox torn down\n` +
                `- **Was:** \`roadtrip-sb-pr${pr}\`\n` +
                `- Re-create with \`/sandbox\`  ·  [logs](${process.env.RUN_URL})`,
            });

      - name: Status failed
        if: failure() && (steps.cmd.outputs.action == 'up' || steps.cmd.outputs.action == 'stop')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTION: ${{ steps.cmd.outputs.action }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ steps.status.outputs.comment_id }}
        with:
          script: |
            const marker = `<!-- sandbox-status:pr${context.issue.number} -->`;
            const sha = (process.env.HEAD_SHA || '').slice(0, 12);
            const verb = process.env.ACTION === 'stop' ? 'teardown' : 'deploy';
            const body = `${marker}\n### ❌ Sandbox ${verb} failed\n` +
              `- **Commit:** \`${sha}\`\n` +
              `- See the [workflow run](${process.env.RUN_URL}) for details.`;
            const id = process.env.COMMENT_ID;
            if (id) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: Number(id), body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
