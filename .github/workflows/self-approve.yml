name: Self-approve

on:
  issue_comment:
    types: [created]

# The approval is posted with the GitHub App token minted below, not the
# workflow's own token, so this needs no permissions of its own.
permissions: {}

jobs:
  self-approve:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'lgtm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.SELF_APPROVE_APPID }}
          private-key: ${{ secrets.SELF_APPROVE_PRIVATEKEY }}

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh pr review "$PR_NUMBER" --repo "$REPO" --approve
