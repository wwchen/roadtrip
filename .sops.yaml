# SOPS routing. Anything under secrets/ ending in .enc.env is encrypted with
# the age recipients below; sops picks the rule up automatically on
# `sops edit` / `sops --encrypt`, so no key ever appears on a command line.
#
# For dotenv files sops encrypts values and leaves keys in plaintext, which is
# exactly what we want: `git diff` shows which secret changed without revealing
# what it changed to. Empty values stay empty — there's nothing to encrypt — so
# an unset key is visible as unset, by design.
#
# Adding a host or a person:
#   1. On that machine: `make secrets-init` — prints its age public key.
#   2. Add the key to the list below with a comment naming the holder.
#   3. `make secrets-rotate` — re-encrypts the data keys for the new set.
#   4. Commit .sops.yaml and secrets/secrets.enc.env together.
#
# Removing a holder is the same edit in reverse, but the removed key has seen
# the current values: rotate the underlying credentials too, not just the file.

creation_rules:
  - path_regex: secrets/.*\.enc\.env$
    key_groups:
      - age:
          # wc@laptop — primary dev machine
          - age1gr7vhre9c8as5n03w4qa3gwenszx8gk6dsr4d8nj2stp55p3nqzsyu43ad
          # mini-ca — deploy host (~mini/.config/sops/age/keys.txt)
          - age1fkpsyq9t7y9xu4f99kkgjs60hx7s9nsyntvyrqyjzzgc2ptjwdhqcvudap
