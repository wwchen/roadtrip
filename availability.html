<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Availability Dashboard</title>
<style>
  :root {
    --surface: #26272d;
    --bg: #1c1d21;
    --bg-subtle: rgba(255,255,255,0.04);
    --bg-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e6e8eb;
    --muted: #8a8f96;
    --faint: #5a6068;
    --accent: #4cb96a;
    --accent-hover: #62cc7d;
    --error: #f56565;
    --catalog-table-min-width: 900px;
    --catalog-table-layout: auto;
    --name-max-width: 360px;
    --name-min-width: 220px;
    --links-min-width: 220px;
    --result-label-width: 92px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { padding: 20px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .shell { max-width: 1280px; margin: 0 auto; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 650; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .nav {
    display: flex;
    align-items: center;
    gap: 10px 16px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .nav-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nav-group + .nav-group {
    padding-left: 14px;
    border-left: 1px solid var(--border-strong);
  }
  .nav a, button {
    border: 1px solid var(--border-strong);
    background: var(--bg-subtle);
    color: var(--text);
    border-radius: 8px;
    height: 34px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav a:hover, button:hover {
    background: var(--bg-hover);
    text-decoration: none;
  }
  .nav a[aria-current="page"] {
    border-color: rgba(76,185,106,0.45);
    background: rgba(76,185,106,0.12);
    color: #87d99b;
  }
  .nav a.outside-link { gap: 7px; }
  .nav a.outside-link::after {
    content: "";
    width: 10px;
    height: 10px;
    border-top: 1.5px solid currentColor;
    border-right: 1.5px solid currentColor;
    opacity: 0.7;
  }
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tabs a {
    border: 1px solid var(--border-strong);
    background: var(--bg-subtle);
    color: var(--text);
    border-radius: 8px;
    height: 34px;
    padding: 0 14px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
  }
  .tabs a:hover {
    background: var(--bg-hover);
    text-decoration: none;
  }
  .tabs a[aria-current="page"] {
    border-color: rgba(76,185,106,0.45);
    background: rgba(76,185,106,0.12);
    color: #87d99b;
  }
  .filters {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 10px;
    align-items: end;
  }
  .filters > label,
  .filters > .actions { min-width: 0; }
  .counter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .counter-row .chip {
    border: 1px solid var(--border-strong);
    background: var(--bg-subtle);
    color: var(--muted);
    border-radius: 8px;
    height: 34px;
    padding: 0 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .counter-row .chip strong { color: var(--text); font-weight: 650; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th, .data-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .data-table th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
  }
  .empty { color: var(--muted); padding: 14px; text-align: center; }
  .panel { padding: 14px; margin-bottom: 14px; }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .top, .status { align-items: flex-start; flex-direction: column; }
    .nav { justify-content: flex-start; }
    .nav-group + .nav-group {
      width: 100%;
      padding-left: 0;
      padding-top: 8px;
      border-left: 0;
      border-top: 1px solid var(--border-strong);
    }
  }
</style>
<link rel="stylesheet" href="/web/components/catalog.css">
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>Availability Dashboard</h1>
      <div class="sub">Live view of polling jobs, recent runs, and observed snapshots.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois">POIs</a>
        <a href="/reservables">Reservables</a>
        <a href="/watches">Watches</a>
        <a href="/availability" aria-current="page">Activity</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <nav class="tabs" aria-label="Dashboard tabs">
    <a href="?tab=pollers" data-tab="pollers">Pollers</a>
    <a href="?tab=runs" data-tab="runs">Runs</a>
    <a href="?tab=snapshots" data-tab="snapshots">Snapshots</a>
  </nav>

  <div id="tab-root"></div>
</main>
<script type="module" src="/web/availability.js"></script>
</body>
</html>
