# Ktor EngineMain reads application.yaml automatically. Roadtrip runtime also
# loads this base file, then overlays application-<profile>.yaml.
#
# Optional env-backed values use Ktor's ${ENV:default} syntax so EngineMain can
# parse this file even when local secret env vars are intentionally unset.
ktor:
  deployment:
    host: "0.0.0.0"
    port: "${PORT:8765}"
  application:
    modules:
      - ca.floo.roadtrip.MainKt.module
roadtrip:
  availability:
    force-pull-cooldown: 60s
    provider-cooldown: 5m
    poller:
      # Last rung of the watch -> POI -> global cadence fall-through, and the
      # two delays the executor reschedules on when it does not fetch.
      default-cadence: 300s
      idle-reschedule: 300s
      governor-starved-retry: 15s
    bulk:
      # A bulk scan is the one read that can turn one request into many
      # upstream calls, so each bound is stated here rather than compiled in.
      max-pois: 50
      # Must stay below db.max-pool-size (currently 4, unset anywhere so it's
      # the DbConfig default) — each concurrent POI can hold a pooled
      # connection through AvailabilityRepo.recordObservations.
      fan-out-concurrency: 3
      tolerance: 2h
      ip-rate-limit-per-minute: 10
  booking:
    # How stale the last availability observation may be and still let a direct
    # add-to-cart through its freshness gate. Follows the poller cadence.
    freshness-max-age: ${BOOKING_FRESHNESS_MAX_AGE:5m}
    recgov-atc:
      companion-base-url:
      companion-timeout: 180s
      # Shared secret for the companion channel. The companion requires it on
      # every route; blank means every companion call is refused.
      companion-api-token: ${COMPANION_API_TOKEN:}
      # How often the keepalive job re-arms the profiles backing an active
      # `atc` watch and refreshes their sessions.
      keepalive-interval: ${RECGOV_KEEPALIVE_INTERVAL:15m}
      # Budget for the session preflight and the one unattended re-login that
      # run before a hold. Short: an ATC racing other users cannot spend the
      # full companion timeout twice before it even starts.
      fire-timeout: ${RECGOV_FIRE_TIMEOUT:30s}
  security:
    # AES-256-GCM key for per-user secret storage (SecretCipher), base64 of
    # 32 bytes. Absent or blank disables secret storage: SecretsConfig returns
    # null and settings that need the cipher answer 503.
    encryption-key: ${ENCRYPTION_KEY:}
  auth:
    # Selects the active vendor block under `providers` and its claims
    # dialect — the flow is plain OIDC for every value. clerk | auth0 |
    # workos | oidc. See rfcs/0009-auth-provider-layer.md and
    # docs/superpowers/specs/2026-08-01-clerk-auth-migration-design.md.
    #
    # Both vendors stay configured so switching (or rolling back) is this one
    # value — no credential swapping. Defaults to clerk: the AUTH_CLERK_* vault
    # values are set in prod, so this is the active vendor. Rollback is
    # AUTH_PROVIDER=auth0 (requires AUTH_AUTH0_* to be populated first).
    provider: "${AUTH_PROVIDER:clerk}"
    # Blank issuer or client-id in the ACTIVE block = auth disabled, a
    # first-class state: the app boots and every anonymous surface works with
    # no tenant provisioned.
    providers:
      auth0:
        issuer: "${AUTH_AUTH0_ISSUER:}"
        client-id: "${AUTH_AUTH0_CLIENT_ID:}"
        client-secret: "${AUTH_AUTH0_CLIENT_SECRET:}"
      clerk:
        issuer: "${AUTH_CLERK_ISSUER:}"
        client-id: "${AUTH_CLERK_CLIENT_ID:}"
        client-secret: "${AUTH_CLERK_CLIENT_SECRET:}"
    session-ttl: 30d
    cookie-secure: true
    # Auth0 database connection name for the embedded (resource-owner) flow.
    # Spike-confirmable: verify against the Auth0 tenant dashboard once live.
    realm: "${ROADTRIP_AUTH_REALM:Username-Password-Authentication}"
    # Bare hostname for auth0-js `domain` in the embedded flow (no scheme).
    # Defaults to issuer host when unset. Set to the custom domain in production.
    embedded-domain: "${ROADTRIP_AUTH_EMBEDDED_DOMAIN:}"
  mapbox:
    token: "${MAPBOX_TOKEN:}"
  campflare:
    api-key: "${CAMPFLARE_API_KEY:}"
    api-base-url: "https://api.campflare.com/v2"
  slack:
    bot-token: "${SLACK_BOT_TOKEN:}"
    default-channel: "${SLACK_ALERT_CHANNEL:}"
    signing-secret: "${SLACK_SIGNING_SECRET:}"
  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${ROADTRIP_EMAIL_FROM:Campsite Alerts <alerts@roadtrip.floo.ca>}"
  build-info:
    env: "${ROADTRIP_BUILD_ENV:local}"
    sha: "${ROADTRIP_BUILD_SHA:unknown}"
    branch: "${ROADTRIP_BUILD_BRANCH:unknown}"
  poi-registry:
    resource: poi-registry.yaml
    path:
  read-path:
    enabled-data-providers:
      - campflare
      - bcparks-strapi
      - aspira
#      - reserveamerica
#      - reservecalifornia
      - tesla_supercharger
      - planet_fitness_location
    enabled-availability-providers:
      - aspira
      - campflare
#      - recgov
      - reserveamerica
      - reservecalifornia
