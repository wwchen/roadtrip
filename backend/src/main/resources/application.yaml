# Ktor EngineMain reads application.yaml automatically. Roadtrip runtime also
# loads this base file, then overlays application-<profile>.yaml.
#
# Optional env-backed values use Ktor's ${ENV:default} syntax so EngineMain can
# parse this file even when local secret env vars are intentionally unset.
ktor:
  deployment:
    host: "0.0.0.0"
    port: "${PORT:8765}"
  application:
    modules:
      - ca.floo.roadtrip.MainKt.module
roadtrip:
  availability:
    force-pull-cooldown: 60s
    provider-cooldown: 5m
  booking:
    recgov-atc:
      companion-base-url:
      companion-timeout: 180s
  auth:
    # Selects a claims dialect only — the flow is plain OIDC for every value.
    # auth0 | workos | oidc. See rfcs/0009-auth-provider-layer.md.
    #
    # Defaults to the vendor we actually use. The `oidc` fallback records no
    # upstream identity, and that column cannot be backfilled for users who stop
    # signing in — so a forgotten env var should not silently cost us it.
    provider: "${ROADTRIP_AUTH_PROVIDER:auth0}"
    # Blank issuer or client-id = auth disabled, a first-class state: the app
    # boots and every anonymous surface works with no tenant provisioned.
    issuer: "${ROADTRIP_AUTH_ISSUER:}"
    client-id: "${ROADTRIP_AUTH_CLIENT_ID:}"
    client-secret: "${ROADTRIP_AUTH_CLIENT_SECRET:}"
    session-ttl: 30d
    cookie-secure: true
  mapbox:
    token: "${MAPBOX_TOKEN:}"
  campflare:
    api-key: "${CAMPFLARE_API_KEY:}"
    api-base-url: "https://api.campflare.com/v2"
  slack:
    bot-token: "${SLACK_BOT_TOKEN:}"
    default-channel: "${SLACK_ALERT_CHANNEL:}"
    signing-secret: "${SLACK_SIGNING_SECRET:}"
  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${ROADTRIP_EMAIL_FROM:Campsite Alerts <alerts@roadtrip.floo.ca>}"
  poi-registry:
    resource: poi-registry.yaml
    path:
  read-path:
    enabled-data-providers:
      - campflare
      - bcparks-strapi
      - aspira
#      - reserveamerica
#      - reservecalifornia
      - tesla_supercharger
      - planet_fitness_location
    enabled-availability-providers:
      - aspira
      - campflare
#      - recgov
      - reserveamerica
      - reservecalifornia
