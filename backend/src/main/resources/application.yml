# Base application YAML. Runtime loads this first, then application-<profile>.yml.
#
# Values may reference process environment with ${ENV_VAR}. This keeps backend
# config in application*.yml while secrets stay in .env/deploy env.
server:
  admin-port: 8766

roadtrip:
  availability:
    force-pull-cooldown: 60s
    provider-cooldown: 5m
  dispatch:
    pending-ttl: 30s
    max-claim-wait: 30s
    min-claim-wait: 1ms
    default-lease: 30s
    min-lease: 1s
    max-lease: 120s
  mapbox:
    token: ${MAPBOX_TOKEN}
  campflare:
    api-key: ${CAMPFLARE_API_KEY}
    token: ${CAMPFLARE_TOKEN}
    api-base-url: https://api.campflare.com/v2
  slack:
    bot-token: ${SLACK_BOT_TOKEN}
    default-channel: ${SLACK_ALERT_CHANNEL}
    signing-secret: ${SLACK_SIGNING_SECRET}
  poi-registry:
    resource: poi-registry.yaml
    path:
  read-path:
    enabled-data-sources:
      - campflare
#      - recgov
#      - federal-campgrounds
#      - aspira-wa-pins
      - aspira-bc-pins
      - aspira-pc-pins
      - alberta-provincial
#      - new-york-state-parks
#      - california-state-parks
      - tesla_supercharger
      - planet_fitness_location
    enabled-availability-providers:
      - aspira
      - campflare
      - recgov
      - reserveamerica
      - reservecalifornia
