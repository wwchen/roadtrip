# backend/src/main/resources/poi-registry.yaml
#
# Four sections.
# 1. data_sources — fetchers. Pure network acquisition. Output to output_dir_prefix.
#    Run outside the backend process through scripts/poll_raw.py / make data-fetch.
#    Unreachable upstreams produce failed host fetch commands, not boot failures.
# 2. poi_data — POI-backed catalog datasets. Each row carries `name`,
#    optional `enabled` (default true), `category`, optional `subcategory`,
#    optional `agency` (constant string OR `{derived_from_field: <raw path>}`),
#    and exactly one terminal `etls:` entry. Inputs may only reference
#    `data_sources:` slugs. Duplicate slugs, dangling inputs, cycles, and
#    multi-entry ETL rows are rejected at boot. `enabled: false` omits the row
#    from admin import targets until the row is re-enabled.
# 3. campsite_data — canonical campsite datasets linked to campgrounds by
#    vendor refs.
#
# Reservation provider info is NOT in this file. ETLs that need it construct
# provider-ref JSON directly from upstream rows and per-tenant args such as
# `host`. Runtime dispatch reads vendor_refs payload JSON.

# ============================================================================
# data_sources — fetchers
# ============================================================================
data_sources:
  # --- Campflare canonical exports ------------------------------------------
  - slug: campflare-campgrounds-export
    name: Campflare campgrounds export
    fetcher:
      executor: python3
      filename: scripts/fetch_campflare_dump.py
      args: { slug: campflare-campgrounds-export, kind: campgrounds }
      timeout_sec: 7200
      output_dir_prefix: data/raw/campflare-campgrounds-export

  - slug: campflare-campsites-export
    name: Campflare campsites export
    depends_on: [campflare-campgrounds-export]
    fetcher:
      executor: python3
      filename: scripts/fetch_campflare_dump.py
      args: { slug: campflare-campsites-export, kind: campsites }
      timeout_sec: 7200
      output_dir_prefix: data/raw/campflare-campsites-export

  # --- Aspira /api/maps (one fetcher, three tenants via args.host) -----------
  - slug: aspira-maps-wa
    name: Aspira maps (Washington State Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_maps.py
      args: { host: washington.goingtocamp.com, source: aspira-maps-wa }
      output_dir_prefix: data/raw/aspira-maps-wa

  - slug: aspira-maps-bc
    name: Aspira maps (BC Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_maps.py
      args: { host: camping.bcparks.ca, source: aspira-maps-bc }
      output_dir_prefix: data/raw/aspira-maps-bc

  - slug: aspira-maps-pc
    name: Aspira maps (Parks Canada)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_maps.py
      args: { host: reservation.pc.gc.ca, source: aspira-maps-pc }
      output_dir_prefix: data/raw/aspira-maps-pc

  # --- Geometry-side feeds (joined into Aspira pins) -------------------------
  - slug: uscampgrounds
    name: uscampgrounds.info CSV
    fetcher:
      executor: python3
      filename: scripts/fetch_campgrounds.py
      output_dir_prefix: data/raw/uscampgrounds

  - slug: bcparks-strapi
    name: BC Parks Strapi
    fetcher:
      executor: python3
      filename: scripts/fetch_bc_parks.py
      output_dir_prefix: data/raw/bcparks-strapi

  - slug: apca-accommodation
    name: Parks Canada Accommodation (ArcGIS)
    fetcher:
      executor: python3
      filename: scripts/fetch_arcgis_layer.py
      args:
        slug: apca-accommodation
        url: https://services2.arcgis.com/wCOMu5IS7YdSyPNx/arcgis/rest/services/vw_Accommodation_Hebergement_V2_FGP/FeatureServer/0
        where: "Accommodation_Type='Camping'"
      output_dir_prefix: data/raw/apca-accommodation

  - slug: apca-places
    name: Parks Canada Places polygon centroids (ArcGIS)
    fetcher:
      executor: python3
      filename: scripts/fetch_arcgis_layer.py
      args:
        slug: apca-places
        url: https://services2.arcgis.com/wCOMu5IS7YdSyPNx/arcgis/rest/services/vw_Places_Public_lieux_public_APCA/FeatureServer/0
        return_centroid: true
      output_dir_prefix: data/raw/apca-places

  # --- Federal campgrounds (RIDB) --------------------------------------------
  # One capture covers every RIDB-publishing agency (NPS, USFS, BLM, USACE,
  # FWS, BOR, TVA, …). Per-facility agency lands in campground management
  # metadata at transform time from ORGANIZATION[0].OrgName.
  - slug: recgov-campgrounds-raw
    name: Federal campgrounds via RIDB (all agencies)
    fetcher:
      executor: python3
      filename: scripts/fetch_recgov.py
      args: { slug: recgov-campgrounds-raw }
      output_dir_prefix: data/raw/recgov-campgrounds

  - slug: recgov-campground-enrichment
    name: Federal campground ratings and cell coverage via rec.gov
    depends_on: [recgov-campgrounds-raw]
    fetcher:
      executor: python3
      filename: scripts/fetch_recgov_campground_enrichment.py
      args: { slug: recgov-campground-enrichment, resume: "true" }
      timeout_sec: 7200
      output_dir_prefix: data/raw/recgov-campground-enrichment

  # --- Aspira per-park named-site inventory ---------------------------------
  # One fetcher, three tenants. Walks the paired aspira-maps-{tenant} capture
  # for unique resourceLocationIds and calls /api/resourcelocation/resources
  # per park. The response carries the human label ("OFC13"), description
  # ("C13 Phantom RV Pad"), allowed equipment, capacity, attribute IDs, and
  # mapIds[] (parent leaf reference) for every campsite at that park.
  # AspiraCampsitesEtl reads this catalog as the source of truth for both
  # the campsite set and per-site enrichment.
  #
  # ~120-170 calls per tenant at our 1.5s throttle, ~3-5 min wall-clock.
  - slug: aspira-inventory-wa
    name: Aspira park inventory (Washington State Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_inventory.py
      args:
        slug: aspira-inventory-wa
        maps-slug: aspira-maps-wa
        host: washington.goingtocamp.com
      output_dir_prefix: data/raw/aspira-inventory-wa
    depends_on: [aspira-maps-wa]

  - slug: aspira-inventory-bc
    name: Aspira park inventory (BC Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_inventory.py
      args:
        slug: aspira-inventory-bc
        maps-slug: aspira-maps-bc
        host: camping.bcparks.ca
      output_dir_prefix: data/raw/aspira-inventory-bc
    depends_on: [aspira-maps-bc]

  - slug: aspira-inventory-pc
    name: Aspira park inventory (Parks Canada)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_inventory.py
      args:
        slug: aspira-inventory-pc
        maps-slug: aspira-maps-pc
        host: reservation.pc.gc.ca
      output_dir_prefix: data/raw/aspira-inventory-pc
    depends_on: [aspira-maps-pc]

  # --- Aspira tenant dictionaries ------------------------------------------
  # One capture per tenant for small lookup tables used as in-memory ETL side
  # inputs: /api/equipment, /api/resourcecategory, and
  # /api/attribute/filterable. These are not stored as DB tables; the
  # resources ETL resolves names into campsite source payloads during transform.
  - slug: aspira-dictionaries-wa
    name: Aspira dictionaries (Washington State Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_dictionaries.py
      args:
        slug: aspira-dictionaries-wa
        host: washington.goingtocamp.com
      output_dir_prefix: data/raw/aspira-dictionaries-wa

  - slug: aspira-dictionaries-bc
    name: Aspira dictionaries (BC Parks)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_dictionaries.py
      args:
        slug: aspira-dictionaries-bc
        host: camping.bcparks.ca
      output_dir_prefix: data/raw/aspira-dictionaries-bc

  - slug: aspira-dictionaries-pc
    name: Aspira dictionaries (Parks Canada)
    fetcher:
      executor: python3
      filename: scripts/fetch_aspira_dictionaries.py
      args:
        slug: aspira-dictionaries-pc
        host: reservation.pc.gc.ca
      output_dir_prefix: data/raw/aspira-dictionaries-pc

  # --- Federal campsites (rec.gov per-facility catalog, RFC 0008) -----------
  # Walks the recgov-campgrounds capture for FacilityIDs and calls rec.gov's
  # /api/camps/availability/campground/{id}/month per facility. The body's
  # `campsites` field is the catalog (id, site, loop, equipment_types, ...).
  # Per-day availability data is in the same response but not stored here —
  # request-time availability stays in CachedAvailability.
  #
  # Heavy fetch (~75min for 3000 facilities at 1.5s gap). Run independently
  # of recgov-campgrounds-raw so the campground-list refresh stays snappy.
  - slug: recgov-campsites-raw
    name: Federal campsites via rec.gov per-facility /month
    fetcher:
      executor: python3
      filename: scripts/fetch_recgov_campsites.py
      args: { slug: recgov-campsites-raw }
      output_dir_prefix: data/raw/recgov-campsites

  # --- Alberta provincial parks ----------------------------------------------
  - slug: reserveamerica-abpp
    name: ReserveAmerica Alberta park HTML
    fetcher:
      executor: python3
      filename: scripts/fetch_reserveamerica.py
      args: { tenant: ABPP }
      output_dir_prefix: data/raw/reserveamerica-abpp

  - slug: reserveamerica-ny
    name: ReserveAmerica New York State Parks HTML
    fetcher:
      executor: python3
      filename: scripts/fetch_reserveamerica.py
      args: { tenant: NY }
      output_dir_prefix: data/raw/reserveamerica-ny

  - slug: reserveamerica-campsites-abpp
    name: ReserveAmerica Alberta campsite calendar rosters
    fetcher:
      executor: python3
      filename: scripts/fetch_reserveamerica_campsites.py
      args: { tenant: ABPP }
      output_dir_prefix: data/raw/reserveamerica-campsites-abpp

  - slug: reserveamerica-campsites-ny
    name: ReserveAmerica New York campsite calendar rosters
    fetcher:
      executor: python3
      filename: scripts/fetch_reserveamerica_campsites.py
      args: { tenant: NY }
      output_dir_prefix: data/raw/reserveamerica-campsites-ny

  # --- California State Parks / ReserveCalifornia ----------------------------
  # Search-all discovery mirrors the public SPA: one /search/place request with
  # isSearchAllParks=true, followed by per-place facility/grid captures.
  - slug: reservecalifornia-catalog
    name: ReserveCalifornia place, facility, and site catalog
    fetcher:
      executor: python3
      filename: scripts/fetch_reservecalifornia.py
      args:
        slug: reservecalifornia-catalog
        discovery: search-all
      output_dir_prefix: data/raw/reservecalifornia-catalog

  # --- Planet Fitness --------------------------------------------------------
  - slug: osm-pf
    name: Planet Fitness via OSM
    fetcher:
      executor: python3
      filename: scripts/fetch_planet_fitness.py
      output_dir_prefix: data/raw/osm-pf

  # --- Tesla superchargers ---------------------------------------------------
  # Akamai blocks fetch; rely on the existing data/raw/ cache. Fan-out fetch
  # will mark these targets failed; the poi_data row is enabled: false so
  # fan-out import skips them.
  - slug: tesla-index
    name: Tesla supercharger index
    fetcher:
      executor: python3
      filename: scripts/fetch_tesla_index.py
      output_dir_prefix: data/raw/tesla-index

  - slug: tesla-locations
    name: Tesla supercharger detail pages
    fetcher:
      executor: python3
      filename: scripts/fetch_tesla_locations.py
      output_dir_prefix: data/raw/tesla-locations
    depends_on: [tesla-index]

# ============================================================================
# poi_data — POI-backed catalog datasets. Each row owns its ETL chain. The
# last `etls:` entry's slug is the catalog import source.
# ============================================================================
poi_data:
  - name: Campflare Campgrounds
    category: campground
    etls:
      - slug: campflare-campgrounds
        adapter: CampflareCampgroundsEtl
        inputs: [campflare-campgrounds-export]

  - name: Rec.gov Campgrounds
    category: campground
    subcategory: federal
    agency:
      derived_from_field: ORGANIZATION[0].OrgName
    etls:
      - slug: recgov-campgrounds
        adapter: RecGovCampgroundsEtl
        inputs: [recgov-campgrounds-raw, recgov-campground-enrichment]

  - name: Washington State Parks
    category: campground
    subcategory: state
    agency: WA State Parks
    etls:
      - slug: aspira-wa-campgrounds
        adapter: AspiraCampgroundsEtl
        inputs: [aspira-maps-wa, uscampgrounds, aspira-inventory-wa, aspira-dictionaries-wa]
        args:
          host: washington.goingtocamp.com
          state_filter: WA

  - name: BC Provincial Parks
    category: campground
    subcategory: provincial
    agency: BC Parks
    etls:
      - slug: aspira-bc-campgrounds
        adapter: BcParksCampgroundsEtl
        inputs: [aspira-maps-bc, bcparks-strapi, aspira-inventory-bc, aspira-dictionaries-bc]
        args:
          host: camping.bcparks.ca

  - name: Parks Canada
    category: campground
    subcategory: federal
    agency: Parks Canada
    etls:
      - slug: aspira-pc-campgrounds
        adapter: AspiraCampgroundsEtl
        inputs: [aspira-maps-pc, apca-accommodation, apca-places, aspira-inventory-pc, aspira-dictionaries-pc]
        args:
          host: reservation.pc.gc.ca
          parent_name_fallback: true

  - name: Alberta Provincial Parks
    category: campground
    subcategory: provincial
    agency: Alberta Parks
    etls:
      - slug: reserveamerica-ab-campgrounds
        adapter: ReserveAmericaCampgroundsEtl
        inputs: [reserveamerica-abpp]
        args:
          contract: ABPP
          host: shop.albertaparks.ca
          booking_horizon_days: "270"
          provider: reserveamerica

  - name: New York State Parks
    category: campground
    subcategory: state
    agency: New York State Parks
    etls:
      - slug: reserveamerica-ny-campgrounds
        adapter: ReserveAmericaCampgroundsEtl
        inputs: [reserveamerica-ny]
        args:
          contract: NY
          host: newyorkstateparks.reserveamerica.com
          booking_horizon_days: "270"
          region: NY
          country: US
          provider: reserveamerica

  - name: California State Parks
    category: campground
    subcategory: state
    agency: California State Parks
    etls:
      - slug: reservecalifornia-campgrounds
        adapter: ReserveCaliforniaCampgroundsEtl
        inputs: [reservecalifornia-catalog]

  - name: Planet Fitness
    category: planet-fitness
    agency: Planet Fitness
    etls:
      - slug: planet-fitness
        adapter: PlanetFitnessEtl
        inputs: [osm-pf]

  - name: Tesla Superchargers
    # Akamai can block fresh fetches; import uses cached tesla-index and
    # side-loaded tesla-locations captures when present.
    category: supercharger
    agency: Tesla
    etls:
      # tesla-locations is side-loaded from ctx.rawDir per-slug rather
      # than declared as an input, because the per-slug filesystem layout
      # doesn't fit the InputBundle's flat envelope contract.
      - slug: tesla-superchargers
        adapter: TeslaIndexEtl
        inputs: [tesla-index]

# ============================================================================
# campsite_data — campsite catalog declarations. These vendor adapters write
# canonical campsite rows and resolve parents through campground vendor refs.
# ============================================================================
campsite_data:
  - name: Campflare Campsites
    etls:
      - slug: campflare-campsites
        adapter: CampflareCampsitesEtl
        inputs: [campflare-campsites-export]

  - name: Rec.gov Campsites
    etls:
      - slug: recgov-campsites
        adapter: RecGovCampsitesEtl
        inputs: [recgov-campsites-raw]

  # Aspira per-tenant campsite catalogs. Each reads inventory, dictionaries,
  # and maps directly; AspiraLeavesWalk extracts leaf metadata for labeling.
  - name: Washington Aspira Resources
    etls:
      - slug: aspira-wa-campsites
        adapter: AspiraCampsitesEtl
        inputs: [aspira-inventory-wa, aspira-dictionaries-wa, aspira-maps-wa]

  - name: BC Aspira Resources
    etls:
      - slug: aspira-bc-campsites
        adapter: AspiraCampsitesEtl
        inputs: [aspira-inventory-bc, aspira-dictionaries-bc, aspira-maps-bc]

  - name: Parks Canada Aspira Resources
    etls:
      - slug: aspira-pc-campsites
        adapter: AspiraCampsitesEtl
        inputs: [aspira-inventory-pc, aspira-dictionaries-pc, aspira-maps-pc]

  - name: California State Park Sites
    etls:
      - slug: reservecalifornia-campsites
        adapter: ReserveCaliforniaSitesEtl
        inputs: [reservecalifornia-catalog]

  - name: Alberta Provincial Park Sites
    etls:
      - slug: reserveamerica-ab-campsites
        adapter: ReserveAmericaSitesEtl
        inputs: [reserveamerica-campsites-abpp]

  - name: New York State Park Sites
    etls:
      - slug: reserveamerica-ny-campsites
        adapter: ReserveAmericaSitesEtl
        inputs: [reserveamerica-campsites-ny]
