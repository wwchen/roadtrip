# Authored trip templates for Planning Mode (RFC 0011, M1).
# Templates are content, not user data: routes, distances, charger stops, and
# grades are authored here once; the app computes only dates and booking state.
# Campground refs resolve against the canonical catalog by (booking provider,
# provider-native ref); unresolved refs degrade to name-only display.
templates:
  - id: mighty-five-classic
    name: "Mighty 5 Classic"
    tagline: "All five Utah national parks in one arc, Vegas to Moab"
    origin: "Las Vegas, NV"
    terminus: "Moab, UT"
    days: 8
    total_miles: 1050
    avg_drive_minutes_per_day: 95
    longest_drive_minutes: 210
    season:
      prime_months: [4, 5, 9, 10]
      notes: "UT-12 summit at 9,600 ft — early/late season snow possible. Summer is hot but workable at elevation."
    ev:
      grade: yellow
      max_supercharger_gap_mi: 190
      hookup_critical_days: [3]
      notes: "No Supercharger between Bryce and Torrey; a 50A hookup night at Bryce covers the gap."
    booking:
      grade: red
      lead_time_days: 150
      notes: "Watchman and Devils Garden book out ~5 months ahead; watch both early."
    budget_usd:
      camp_fees: 240
      charging: 85
      entry_fees: 80
      notes: "Entry assumes America the Beautiful pass ($80) beating 5 separate gates."
    itinerary:
      - day: 1
        title: "Las Vegas → Zion"
        ev_status: green
        drive:
          from: "Las Vegas, NV"
          to: "Springdale, UT"
          miles: 160
          minutes: 170
          superchargers: ["St. George, UT", "Hurricane, UT"]
        stay:
          name: "Watchman Campground"
          campground: { provider: recgov, ref: "232445" }
        highlights: ["Canyon Overlook sunset"]
        sidequests: ["Valley of Fire SP (+40 min)"]
      - day: 2
        title: "Zion"
        ev_status: green
        stay:
          name: "Watchman Campground"
          campground: { provider: recgov, ref: "232445" }
        highlights: ["The Narrows or Angels Landing (permit lottery)", "Springdale shuttle day"]
        sidequests: ["Kolob Canyons (+50 min)"]
      - day: 3
        title: "Zion → Bryce Canyon"
        ev_status: yellow
        drive:
          from: "Springdale, UT"
          to: "Bryce Canyon City, UT"
          miles: 85
          minutes: 110
          superchargers: []
        stay:
          name: "Ruby's Inn RV Park (50A hookup)"
          manual:
            name: "Ruby's Inn RV Park & Campground"
            phone: "+1 866-878-9373"
            url: "https://www.brycecanyoncampgrounds.com"
        highlights: ["Sunset Point amphitheater", "Hookup night before the Supercharger gap"]
        sidequests: ["Red Canyon (+15 min)"]
      - day: 4
        title: "Bryce → Capitol Reef via Scenic Byway 12"
        ev_status: yellow
        drive:
          from: "Bryce Canyon City, UT"
          to: "Fruita, UT"
          miles: 120
          minutes: 180
          superchargers: []
        stay:
          name: "Fruita Campground"
          campground: { provider: recgov, ref: "232490" }
        highlights: ["Byway 12 over Boulder Mountain", "Hell's Backbone Grill (Boulder, UT)"]
        sidequests: ["Kodachrome Basin SP (+35 min)"]
      - day: 5
        title: "Capitol Reef"
        ev_status: green
        stay:
          name: "Fruita Campground"
          campground: { provider: recgov, ref: "232490" }
        highlights: ["Gifford House pie", "Scenic Drive + Capitol Gorge"]
        sidequests: ["Goblin Valley SP (+50 min)"]
      - day: 6
        title: "Capitol Reef → Moab"
        ev_status: green
        drive:
          from: "Torrey, UT"
          to: "Moab, UT"
          miles: 145
          minutes: 150
          superchargers: ["Green River, UT"]
        stay:
          name: "Wingate Campground (Dead Horse Point SP, electric sites)"
          campground: { provider: reserveamerica, ref: "UT-DEADHORSE-WINGATE" }
        highlights: ["Green River Supercharger lunch stop", "Dead Horse Point sunset"]
        sidequests: []
      - day: 7
        title: "Arches"
        ev_status: green
        drive:
          from: "Dead Horse Point, UT"
          to: "Arches NP, UT"
          miles: 35
          minutes: 50
          superchargers: ["Moab, UT"]
        stay:
          name: "Wingate Campground (Dead Horse Point SP, electric sites)"
          campground: { provider: reserveamerica, ref: "UT-DEADHORSE-WINGATE" }
        highlights: ["Timed entry Apr–Oct", "Delicate Arch sunset", "Devils Garden trail"]
        sidequests: ["Milt's Stop & Eat"]
      - day: 8
        title: "Canyonlands → home"
        ev_status: green
        drive:
          from: "Moab, UT"
          to: "Island in the Sky, UT"
          miles: 35
          minutes: 45
          superchargers: ["Moab, UT"]
        highlights: ["Mesa Arch (morning)", "Grand View Point", "Leave region at 100% from Moab Supercharger"]
        sidequests: []

