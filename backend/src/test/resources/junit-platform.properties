# Run test CLASSES in parallel, but methods within a class on one thread.
#
# Each DB-backed class owns a private database cloned from the shared template
# (see SharedTestDb), so classes are isolated and safe to run concurrently.
# Keeping methods single-threaded preserves each class's @BeforeEach cleanup
# semantics against its one database.
#
# Parallelism scales with available cores (dynamic factor 1); per-class Hikari
# pools are small (<=3), so peak Postgres connections stay well under the
# server default even on many-core machines.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
