# Codecov configuration. The Kover XML uploaded from .github/workflows/ci.yml
# is the only source — kover excludes generated jOOQ + main entrypoints
# already, but we mirror those ignores here so Codecov's UI matches.

coverage:
  status:
    project:
      default:
        # Calibrated against Codecov's own denominator, which is NOT Kover's.
        # Codecov counts 14276 measurable lines and 9445 hits on master =
        # 66.15% project coverage. Kover, over its own filter set (14690 lines,
        # 11146 covered), reports 75.87% line coverage. The ~10pp gap is two
        # different denominators, not two measurements of the same thing, so
        # neither number can be shifted a couple of points and reused as the
        # other's gate — doing exactly that is what pinned this target at 72%
        # and made codecov/project fail on a PR that *raised* coverage to
        # 66.22%.
        #
        # 66% sits just under the measured 66.15% Codecov baseline: normal
        # rounding noise passes, a real regression does not. The Kover floor in
        # backend/build.gradle.kts stays at 74 — correctly measured against
        # Kover's denominator — and remains the stricter of the two gates.
        target: 66%
        threshold: 0.5%
    patch:
      default:
        # Keep patch coverage visible as a review signal, but do not let
        # line-level diff noise block PRs. Project coverage + Kover verify
        # remain the hard coverage gates.
        informational: true
        target: 60%
        threshold: 5%

comment:
  layout: "diff, files, footer"
  behavior: default
  require_changes: false

ignore:
  # Generated by jOOQ codegen at build time. Match build.gradle.kts kover excludes.
  - "backend/build/generated/**"
  - "**/db/generated/**"
  # Application entrypoints/composition — main() and Ktor wiring — are covered
  # indirectly through route/service tests and are not meaningful patch
  # coverage targets. Every path here must exist: an ignore for a deleted file
  # silently shrinks nothing while making the filter set look bigger than it is.
  - "backend/src/main/kotlin/ca/floo/roadtrip/Main.kt"
  - "backend/src/main/kotlin/ca/floo/roadtrip/RoadtripRouting.kt"
  # The Playwright suite. It is TEST code that the coverage job never executes
  # (`smokeTest` is its own source set, run by `make qa` against a live stack),
  # so every line of it counted as uncovered production code — 49 of the 50
  # "missing" lines on the PR that rewrote it, which is patch coverage measuring
  # the wrong thing rather than a gap to close.
  #
  # This shifts the denominator, which the calibration note above warns about —
  # in the safe direction: it removes never-covered lines, so both percentages
  # can only rise. The `project` target stays at 66%.
  - "backend/src/smokeTest/**"
