# Codecov configuration. The Kover XML uploaded from .github/workflows/ci.yml
# is the only source — kover excludes generated jOOQ + main entrypoints
# already, but we mirror those ignores here so Codecov's UI matches.

coverage:
  status:
    project:
      default:
        # Codecov's denominator differs from Kover's local line metric; this
        # keeps the project gate above the current master baseline while Kover
        # remains the stricter local hard gate. Held ~2pp under the Kover floor
        # (74%, measured at 75.87% line coverage) for the same reason the old
        # pair was 43/45 — Codecov counts slightly differently, so the local
        # gate is the one that must bite first.
        target: 72%
        threshold: 0.5%
    patch:
      default:
        # Keep patch coverage visible as a review signal, but do not let
        # line-level diff noise block PRs. Project coverage + Kover verify
        # remain the hard coverage gates.
        informational: true
        target: 60%
        threshold: 5%

comment:
  layout: "diff, files, footer"
  behavior: default
  require_changes: false

ignore:
  # Generated by jOOQ codegen at build time. Match build.gradle.kts kover excludes.
  - "backend/build/generated/**"
  - "**/db/generated/**"
  # Application entrypoints/composition — main() and Ktor wiring — are covered
  # indirectly through route/service tests and are not meaningful patch
  # coverage targets. Every path here must exist: an ignore for a deleted file
  # silently shrinks nothing while making the filter set look bigger than it is.
  - "backend/src/main/kotlin/ca/floo/roadtrip/Main.kt"
  - "backend/src/main/kotlin/ca/floo/roadtrip/RoadtripRouting.kt"
