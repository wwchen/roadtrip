services:
  # Expose local-only service ports for host tools, browser QA, and Gradle loops.
  postgres:
    # Locally the container's lifecycle is tied to whatever brought it up (Tilt:
    # compose up foreground + cleanup hook on exit). `unless-stopped` — which the
    # base file sets so prod survives a host reboot — would resurrect it on a
    # Docker Desktop restart even with Tilt gone, drifting "Tilt running" away
    # from "container exists."
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    restart: "no"
    environment:
      ROADTRIP_PROFILE: compose-local
      ROADTRIP_BUILD_ENV: local
      ROADTRIP_BUILD_SHA: local
      ROADTRIP_BUILD_BRANCH: local
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=roadtrip,deployment.environment=compose-local,service.version=${ROADTRIP_BACKEND_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./frontend/dist:/app/static/frontend/dist:ro
      - ./data:/app/static/data

  recgov-companion:
    build:
      context: ./companion
    restart: "no"
    ports:
      - "127.0.0.1:8770:8770"

  grafana:
    restart: "no"
    environment:
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000/dash/"
      GRAFANA_DASHBOARD_ALLOW_UI_UPDATES: "true"
    ports:
      - "127.0.0.1:3000:3000"

  tempo:
    restart: "no"
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    restart: "no"
    ports:
      - "127.0.0.1:9090:9090"

  alloy:
    restart: "no"
    ports:
      - "127.0.0.1:12345:12345"
