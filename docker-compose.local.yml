# Pin the compose project name so container names don't drift with the
# parent directory, regardless of whether the repo is checked out as
# roadtrip/, roadtrip-map/, or a worktree.
name: roadtrip

services:
  # Expose local-only service ports for host tools, browser QA, and Gradle loops.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    restart: "no"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Local Grafana host, so alert dashboard links point at the dev instance
      # instead of the prod default. Matches the grafana service below.
      - GRAFANA_ROOT_URL=http://localhost:3000/dash/

  grafana:
    restart: "no"
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:3000/dash/"
      GRAFANA_DASHBOARD_ALLOW_UI_UPDATES: "true"
    ports:
      - "127.0.0.1:3000:3000"
