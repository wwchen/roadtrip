
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: "no"
    hostname: postgres
    shm_size: 1g
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - POSTGRES_USER=${POSTGRES_USER:-roadtrip}
      - POSTGRES_PASSWORD=${SANDBOX_DB_PASSWORD:-sandbox}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-roadtrip} -d $${POSTGRES_DB:-roadtrip}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/wwchen/roadtrip/backend:${SANDBOX_SHA}
    restart: "no"
    hostname: backend
    mem_limit: 4g
    ports:
      - "127.0.0.1:${SANDBOX_PORT}:8765"
    networks:
      default: {}
      roadtrip-sandbox:
        aliases:
          - sb-${SANDBOX_NAME}-backend
    environment:
      - ROADTRIP_PROFILE=${SANDBOX_PROFILE:-compose-local}
      - ROADTRIP_BUILD_ENV=sandbox
      - ROADTRIP_BUILD_SHA=${SANDBOX_BUILD_SHA:-${SANDBOX_SHA}}
      - ROADTRIP_BUILD_BRANCH=${SANDBOX_BRANCH}
      - ROADTRIP_SANDBOX_ASSUME_USER=true
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roadtrip}
      - POSTGRES_USER=${POSTGRES_USER:-roadtrip}
      - POSTGRES_PASSWORD=${SANDBOX_DB_PASSWORD:-sandbox}
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    volumes:
      - roadtrip-data:/app/static/data:ro
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app/app.jar", "ca.floo.roadtrip.HealthProbe"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  roadtrip-data:
    external: true
    name: ${ROADTRIP_DATA_VOLUME}
  postgres-data:

networks:
  default:
  roadtrip-sandbox:
    external: true
