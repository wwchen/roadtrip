services:
  # cookie-bot sidecar — kept for future use but not started by default on
  # aarch64 hosts (see memory: akamai_http2_fingerprinting.md). To enable,
  # run with `--profile cookie-bot` on an amd64 host (or with a paid-solver
  # backend), then set COOKIE_BOT_URL=http://cookie-bot:8080 in .env.
  # Used only by the offline refresh worker (scripts/fetch_tesla_{index,locations}.py),
  # not by the live serving stack.
  cookie-bot:
    profiles: [cookie-bot]
    build: ./cookie-bot
    restart: unless-stopped
    hostname: cookie-bot
    volumes:
      - ${COOKIE_BOT_DATA:-$HOME/.roadtrip-map/cookie-bot}:/var/cache/cookie-bot
    environment:
      - COOKIE_BOT_TOKEN=${COOKIE_BOT_TOKEN:-}
      - HEADLESS=true
      - LOG_LEVEL=INFO

  # Postgres + PostGIS (postgres:16 + postgis 3.4) so geom can be Geometry
  # (Polygon/MultiPolygon, not just Point) and GIST bbox queries work
  # without an extension install step.
  postgres:
    profiles: [pois]
    image: postgis/postgis:16-3.4
    # Restart `no` so the container's lifecycle is tied to whatever brought
    # it up. In dev that's Tilt (compose up foreground + cleanup hook on
    # exit); on the deploy host it's `make run env=prod`.
    # `unless-stopped` would resurrect the container on Docker Desktop
    # reboots even when Tilt is gone, drifting "Tilt running" away from
    # "container exists."
    restart: "no"
    hostname: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - POSTGRES_USER=${POSTGRES_USER:-roadtrip}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-roadtrip}
      # Read by postgres-init/10-grafana-reader.sh on first init to create the
      # grafana_reader role. Grafana's datasource provisioning uses the same
      # env vars with the same defaults; keep both in sync. Grants against
      # this role are owned by Flyway (R__grafana_reader_grants.sql), so this
      # only handles the one thing schema migrations can't: the password.
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_reader}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-roadtrip}
    volumes:
      - ${POSTGRES_DATA:-$HOME/.roadtrip-map/postgres}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-roadtrip} -d $${POSTGRES_DB:-roadtrip}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kotlin/Ktor backend. Serves the entire site:
  #   - GET /                       → index.html (map)
  #   - GET /availability           → availability dashboard
  #   - GET /web/*, /data/*         → static files (data/pricing-cache/ excluded)
  #   - GET /api/pois               → bbox query against postgres
  #   - GET /api/pricing/{slug}     → cache-only read of data/pricing-cache/{slug}.json
  #   - GET /api/health             → liveness/readiness probe
  # Static files come from the repo bind-mount so deploys are git-pull +
  # docker compose up — no Dockerfile rebuild needed for HTML/JS/data changes.
  backend:
    profiles: [pois]
    image: roadtrip/backend
    restart: unless-stopped
    hostname: backend
    mem_limit: 2g
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      - PORT=8765
      - ADMIN_PORT=8766
      - ROADTRIP_STATIC_DIR=/app/static
      - ROADTRIP_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roadtrip}
      - ROADTRIP_DB_USER=${POSTGRES_USER:-roadtrip}
      - ROADTRIP_DB_PASSWORD=${POSTGRES_PASSWORD:-roadtrip}
      # Mapbox is server-side only. /api/route (Directions) and /api/geocode
      # (forward geocoding) read this; the FE never sees the token. Both
      # endpoints return 503 when unset, so the trip planner just doesn't
      # work, instead of leaking the token by accident.
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      # Availability alerts (PR6). Unset SLACK_* => alerts disabled (no-op).
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_ALERT_CHANNEL=${SLACK_ALERT_CHANNEL:-}
      # https://docs.slack.dev/interactivity/implementing-shortcuts/#scope_permissions
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      # Grafana host for the dashboard deep link in alerts; same var + default
      # as the grafana service's GF_SERVER_ROOT_URL so they can't disagree.
      - GRAFANA_ROOT_URL=${GRAFANA_ROOT_URL:-https://roadtrip.floo.ca/dash/}
      # Public web app host for the POI map deep link (?poi=<id>) in alerts. The
      # backend serves the site at this host's root; Grafana lives under /dash/.
      - APP_ROOT_URL=${APP_ROOT_URL:-https://roadtrip.floo.ca/}
      - RIDB_API_KEY=${RIDB_API_KEY:-}
      - COOKIE_BOT_URL=${COOKIE_BOT_URL:-}
      - COOKIE_BOT_TOKEN=${COOKIE_BOT_TOKEN:-}
      - TESLA_COOKIES=${TESLA_COOKIES:-}
    volumes:
      - ./index.html:/app/static/index.html:ro
      - ./availability.html:/app/static/availability.html:ro
      - ./web:/app/static/web:ro
      - ./scripts:/app/static/scripts:ro
      - ./data:/app/static/data
      # PoiRegistry.load reads /app/static/config/poi-registry.yaml at boot;
      # backend hard-flaps without it.
      - ./config:/app/static/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-8765}/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    profiles: [pois]
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://roadtrip.floo.ca/dash/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_reader}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-roadtrip}
      - GRAFANA_DASHBOARD_ALLOW_UI_UPDATES=${GRAFANA_DASHBOARD_ALLOW_UI_UPDATES:-false}
      # Must be non-empty or Grafana treats the Slack contact point as chat-API
      # mode and fails provisioning at boot. Default is an obvious placeholder
      # (webhook mode → Grafana boots); set to a real webhook to deliver alerts.
      - GRAFANA_SLACK_WEBHOOK_URL=${GRAFANA_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER-SET-GRAFANA_SLACK_WEBHOOK_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      # Backend healthcheck fires after Flyway migrate completes, which now
      # includes R__grafana_reader_grants.sql — so grafana can safely connect
      # as grafana_reader once backend is healthy.
      backend:
        condition: service_healthy

  # Single-binary Loki for backend log storage/search. Backend logs JSON
  # (see backend/src/main/resources/logback.xml) with MDC run_id; Alloy ships
  # container stdout here, Grafana queries it via the Loki datasource.
  loki:
    profiles: [pois]
    image: grafana/loki:3.2.1
    restart: unless-stopped
    hostname: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./grafana/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # Ships Docker container logs (stdout/stderr) to Loki. Discovers containers
  # via the Docker socket; see grafana/alloy/config.alloy for the pipeline.
  alloy:
    profiles: [pois]
    image: grafana/alloy:latest
    restart: unless-stopped
    hostname: alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki

  cloudflared:
    # Runs in deploy with `--profile tunnel --profile pois`. Local modes skip it.
    # Public hostname routing is managed in Cloudflare Zero Trust; this
    # container only needs the tunnel token.
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend

volumes:
  grafana-data:
  loki-data:
