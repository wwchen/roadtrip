# Pin the compose project name so Alloy's Docker log discovery keeps these
# containers (`/roadtrip-*`) regardless of the checkout directory.
name: roadtrip

# json-file defaults to no rotation. These files double as Alloy's replay buffer
# (it resumes from a stored position after an outage), so this cap is also the
# bound on how much history a long Alloy outage can recover.
x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Postgres + PostGIS (postgres:16 + postgis 3.4) so geom can be Geometry
  # (Polygon/MultiPolygon, not just Point) and GIST bbox queries work
  # without an extension install step.
  postgres:
    profiles: [pois]
    image: postgis/postgis:16-3.4
    # The image may run its entrypoint as `postgres`. Starting the entrypoint
    # as root lets it fix ownership on a freshly-created bind mount before it
    # drops privileges to the postgres user for the server itself. This is
    # required by `make reset-db`, which removes the host directory first.
    user: root
    # This base file is what the deploy host runs, where the database must come
    # back on its own after a reboot — otherwise every other service restarts
    # and the site stays down until someone runs `make run env=prod` by hand.
    # The Tilt/Docker-Desktop rationale for `no` (don't resurrect a container
    # once Tilt is gone, so "Tilt running" can't drift from "container exists")
    # is a local-dev concern, so it lives in docker-compose.local.yml instead.
    restart: unless-stopped
    logging: *log-rotation
    hostname: postgres
    shm_size: 1g
    command: ["postgres", "-c", "max_wal_size=4GB", "-c", "checkpoint_completion_target=0.9", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - POSTGRES_USER=${POSTGRES_USER:-roadtrip}
      # The official image's file_env() reads *_FILE, so the password is a
      # mounted file rather than an environment value. It still only seeds the
      # cluster on first init — changing it later needs ALTER USER.
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      # Read by postgres-init/10-grafana-reader.sh on first init to create the
      # grafana_reader role. Grafana's datasource provisioning reads the same
      # secret, so the role's password and the connection using it come from
      # one definition (secrets/registry.yaml) and cannot drift. Grants are
      # owned by Flyway (R__grafana_reader_grants.sql); this handles the one
      # thing a schema migration can't carry: the password.
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_reader}
      - GRAFANA_DB_PASSWORD_FILE=/run/secrets/grafana_db_password
    volumes:
      - ${POSTGRES_DATA:-$HOME/.roadtrip-map/postgres}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # During initdb, the temporary server accepts Unix-socket connections
      # before POSTGRES_DB has been created. Probe over TCP so this only passes
      # once the entrypoint has finished initialization and started the real
      # server, with the configured application database available.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-roadtrip} -d $${POSTGRES_DB:-roadtrip}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kotlin/Ktor backend. Serves the entire site:
  #   - GET /, /watches, /availability → React build (frontend/dist)
  #   - GET /assets/*                  → the build's hashed bundles
  #   - GET /data/*                    → the GeoJSON layers
  #   - GET /api/pois               → bbox query against postgres
  #   - GET /api/health             → liveness/readiness probe
  backend:
    profiles: [pois]
    image: ${ROADTRIP_BACKEND_IMAGE:-roadtrip/backend}
    restart: unless-stopped
    logging: *log-rotation
    hostname: backend
    mem_limit: 4g
    environment:
      # Profile selection is a process env control that chooses
      # application-<profile>.yaml before backend config is parsed.
      - ROADTRIP_PROFILE=${ROADTRIP_PROFILE:-prod}
      - ROADTRIP_BUILD_ENV=${ROADTRIP_BUILD_ENV:-prod}
      - ROADTRIP_BUILD_SHA=${ROADTRIP_BUILD_SHA:-unknown}
      - ROADTRIP_BUILD_BRANCH=${ROADTRIP_BUILD_BRANCH:-unknown}
      # Active auth vendor selector (non-secret). Matches application.yaml's
      # `provider: "${AUTH_PROVIDER:clerk}"` default, and — because it is passed
      # through here — makes the RFC 0009 rollback a real one-variable flip:
      # `AUTH_PROVIDER=auth0 make run env=prod` reaches the backend process.
      # Without this line the container always saw the compiled-in default.
      - AUTH_PROVIDER=${AUTH_PROVIDER:-clerk}
      # OpenTelemetry Java agent exports Ktor/JDBC/JVM telemetry to Alloy.
      # Logs still go through stdout -> Alloy -> Loki; trace/span ids are
      # injected into Logback MDC and emitted by logback.xml's JSON encoder.
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-roadtrip-backend}
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=roadtrip,deployment.environment=${ROADTRIP_PROFILE:-prod},service.version=${ROADTRIP_BACKEND_VERSION:-0.1.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roadtrip}
      - POSTGRES_USER=${POSTGRES_USER:-roadtrip}
      # Every backend secret (Mapbox, Slack, Campflare, Resend, auth, the DB
      # password) is mounted under /run/secrets by docker-compose.secrets.yml
      # and read by SecretsBootstrap before Ktor parses config. Nothing secret
      # is an environment variable here, so `docker inspect` shows none of it.
      # Which secrets this service receives is declared in secrets/registry.yaml.
    volumes:
      - roadtrip-data:/app/static/data:ro
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app/app.jar", "ca.floo.roadtrip.HealthProbe"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started

  recgov-companion:
    profiles: [recgov-companion]
    image: ${ROADTRIP_COMPANION_IMAGE:-roadtrip/recgov-companion}
    restart: unless-stopped
    logging: *log-rotation
    hostname: recgov-companion
    environment:
      - COMPANION_ID=${COMPANION_ID:-recgov-companion}
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=8770
      - HEADLESS=${COMPANION_HEADLESS:-true}
      - COMPANION_BROWSER_PROFILE=/var/lib/campsite-companion/browser-session
      - RECGOV_LOGIN_TIMEOUT_MS=${RECGOV_LOGIN_TIMEOUT_MS:-120000}
      # Shared secret for the backend channel, mounted as a file by
      # docker-compose.secrets.yml rather than passed as a value.
      - COMPANION_API_TOKEN_FILE=/run/secrets/companion_api_token
      - COMPANION_MAX_CONCURRENT_BROWSERS=${COMPANION_MAX_CONCURRENT_BROWSERS:-3}
      - COMPANION_MFA_CHALLENGE_TTL_MS=${COMPANION_MFA_CHALLENGE_TTL_MS:-300000}
      - COMPANION_FAILED_LOGIN_BACKOFF_MS=${COMPANION_FAILED_LOGIN_BACKOFF_MS:-60000}
    volumes:
      - ${RECGOV_COMPANION_BROWSER_PROFILE:-$HOME/.campsite-companion/browser-session}:/var/lib/campsite-companion/browser-session
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8770/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    profiles: [pois]
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    logging: *log-rotation
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Grafana's file-backed setting convention is a __FILE suffix.
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://roadtrip.floo.ca/dash/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - POSTGRES_DB=${POSTGRES_DB:-roadtrip}
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_reader}
      # Datasource provisioning reads this with Grafana's $__file{} syntax;
      # see grafana/provisioning/datasources/roadtrip-postgres.yml.
      - GRAFANA_DASHBOARD_ALLOW_UI_UPDATES=${GRAFANA_DASHBOARD_ALLOW_UI_UPDATES:-false}
      # Must be non-empty or Grafana treats the Slack contact point as chat-API
      # mode and fails provisioning at boot, so the alerting config reads it via
      # $__file{} with a placeholder value in the vault rather than a blank.
    mem_limit: 1g
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # Backend healthcheck fires after Flyway migrate completes, which now
      # includes R__grafana_reader_grants.sql — so grafana can safely connect
      # as grafana_reader once backend is healthy.
      backend:
        condition: service_healthy

  # Single-binary Loki for backend log storage/search. Backend logs JSON
  # (see backend/src/main/resources/logback.xml) with MDC run_id; Alloy ships
  # container stdout here, Grafana queries it via the Loki datasource.
  loki:
    profiles: [pois]
    image: grafana/loki:3.2.1
    restart: unless-stopped
    logging: *log-rotation
    hostname: loki
    command: -config.file=/etc/loki/loki-config.yml
    mem_limit: 1g
    volumes:
      - ./grafana/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  tempo:
    profiles: [pois]
    image: grafana/tempo:3.0.2
    restart: unless-stopped
    logging: *log-rotation
    hostname: tempo
    command: -config.file=/etc/tempo.yaml
    mem_limit: 1g
    volumes:
      - ./grafana/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: distroless image, no /bin/sh, so a CMD-SHELL probe reports a
    # healthy container as unhealthy. Prometheus scrapes tempo:3200 instead.

  prometheus:
    profiles: [pois]
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    logging: *log-rotation
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}
      - --web.enable-remote-write-receiver
      # Off by default; both Tempo's generator and the backend's OTLP send them.
      - --enable-feature=exemplar-storage
    mem_limit: 2g
    volumes:
      - ./grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      # /-/ready, not /-/healthy: the latter is liveness and returns 200 through a
      # WAL replay, when Prometheus is up but cannot answer a query yet.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Ships Docker container logs to Loki and accepts OTLP traces/metrics from
  # the backend Java agent. See grafana/alloy/config.alloy for the pipelines.
  alloy:
    profiles: [pois]
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    logging: *log-rotation
    hostname: alloy
    mem_limit: 1g
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    # No healthcheck: no HTTP client in the image. Prometheus scrapes alloy:12345.
    depends_on:
      - loki
      - tempo
      - prometheus

  cloudflared:
    # Runs in deploy with `--profile tunnel --profile pois`. Local modes skip it.
    # Public hostname routing is managed in Cloudflare Zero Trust; this
    # container only needs the tunnel token.
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    logging: *log-rotation
    # TUNNEL_TOKEN_FILE, not --token: a flag would put the token in the
    # container's command line, where `ps` and `docker inspect` both show it.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    depends_on:
      - backend
      - caddy

  # Sandbox reverse proxy — demuxes *.floo.ca by Host header to per-sandbox
  # backend containers (see docs/sandbox-deploys.md).  Runs only under the
  # `tunnel` profile (deploy host), same as cloudflared: local dev doesn't
  # serve sandboxes.  Cloudflare's tunnel reaches it at http://caddy:80 (a Zero
  # Trust public-hostname rule for *.floo.ca).  No host ports are published —
  # pihole owns 80/443 on the deploy host.
  caddy:
    profiles: [tunnel]
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log-rotation
    hostname: caddy
    volumes:
      # Root config + the runtime snippet directory deploy.sh writes into.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SANDBOX_CADDY_DIR:-./caddy/sandboxes}:/etc/caddy/sandboxes:ro
    # Join the shared sandbox network so `reverse_proxy sb-<name>-backend:8765`
    # resolves the per-sandbox containers by their network alias.  `caddy` also
    # stays on the default project network for cloudflared to reach :80.
    networks:
      - default
      - roadtrip-sandbox

volumes:
  roadtrip-data:
    external: true
    name: ${ROADTRIP_DATA_VOLUME:-roadtrip-data}
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:

# The shared network that the sandbox reverse proxy and every sandbox backend
# join.  Declared here (owned by the base `roadtrip` project) with an explicit
# name so docker-compose.sandbox.yml can attach to it as `external: true` — the
# sandbox Compose projects never create it, they only join it.
networks:
  default:
  roadtrip-sandbox:
    name: roadtrip-sandbox
