document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d2a0195b-1d2f-498a-b235-65b5ee1e9324\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\n  :root {\n    --rt-avail:#4cb96a; --rt-brand:#3b82f6; --rt-first-come:#f1a04a; --rt-error:#f56565; --rt-faint:#8a8f96;\n    /* Slack surface palette */\n    --sk-bg:#1a1d21; --sk-text:#d1d2d3; --sk-strong:#f4f4f5; --sk-muted:#9a9b9e;\n    --sk-link:#4ea1e9; --sk-time:#6a6b6e; --sk-div:#35373b; --sk-btn-border:rgba(255,255,255,.18);\n    --sk-green:#007a5a; --sk-danger:#e01e5a;\n  }\n  * { box-sizing:border-box; }\n  html,body { margin:0; }\n  body { background:#0f1012; font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif; }\n  a { color:var(--sk-link); text-decoration:none; }\n  a:hover { text-decoration:underline; }\n\n  .doc { padding:44px 48px 90px; }\n  .doc-eyebrow { font:700 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rt-brand); margin:0 0 14px; }\n  .doc-h1 { margin:0; font:700 30px/1.1 system-ui; letter-spacing:-.02em; color:#f4f4f5; max-width:760px; }\n  .doc-sub { margin:16px 0 0; font:400 15px/1.55 system-ui; color:#9a9b9e; max-width:680px; }\n\n  .legend { display:flex; flex-wrap:wrap; gap:9px; margin:26px 0 6px; }\n  .lg { display:flex; align-items:center; gap:9px; padding:8px 13px 8px 10px; background:#191b1e; border:1px solid #26282c; border-radius:9px; }\n  .lg .bar { width:4px; height:30px; border-radius:2px; flex:none; }\n  .lg .t { font:600 12px/1.25 system-ui; color:#e6e8eb; }\n  .lg .t small { display:block; font-weight:400; color:#8a8f96; font-size:10.5px; margin-top:2px; }\n\n  .sect-h { display:flex; align-items:baseline; gap:11px; margin:44px 0 4px; }\n  .sect-n { font:700 11px ui-monospace,Menlo,monospace; color:var(--rt-brand); }\n  .sect-t { margin:0; font:600 17px/1.2 system-ui; letter-spacing:-.01em; color:#f4f4f5; }\n  .sect-d { margin:2px 0 20px; font:400 13px/1.5 system-ui; color:#8a8f96; max-width:640px; }\n\n  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }\n\n  .frame { display:flex; flex-direction:column; gap:9px; scroll-margin-top:20px; }\n  .frame-cap { display:flex; align-items:center; gap:8px; font:600 12px/1.3 system-ui; color:#c5c7ca; }\n  .oid { font:600 10.5px ui-monospace,Menlo,monospace; padding:3px 7px; background:rgba(255,255,255,.09); color:#c5c7ca; border-radius:5px; }\n  .frame:target .oid { background:var(--rt-brand); color:#fff; }\n\n  /* ---- Slack message ---- */\n  .sk { width:420px; background:var(--sk-bg); border:1px solid #26282c; border-radius:12px; padding:14px 16px 15px; }\n  .sk-head { display:flex; gap:9px; align-items:flex-start; }\n  .sk-av { width:36px; height:36px; border-radius:8px; flex:none; background:linear-gradient(135deg,var(--rt-brand),var(--rt-avail)); display:flex; align-items:center; justify-content:center; font-size:18px; }\n  .sk-meta { display:flex; align-items:center; gap:7px; padding-top:1px; }\n  .sk-name { font:900 15px/1.2 system-ui; color:var(--sk-strong); }\n  .sk-badge { font:700 9px/1 system-ui; letter-spacing:.02em; color:#cfd0d1; background:#3a3d42; padding:3px 4px; border-radius:3px; }\n  .sk-time { font:400 12px/1 system-ui; color:var(--sk-time); }\n\n  .sk-att { margin:7px 0 0 0; padding-left:14px; position:relative; }\n  .sk-att::before { content:\"\"; position:absolute; left:0; top:2px; bottom:2px; width:4px; border-radius:2px; background:var(--barc,var(--rt-avail)); }\n\n  .sk-title { display:flex; align-items:center; gap:8px; font:700 15px/1.3 system-ui; color:var(--sk-strong); margin-bottom:11px; }\n  .sk-fields { display:grid; grid-template-columns:1fr 1fr; gap:11px 18px; margin-bottom:11px; }\n  .sk-f .k { font:700 12.5px/1.3 system-ui; color:var(--sk-strong); margin-bottom:2px; }\n  .sk-f .v { font:400 13px/1.35 system-ui; color:var(--sk-text); }\n  .sk-f .v.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }\n  .sk-body { font:400 13.5px/1.5 system-ui; color:var(--sk-text); margin-bottom:12px; }\n  .sk-body b { color:var(--sk-strong); font-weight:700; }\n\n  .sk-sites { list-style:none; margin:0 0 12px; padding:11px 13px; background:#202327; border-radius:8px; display:flex; flex-direction:column; gap:7px; }\n  .sk-sites li { display:flex; align-items:center; gap:8px; font:400 12.5px/1.3 system-ui; color:var(--sk-text); }\n  .sk-sites li .sid { font-weight:700; color:var(--sk-strong); font-family:ui-monospace,Menlo,monospace; }\n  .sk-sites li .loop { color:var(--sk-muted); }\n  .sk-sites li .dot { width:6px; height:6px; border-radius:50%; background:var(--rt-avail); flex:none; }\n  .sk-sites .more { color:var(--sk-muted); font-size:12px; padding-top:1px; }\n\n  .sk-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }\n  .btn { font:700 13px/1 system-ui; padding:9px 13px; border-radius:5px; border:1px solid var(--sk-btn-border); color:var(--sk-text); background:transparent; display:inline-flex; align-items:center; gap:7px; }\n  .btn.primary { background:var(--sk-green); border-color:var(--sk-green); color:#fff; }\n  .btn.danger { color:var(--sk-danger); border-color:transparent; padding-left:6px; padding-right:6px; }\n  .btn .ic { font-size:13px; }\n\n  .sk-ctx { display:flex; align-items:center; gap:7px; margin-top:11px; font:400 12px/1.35 system-ui; color:var(--sk-muted); }\n  .sk-ctx .cdot { width:3px; height:3px; border-radius:50%; background:var(--sk-muted); }\n\n  .note { margin:34px 0 0; padding:16px 18px; background:#131417; border:1px solid #26282c; border-radius:11px; max-width:760px; }\n  .note h4 { margin:0 0 9px; font:600 13px/1.2 system-ui; color:#e6e8eb; }\n  .note ul { margin:0; padding-left:18px; }\n  .note li { font:400 12.5px/1.6 system-ui; color:#9a9b9e; }\n  .note li b { color:#d1d2d3; font-weight:600; }\n  .doc-next { margin:30px 0 0; font:400 12px/1.6 system-ui; color:#75777b; max-width:760px; }\n  .doc-next a { color:var(--rt-brand); font-weight:600; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div class=\"doc\">\n  <p class=\"doc-eyebrow\">Roadtrip Map · Slack notifications<\u002Fp>\n  <h1 class=\"doc-h1\">Watch alerts, styled for Slack's grain.<\u002Fh1>\n  <p class=\"doc-sub\">Slack gives you one real styling lever — the <b style=\"color:#d1d2d3;\">attachment color bar<\u002Fb> — plus emoji and native Block Kit buttons. The current messages skip all three: emoji-as-links instead of buttons, no color bar, flat fields. These redesigns map the design system's availability semantics onto that color bar, promote actions to real buttons, and tighten the hierarchy.<\u002Fp>\n\n  <div class=\"legend\">\n    <div class=\"lg\"><span class=\"bar\" style=\"background:var(--rt-avail);\"><\u002Fspan><span class=\"t\">Available <small>a site opened · green<\u002Fsmall><\u002Fspan><\u002Fdiv>\n    <div class=\"lg\"><span class=\"bar\" style=\"background:var(--rt-brand);\"><\u002Fspan><span class=\"t\">Watching <small>armed, idle · blue<\u002Fsmall><\u002Fspan><\u002Fdiv>\n    <div class=\"lg\"><span class=\"bar\" style=\"background:var(--rt-faint);\"><\u002Fspan><span class=\"t\">Paused <small>muted / inactive<\u002Fsmall><\u002Fspan><\u002Fdiv>\n    <div class=\"lg\"><span class=\"bar\" style=\"background:var(--rt-first-come);\"><\u002Fspan><span class=\"t\">Expiring <small>window closing · amber<\u002Fsmall><\u002Fspan><\u002Fdiv>\n    <div class=\"lg\"><span class=\"bar\" style=\"background:var(--rt-error);\"><\u002Fspan><span class=\"t\">Error <small>check failed · red<\u002Fsmall><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ AVAILABLE ============ -->\n  <div class=\"sect-h\"><span class=\"sect-n\">A<\u002Fspan><h2 class=\"sect-t\">The payoff — sites available<\u002Fh2><\u002Fdiv>\n  <p class=\"sect-d\">The one alert that matters most. Green bar, count up front, a scannable site list, and one unmistakable primary action. Reserve is the only filled button; everything else recedes.<\u002Fp>\n  <div class=\"row\">\n    <div class=\"frame\" id=\"s1\">\n      <div class=\"frame-cap\"><span class=\"oid\">s1<\u002Fspan>Campsites available<\u002Fdiv>\n      <div class=\"sk\" style=\"--barc:var(--rt-avail);\">\n        <div class=\"sk-head\">\n          <div class=\"sk-av\">🏕️<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"sk-meta\"><span class=\"sk-name\">Roadtrip<\u002Fspan><span class=\"sk-badge\">APP<\u002Fspan><span class=\"sk-time\">11:23 AM<\u002Fspan><\u002Fdiv>\n            <div class=\"sk-att\" style=\"margin-top:8px;\">\n              <div class=\"sk-title\">🏕️ 6 sites just opened<\u002Fdiv>\n              <div class=\"sk-fields\">\n                <div class=\"sk-f\"><div class=\"k\">Campground<\u002Fdiv><div class=\"v\">Red Bridge · Mt. Baker-Snoqualmie NF<\u002Fdiv><\u002Fdiv>\n                <div class=\"sk-f\"><div class=\"k\">Your window<\u002Fdiv><div class=\"v mono\">Jul 9 → Jul 10<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <ul class=\"sk-sites\">\n                <li><span class=\"dot\"><\u002Fspan><span class=\"sid\">002<\u002Fspan><span class=\"loop\">Area Red Bridge · Standard nonelectric<\u002Fspan><\u002Fli>\n                <li><span class=\"dot\"><\u002Fspan><span class=\"sid\">003<\u002Fspan><span class=\"loop\">Area Red Bridge · Standard nonelectric<\u002Fspan><\u002Fli>\n                <li><span class=\"dot\"><\u002Fspan><span class=\"sid\">009<\u002Fspan><span class=\"loop\">Area Red Bridge · Standard nonelectric<\u002Fspan><\u002Fli>\n                <li class=\"more\">+ 3 more — 011, 012, 013<\u002Fli>\n              <\u002Ful>\n              <div class=\"sk-actions\">\n                <a class=\"btn primary\" href=\"#s1\"><span class=\"ic\">🎟️<\u002Fspan>Reserve site 002<\u002Fa>\n                <a class=\"btn\" href=\"#s1\">Availability grid<\u002Fa>\n                <a class=\"btn\" href=\"#s1\"><span class=\"ic\">⏸<\u002Fspan>Pause<\u002Fa>\n                <a class=\"btn danger\" href=\"#s1\"><span class=\"ic\">🗑<\u002Fspan>Delete<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"sk-ctx\">Checked just now · every 5 min<span class=\"cdot\"><\u002Fspan>Reserve links straight to Recreation.gov<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ WATCHING / PAUSED ============ -->\n  <div class=\"sect-h\"><span class=\"sect-n\">B<\u002Fspan><h2 class=\"sect-t\">Status — watching &amp; paused<\u002Fh2><\u002Fdiv>\n  <p class=\"sect-d\">Confirmation messages when you set, pause, or resume a watch. Same skeleton as the payoff so the family reads as one system — only the bar color, emoji, title and primary action change.<\u002Fp>\n  <div class=\"row\">\n\n    <div class=\"frame\" id=\"s2\">\n      <div class=\"frame-cap\"><span class=\"oid\">s2<\u002Fspan>Watching for openings<\u002Fdiv>\n      <div class=\"sk\" style=\"--barc:var(--rt-brand);\">\n        <div class=\"sk-head\">\n          <div class=\"sk-av\">🗺️<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"sk-meta\"><span class=\"sk-name\">Roadtrip<\u002Fspan><span class=\"sk-badge\">APP<\u002Fspan><span class=\"sk-time\">8:07 PM<\u002Fspan><\u002Fdiv>\n            <div class=\"sk-att\" style=\"margin-top:8px;\">\n              <div class=\"sk-title\">👀 Watching for openings<\u002Fdiv>\n              <div class=\"sk-fields\">\n                <div class=\"sk-f\"><div class=\"k\">Campground<\u002Fdiv><div class=\"v\">Upper Pines Campground<\u002Fdiv><\u002Fdiv>\n                <div class=\"sk-f\"><div class=\"k\">Window<\u002Fdiv><div class=\"v mono\">Jul 10 → Jul 11<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"sk-body\">Nothing open right now — I'll ping you the moment a site frees up.<\u002Fdiv>\n              <div class=\"sk-actions\">\n                <a class=\"btn\" href=\"#s2\">Availability grid<\u002Fa>\n                <a class=\"btn\" href=\"#s2\">View on map<\u002Fa>\n                <a class=\"btn\" href=\"#s2\"><span class=\"ic\">⏸<\u002Fspan>Pause<\u002Fa>\n                <a class=\"btn danger\" href=\"#s2\"><span class=\"ic\">🗑<\u002Fspan>Delete<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"sk-ctx\">Armed · checked 2 min ago<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"frame\" id=\"s3\">\n      <div class=\"frame-cap\"><span class=\"oid\">s3<\u002Fspan>Watch paused<\u002Fdiv>\n      <div class=\"sk\" style=\"--barc:var(--rt-faint);\">\n        <div class=\"sk-head\">\n          <div class=\"sk-av\" style=\"background:linear-gradient(135deg,#5b6069,#3a3d42);\">🗺️<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"sk-meta\"><span class=\"sk-name\">Roadtrip<\u002Fspan><span class=\"sk-badge\">APP<\u002Fspan><span class=\"sk-time\">8:07 PM<\u002Fspan><\u002Fdiv>\n            <div class=\"sk-att\" style=\"margin-top:8px;\">\n              <div class=\"sk-title\" style=\"color:var(--sk-muted);\">⏸ Watch paused<\u002Fdiv>\n              <div class=\"sk-fields\">\n                <div class=\"sk-f\"><div class=\"k\">Campground<\u002Fdiv><div class=\"v\">Upper Pines Campground<\u002Fdiv><\u002Fdiv>\n                <div class=\"sk-f\"><div class=\"k\">Window<\u002Fdiv><div class=\"v mono\">Jul 10 → Jul 11<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"sk-body\">Paused — I won't alert until you resume this watch.<\u002Fdiv>\n              <div class=\"sk-actions\">\n                <a class=\"btn primary\" href=\"#s3\" style=\"background:var(--rt-brand); border-color:var(--rt-brand);\"><span class=\"ic\">▶<\u002Fspan>Resume<\u002Fa>\n                <a class=\"btn\" href=\"#s3\">Availability grid<\u002Fa>\n                <a class=\"btn danger\" href=\"#s3\"><span class=\"ic\">🗑<\u002Fspan>Delete<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"sk-ctx\">Paused 3 min ago<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- ============ EDGE STATES ============ -->\n  <div class=\"sect-h\"><span class=\"sect-n\">C<\u002Fspan><h2 class=\"sect-t\">Edge states — expiring &amp; error<\u002Fh2><\u002Fdiv>\n  <p class=\"sect-d\">Two states the current flow doesn't surface at all. Both are proactive nudges: the amber \"expiring\" prompts a decision before the window passes; the red \"error\" tells you a watch went stale so it isn't silently dead.<\u002Fp>\n  <div class=\"row\">\n\n    <div class=\"frame\" id=\"s4\">\n      <div class=\"frame-cap\"><span class=\"oid\">s4<\u002Fspan>Window expiring<\u002Fdiv>\n      <div class=\"sk\" style=\"--barc:var(--rt-first-come);\">\n        <div class=\"sk-head\">\n          <div class=\"sk-av\" style=\"background:linear-gradient(135deg,var(--rt-first-come),#c9720f);\">🗺️<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"sk-meta\"><span class=\"sk-name\">Roadtrip<\u002Fspan><span class=\"sk-badge\">APP<\u002Fspan><span class=\"sk-time\">9:00 AM<\u002Fspan><\u002Fdiv>\n            <div class=\"sk-att\" style=\"margin-top:8px;\">\n              <div class=\"sk-title\" style=\"color:var(--rt-first-come);\">⏳ Watch expires tomorrow<\u002Fdiv>\n              <div class=\"sk-fields\">\n                <div class=\"sk-f\"><div class=\"k\">Campground<\u002Fdiv><div class=\"v\">Kirk Creek Campground<\u002Fdiv><\u002Fdiv>\n                <div class=\"sk-f\"><div class=\"k\">Window<\u002Fdiv><div class=\"v mono\">ends Jul 7<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"sk-body\">No luck this window — <b>0 openings<\u002Fb> in 6 days of checking. Extend the dates or let it expire?<\u002Fdiv>\n              <div class=\"sk-actions\">\n                <a class=\"btn primary\" href=\"#s4\" style=\"background:var(--rt-brand); border-color:var(--rt-brand);\">Extend window<\u002Fa>\n                <a class=\"btn\" href=\"#s4\">Keep watching<\u002Fa>\n                <a class=\"btn danger\" href=\"#s4\"><span class=\"ic\">🗑<\u002Fspan>Delete<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"sk-ctx\">Auto-expires in 22 hours<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"frame\" id=\"s5\">\n      <div class=\"frame-cap\"><span class=\"oid\">s5<\u002Fspan>Check failed<\u002Fdiv>\n      <div class=\"sk\" style=\"--barc:var(--rt-error);\">\n        <div class=\"sk-head\">\n          <div class=\"sk-av\" style=\"background:linear-gradient(135deg,var(--rt-error),#b83030);\">🗺️<\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div class=\"sk-meta\"><span class=\"sk-name\">Roadtrip<\u002Fspan><span class=\"sk-badge\">APP<\u002Fspan><span class=\"sk-time\">2:14 AM<\u002Fspan><\u002Fdiv>\n            <div class=\"sk-att\" style=\"margin-top:8px;\">\n              <div class=\"sk-title\" style=\"color:var(--rt-error);\">⚠️ Couldn't check availability<\u002Fdiv>\n              <div class=\"sk-fields\">\n                <div class=\"sk-f\"><div class=\"k\">Campground<\u002Fdiv><div class=\"v\">Limekiln SP<\u002Fdiv><\u002Fdiv>\n                <div class=\"sk-f\"><div class=\"k\">Last good check<\u002Fdiv><div class=\"v mono\">6 hours ago<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"sk-body\">Recreation.gov didn't respond on the last 3 tries. Still armed — I'll keep retrying with backoff.<\u002Fdiv>\n              <div class=\"sk-actions\">\n                <a class=\"btn\" href=\"#s5\"><span class=\"ic\">🔁<\u002Fspan>Retry now<\u002Fa>\n                <a class=\"btn danger\" href=\"#s5\"><span class=\"ic\">🗑<\u002Fspan>Delete<\u002Fa>\n              <\u002Fdiv>\n              <div class=\"sk-ctx\">Next retry in ~10 min<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"note\">\n    <h4>Implementing in Block Kit<\u002Fh4>\n    <ul>\n      <li><b>Color bar<\u002Fb> = the message <b>attachment<\u002Fb> <code style=\"font-family:ui-monospace,Menlo,monospace;\">color<\u002Fcode> field. Map to tokens: available <code>#4cb96a<\u002Fcode>, watching <code>#3b82f6<\u002Fcode>, paused <code>#8a8f96<\u002Fcode>, expiring <code>#f1a04a<\u002Fcode>, error <code>#f56565<\u002Fcode>. Put the blocks inside the attachment so the stripe applies.<\u002Fli>\n      <li><b>Real buttons<\u002Fb> replace emoji-links — an <code>actions<\u002Fcode> block of <code>button<\u002Fcode> elements. Slack only offers <b>default / primary (green) / danger (red)<\u002Fb> styles, so the main CTA uses <code>primary<\u002Fcode>; destructive uses <code>danger<\u002Fcode>; everything else default. (This is why Reserve/Resume read green here rather than brand-blue — it's Slack's only filled style.)<\u002Fli>\n      <li><b>Fields<\u002Fb> = a <code>section<\u002Fcode> with a two-column <code>fields<\u002Fcode> array; bold the label with <code>*asterisks*<\u002Fcode>.<\u002Fli>\n      <li><b>Site list<\u002Fb> = one <code>section<\u002Fcode> with mrkdwn bullets; cap at 3 and summarize the rest to avoid a wall of text.<\u002Fli>\n      <li><b>Sub-line<\u002Fb> (\"checked just now\", \"auto-expires…\") = a <code>context<\u002Fcode> block — small and muted for free.<\u002Fli>\n      <li><b>Suppress the auto-unfurl<\u002Fb> of the Recreation.gov link (<code>unfurl_links:false<\u002Fcode>) so the giant stock photo doesn't dominate — the Reserve button carries the link.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <p class=\"doc-next\">Try next: \"turn these into copy-paste Block Kit JSON\" · \"add a daily digest that batches all active watches into one message\" · \"design the <a href=\"#s1\">s1<\u002Fa> reserve confirmation\" · \"show these in Slack light theme too\"<\u002Fp>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
