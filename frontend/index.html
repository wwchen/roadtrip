<!DOCTYPE html>
<html lang="en" class="theme-roadtrip-zion">
<head>
<meta charset="utf-8">
<!-- `viewport-fit=cover` is load-bearing, not decoration: without it iOS reports
     every env(safe-area-inset-*) as 0, and the panel and its buttons — which
     position themselves with max(10px, env(safe-area-inset-top)) — slide under the
     notch. `maximum-scale=1` matches the vanilla map page: the map owns pinch
     zoom, so a page-level pinch fights it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- theme-color is read by browser chrome before any stylesheet loads, so it
     cannot be a token reference. Mirrors --rt-surface. -->
<meta name="theme-color" content="#ffffff">
<title>Roadtrip</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<!-- Nothing else belongs here. The `--rt-*` tokens are bundled through
     @ui/styles.css, and the sandbox chrome is started by mountPage(); both used to
     be tags injected into this shell by a Vite plugin and served from web/. -->
<script>
/* Applied before first paint, so a dark user never sees a white flash. Reads the
   mirror src/lib/theme.ts writes; falls back to the OS. Duplicated in all three
   shells and pinned by src/test/page-shells.test.ts — edit all three together. */
(function(){try{var m=localStorage.getItem('rt-theme');if(m!=='light'&&m!=='dark'){m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(m==='dark'){document.documentElement.classList.add('mode-dark');var t=document.querySelector('meta[name="theme-color"]');if(t){t.setAttribute('content','#101215');}}}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/pages/map/main.tsx"></script>
</body>
</html>
