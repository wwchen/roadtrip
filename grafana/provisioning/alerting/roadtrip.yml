apiVersion: 1

groups:
  - orgId: 1
    name: availability-watch-alerts
    folder: roadtrip
    interval: 5m
    rules:
      - uid: availability-watch-rate-limited
        title: Availability watch rate-limited
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: roadtrip-postgres
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT count(*) AS value FROM availability_fetch_call WHERE outcome = 'rate_limited' AND created_at > now() - interval '30 minutes'"
              refId: A
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5 rate-limited availability fetch calls in the last 30 minutes.

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-contact-point
        type: slack
        settings:
          url: ${GRAFANA_SLACK_WEBHOOK_URL}

policies:
  - orgId: 1
    receiver: slack
    group_by:
      - grafana_folder
      - alertname
    routes: []

muteTimes: []
templates: []
