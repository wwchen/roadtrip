apiVersion: 1

providers:
  - name: roadtrip-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    # >10 keeps Grafana in polling mode (stat the files each interval). At <=10
    # it uses filesystem-watch/inotify, whose events don't cross the deploy
    # host's Docker bind mount, so git-updated dashboards never self-reload.
    updateIntervalSeconds: 30
    allowUiUpdates: $GRAFANA_DASHBOARD_ALLOW_UI_UPDATES
    options:
      path: /etc/grafana/dashboards
