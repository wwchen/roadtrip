apiVersion: 1

datasources:
  - name: Roadtrip Postgres
    uid: roadtrip-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      # $__file{} is Grafana's file provider: read the mounted secret rather
      # than an environment value. Same secret postgres-init creates the role
      # with, so the two cannot disagree.
      password: $__file{/run/secrets/grafana_db_password}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
