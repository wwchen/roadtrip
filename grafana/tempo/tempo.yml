server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Tempo 3.x has no top-level `compactor:` — compaction lives here. Check any
# change against `curl localhost:3200/status/config`; an unknown field is a hard
# startup failure. 168h matches Loki, since traces and logs are read together.
#
# This value alone does NOT expire anything. Retention is applied per tenant and
# the retention provider reads the tenant limit, not this block, so setting only
# this left `tempo_limits_defaults{limit_name="block_retention"}` at 0 and
# nothing was ever deleted: blocks piled up to 16 days and 25GB, half of all
# Docker data on the host, until the disk filled and deadlocked the daemon. The
# `overrides.defaults.compaction` entry below is what actually expires blocks;
# keep the two in sync. Verify the limit is live, not just configured:
#   curl -s localhost:3200/metrics | grep 'limit_name="block_retention"'
# 168h reads as 6.048e+14 (nanoseconds); 0 means retention is off.
#
# That check is necessary and NOT sufficient — it went on reading 6.048e+14
# through a second pile-up, 35GB across 68,900 blocks, because a live limit
# still has to reach a block. Retention and compaction both act on the
# blocklist, and the blocklist is rebuilt by a poll that reads every block's
# meta.json. The first incident killed Tempo mid-write and left two blocks whose
# files were all zero bytes; an empty meta.json parses as "unexpected end of
# JSON input", and the poller fails the whole tenant poll if ANY block errors.
# So the blocklist was never rebuilt, retention ran 192 times and deleted
# nothing, and the disk filled again — the first incident seeding the second.
#
# blocklist_poll_tolerate_consecutive_errors does not protect against this: it
# retries the whole tenant poll rather than skipping the block, and a corrupt
# block fails every retry. No setting quarantines one. The fix is to delete the
# block, which the log names:
#   docker logs roadtrip-tempo-1 | grep 'failed to poll'
#   docker run --rm -v roadtrip_tempo-data:/v alpine \
#     find /v/blocks/single-tenant -name meta.json -size 0
# What makes that a ten-minute job rather than a month is the alert on
# tempodb_blocklist_tenant_index_errors_total (provisioning/alerting/roadtrip.yml):
# it was rising, unread, for 26 days.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

# Feeds serviceMap and tracesToMetrics in the Tempo datasource; without it those
# views render blank. send_exemplars needs --enable-feature=exemplar-storage on
# Prometheus (docker-compose.yml).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Generators are opt-in per tenant; this is how single-tenant Tempo turns them on.
overrides:
  defaults:
    # The limit the retention provider actually enforces (see backend_scheduler
    # above). Without it the effective limit is 0 and blocks are never deleted.
    compaction:
      block_retention: 168h
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
