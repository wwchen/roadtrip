<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Availability Logs</title>
<link rel="stylesheet" href="/web/components/catalog.css">
</head>
<body class="catalog-page catalog-page-logs">
<main class="shell">
  <header class="top">
    <div>
      <h1>Availability Logs</h1>
      <div class="sub">Append-only reservable availability observations.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois">POIs</a>
        <a href="/reservables">Reservables</a>
        <a href="/pollers">Pollers</a>
        <a href="/logs" aria-current="page">Logs</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <form id="logs-query" class="panel">
    <div class="filters">
      <label>
        Log ID
        <input name="id" inputmode="numeric" placeholder="123">
      </label>
      <label>
        Run ID
        <input name="run_id" inputmode="numeric" placeholder="285">
      </label>
      <label>
        Poller ID
        <input name="poller_id" inputmode="numeric" placeholder="12">
      </label>
      <label class="wide">
        Reservable RID
        <input name="rid" placeholder="site:recgov:106">
      </label>
      <label>
        Target date
        <input name="target_date" type="date">
      </label>
      <label class="wide">
        Limit
        <select name="limit">
          <option>50</option>
          <option selected>100</option>
          <option>250</option>
          <option>500</option>
        </select>
      </label>
      <div class="actions">
        <button class="primary" type="submit">Search</button>
        <button data-action="reset-logs-query" type="button">Reset</button>
      </div>
    </div>
  </form>

  <section class="panel" aria-live="polite">
    <div id="status" class="status">
      <span>Loading...</span>
      <span class="mono muted" id="query-url"></span>
    </div>
    <div id="results"></div>
    <div id="empty" class="empty" hidden>No availability logs match these filters.</div>
  </section>
</main>
<script type="module" src="/web/logs.js"></script>
</body>
</html>
