<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>POIs</title>
<link rel="stylesheet" href="/web/components/catalog.css">
</head>
<body class="catalog-page catalog-page-pois">
<main class="shell">
  <header class="top">
    <div>
      <h1>POIs</h1>
      <div class="sub">Name search across active map points.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois" aria-current="page">POIs</a>
        <a href="/reservables">Reservables</a>
        <a href="/pollers">Pollers</a>
        <a href="/logs">Logs</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <div id="poi-query">
    <form id="poi-form" class="panel" autocomplete="off">
      <div class="filters filters-poi">
        <label>
          ID
          <input name="id" inputmode="numeric" placeholder="64397">
        </label>
        <label>
          Name
          <input name="q" placeholder="Glacier, Upper Pines, Planet Fitness">
        </label>
        <label>
          Categories
          <input name="categories" placeholder="campground, supercharger">
        </label>
        <label>
          Limit
          <select name="limit">
            <option value="10">10</option>
            <option value="25" selected>25</option>
          </select>
        </label>
        <div class="actions">
          <button class="primary" type="submit">Search</button>
          <button data-action="reset-poi-query" type="button">Reset</button>
        </div>
      </div>
    </form>
  </div>

  <section class="panel" aria-live="polite">
    <div id="status" class="status">
      <span>Enter at least 2 characters.</span>
      <span class="mono muted" id="query-url"></span>
    </div>
    <div id="results"></div>
    <div id="empty" class="empty">Enter at least 2 characters to search.</div>
  </section>
</main>
<script type="module" src="/web/pois.js"></script>
</body>
</html>
