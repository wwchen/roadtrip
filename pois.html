<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>POIs</title>
<style>
  :root {
    --surface: #26272d;
    --bg: #1c1d21;
    --bg-subtle: rgba(255,255,255,0.04);
    --bg-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e6e8eb;
    --muted: #8a8f96;
    --faint: #5a6068;
    --accent: #4cb96a;
    --accent-hover: #62cc7d;
    --error: #f56565;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { padding: 20px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .shell {
    max-width: 1280px;
    margin: 0 auto;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 650;
  }
  .sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 10px 16px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .nav-group + .nav-group {
    padding-left: 14px;
    border-left: 1px solid var(--border-strong);
  }
  .nav a,
  button {
    border: 1px solid var(--border-strong);
    background: var(--bg-subtle);
    color: var(--text);
    border-radius: 8px;
    height: 34px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav a:hover,
  button:hover {
    background: var(--bg-hover);
    text-decoration: none;
  }
  .nav a[aria-current="page"] {
    border-color: rgba(76,185,106,0.45);
    background: rgba(76,185,106,0.12);
    color: #87d99b;
  }
  .nav a.outside-link {
    gap: 7px;
  }
  .nav a.outside-link::after {
    content: "";
    width: 10px;
    height: 10px;
    border-top: 1.5px solid currentColor;
    border-right: 1.5px solid currentColor;
    opacity: 0.7;
  }
  button.primary {
    border-color: rgba(76,185,106,0.55);
    background: #2f7a3a;
  }
  button.primary:hover { background: #356f3e; }
  button:disabled { opacity: 0.55; cursor: default; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  }
  form.panel {
    padding: 14px;
    margin-bottom: 14px;
  }
  .filters {
    display: grid;
    grid-template-columns: 120px minmax(240px, 2fr) minmax(170px, 1fr) 120px auto;
    gap: 10px;
    align-items: end;
  }
  label {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input,
  select {
    width: 100%;
    min-width: 0;
    height: 34px;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--bg-subtle);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 0 9px;
  }
  input::placeholder { color: var(--faint); }
  input:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .status strong { color: var(--text); font-weight: 650; }
  .error {
    color: var(--error);
    font-weight: 600;
  }
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
    font-size: 13px;
  }
  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  td { color: var(--text); }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  .result-row.is-expanded { background: rgba(255,255,255,0.025); }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
  }
  .muted { color: var(--muted); }
  .name {
    max-width: 360px;
    min-width: 220px;
    overflow-wrap: anywhere;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 220px;
    align-items: flex-start;
  }
  .link-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    min-height: 26px;
    padding: 3px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--bg-subtle);
    color: var(--accent);
    font-size: 13px;
    line-height: 1.25;
  }
  a.link-chip:hover {
    background: var(--bg-hover);
    text-decoration: none;
  }
  a.link-chip:hover .link-text,
  button.link-chip:hover .link-text {
    text-decoration: underline;
  }
  .link-text {
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .chip-kind {
    color: var(--muted);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .chip-kind.page { color: #87d99b; }
  .chip-kind.json { color: #f1c27d; }
  .action-icon {
    position: relative;
    display: inline-block;
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: currentColor;
  }
  .action-icon.inline::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 6px;
    height: 6px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(-45deg);
  }
  .link-button.active .action-icon.inline::before {
    left: 4px;
    top: 1px;
    transform: rotate(45deg);
  }
  .action-icon.open::before {
    content: "";
    position: absolute;
    left: 1px;
    bottom: 1px;
    width: 9px;
    height: 9px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    opacity: 0.82;
  }
  .action-icon.open::after {
    content: "";
    position: absolute;
    right: 1px;
    top: 1px;
    width: 7px;
    height: 7px;
    border-top: 1.5px solid currentColor;
    border-right: 1.5px solid currentColor;
  }
  .name-link {
    color: var(--accent);
  }
  .link-button {
    height: auto;
    min-height: 0;
    color: var(--accent);
    justify-content: flex-start;
  }
  .link-button:hover {
    background: var(--bg-hover);
    color: var(--accent-hover);
    text-decoration: underline;
  }
  .link-button.active { color: var(--accent-hover); }
  .reservables-row td {
    padding: 0;
    background: rgba(255,255,255,0.018);
  }
  .availability-row td {
    padding: 0;
    background: rgba(255,255,255,0.018);
  }
  .reservables-panel {
    display: grid;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .availability-panel {
    display: grid;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .reservables-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .reservables-heading strong { color: var(--text); }
  .reservables-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sub-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .sub-heading strong { color: var(--text); }
  .sub-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .availability-controls {
    display: grid;
    grid-template-columns: repeat(4, minmax(120px, 1fr)) auto;
    gap: 10px;
    align-items: end;
  }
  .availability-force {
    display: flex;
    min-height: 34px;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
    font-weight: 400;
  }
  .availability-force input {
    width: auto;
    height: auto;
  }
  .availability-result {
    display: grid;
    gap: 8px;
  }
  .availability-summary {
    color: var(--muted);
    font-size: 13px;
  }
  .availability-summary strong { color: var(--text); }
  .availability-days {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .day-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 26px;
    padding: 3px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--bg-subtle);
    color: var(--muted);
    font-size: 12px;
  }
  .day-pill.available {
    border-color: rgba(76,185,106,0.45);
    background: rgba(76,185,106,0.12);
    color: #87d99b;
  }
  .day-pill.partial {
    border-color: rgba(241,194,125,0.42);
    background: rgba(241,194,125,0.10);
    color: #f1c27d;
  }
  .reservables-table-wrap {
    width: 100%;
    overflow-x: auto;
  }
  .reservables-table {
    width: 100%;
    min-width: 840px;
    table-layout: fixed;
  }
  .reservables-table .col-rid { width: 25%; }
  .reservables-table .col-name { width: 16%; }
  .reservables-table .col-loop { width: 12%; }
  .reservables-table .col-site-type { width: 16%; }
  .reservables-table .col-links { width: 31%; }
  .reservables-table .rid {
    max-width: 340px;
    overflow-wrap: anywhere;
  }
  .reservables-table .name {
    max-width: 260px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .reservables-table .links {
    min-width: 0;
  }
  .json-details summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    list-style: none;
    cursor: pointer;
    color: var(--accent);
  }
  .json-details summary::-webkit-details-marker { display: none; }
  .json-details[open] .action-icon.inline::before {
    left: 4px;
    top: 1px;
    transform: rotate(45deg);
  }
  pre {
    margin: 8px 0 0;
    padding: 9px;
    max-height: 260px;
    overflow: auto;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .empty {
    padding: 34px 14px;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 900px) {
    .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .actions { align-self: end; }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .top,
    .status {
      align-items: flex-start;
      flex-direction: column;
    }
    .nav { justify-content: flex-start; }
    .nav-group + .nav-group {
      width: 100%;
      padding-left: 0;
      padding-top: 8px;
      border-left: 0;
      border-top: 1px solid var(--border-strong);
    }
    .filters { grid-template-columns: 1fr; }
    .actions { flex-wrap: wrap; }
    .table-wrap { overflow-x: visible; }
    table,
    tbody,
    tr,
    td {
      display: block;
    }
    table { min-width: 0; }
    thead { display: none; }
    tbody {
      display: grid;
      gap: 10px;
      padding: 10px;
    }
    tbody tr.result-row,
    tbody tr.reservables-row,
    tbody tr.availability-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.018);
      overflow: hidden;
    }
    tbody tr.result-row.has-subrow {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom-color: transparent;
    }
    tbody tr.reservables-row,
    tbody tr.availability-row {
      margin-top: -10px;
      border-top: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    tbody tr.result-row td {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    tbody tr.result-row td:last-child { border-bottom: 0; }
    tbody tr.result-row td::before {
      content: attr(data-label);
      grid-column: 1;
      grid-row: 1 / -1;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    tbody tr.result-row td > * { grid-column: 2; }
    .name {
      max-width: none;
      min-width: 0;
    }
    .links { min-width: 0; align-items: flex-start; }
    .reservables-row td {
      display: block;
      border-bottom: 0;
    }
    .availability-row td {
      display: block;
      border-bottom: 0;
    }
    .reservables-panel {
      border-bottom: 0;
      padding: 12px 10px;
    }
    .availability-panel {
      border-bottom: 0;
      padding: 12px 10px;
    }
    .reservables-heading {
      align-items: flex-start;
      flex-direction: column;
    }
    .sub-heading {
      align-items: flex-start;
      flex-direction: column;
    }
    .availability-controls { grid-template-columns: 1fr; }
    pre { max-width: 100%; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>POIs</h1>
      <div class="sub">Name search across active map points.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois" aria-current="page">POIs</a>
        <a href="/reservables">Reservables</a>
        <a href="/monitors">Monitors</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <div id="poi-query"></div>

  <section class="panel" aria-live="polite">
    <div id="status" class="status">
      <span>Enter at least 2 characters.</span>
      <span class="mono muted" id="query-url"></span>
    </div>
    <div id="results"></div>
    <div id="empty" class="empty">Enter at least 2 characters to search.</div>
  </section>
</main>
<script type="module" src="/web/pois.js"></script>
</body>
</html>
