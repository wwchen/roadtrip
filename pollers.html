<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Availability Pollers</title>
<link rel="stylesheet" href="/web/components/catalog.css">
</head>
<body class="catalog-page catalog-page-pollers">
<main class="shell">
  <header class="top">
    <div>
      <h1>Availability Pollers</h1>
      <div class="sub">Intent-based reservable availability polling jobs.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois">POIs</a>
        <a href="/reservables">Reservables</a>
        <a href="/pollers" aria-current="page">Pollers</a>
        <a href="/logs">Logs</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <div id="poller-form-root">
    <form id="poller-form" class="panel poller-form" autocomplete="off">
      <div class="form-header">
        <div>
          <strong data-role="poller-form-title">Create poller</strong>
          <span class="mono muted" data-role="poller-form-id"></span>
        </div>
        <div data-role="poller-form-api">
          <span class="api-call api-call-static">
            <span class="api-method">POST</span>
            <span class="api-path">/api/reservables/availability/pollers</span>
          </span>
        </div>
      </div>

      <div class="form-stack">
        <section class="form-section">
          <div class="form-section-title">Scope and schedule</div>
          <div class="form-grid">
            <label>
              Scope
              <select name="scope_type">
                <option value="rid">Reservable</option>
                <option value="poi_id">POI</option>
              </select>
            </label>
            <label class="field-wide">
              Scope ID
              <input name="scope_value" placeholder="site:recgov:100">
            </label>
            <label>
              Status
              <select name="status">
                <option value="active">active</option>
                <option value="paused">paused</option>
                <option value="done">done</option>
              </select>
            </label>
            <label>
              Min nights
              <input name="min_nights" type="number" min="1" max="31" value="1">
            </label>
            <label>
              Cadence
              <input name="cadence" type="number" min="5" value="300">
            </label>
            <div class="date-field field-span-3">
              <label>
                Target date
                <span class="date-entry">
                  <input name="target_date" type="date">
                  <button type="button" data-action="add-target-date">Add</button>
                </span>
              </label>
              <div class="date-chip-list" data-role="target-dates"></div>
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="form-section-title">Reservable filters</div>
          <div class="form-grid">
            <label>
              Type
              <input name="filter_type" placeholder="site">
            </label>
            <label>
              Vendor
              <input name="filter_vendor" placeholder="recgov">
            </label>
            <label>
              Vendor ID
              <input name="filter_vendor_id" placeholder="330257">
            </label>
            <label>
              Name
              <input name="filter_name">
            </label>
            <label>
              Loop
              <input name="filter_loop">
            </label>
            <label>
              Site type
              <input name="filter_site_type">
            </label>
            <label class="field-span-3">
              Raw contains
              <textarea name="filter_raw" spellcheck="false"></textarea>
            </label>
          </div>
        </section>

        <section class="form-section">
          <div class="form-section-title">Behavior</div>
          <div class="form-grid form-grid-compact">
            <label class="field-wide">
              Trigger actions
              <input name="trigger_actions" value="notify_slack">
            </label>
            <label class="check-row">
              <input name="stop_when_triggered" type="checkbox" checked>
              Stop when triggered
            </label>
            <label class="check-row">
              <input name="force" type="checkbox">
              Force first poll
            </label>
            <div class="actions form-actions">
              <button class="primary" type="submit" data-role="poller-form-submit">Create</button>
              <button data-action="reset-poller-form" type="button">Reset</button>
              <button data-action="cancel-poller-edit" type="button" hidden>Cancel</button>
            </div>
          </div>
        </section>
      </div>
    </form>
  </div>

  <section class="panel" aria-live="polite">
    <div class="toolbar">
      <div id="status" class="status">Loading...</div>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
    <div id="results"></div>
    <div id="empty" class="empty" hidden>No pollers.</div>
  </section>
</main>
<script type="module" src="/web/pollers.js"></script>
</body>
</html>
