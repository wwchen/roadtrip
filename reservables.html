<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Reservables</title>
<style>
  :root {
    --surface: #26272d;
    --bg: #1c1d21;
    --bg-subtle: rgba(255,255,255,0.04);
    --bg-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e6e8eb;
    --muted: #8a8f96;
    --faint: #5a6068;
    --accent: #4cb96a;
    --accent-hover: #62cc7d;
    --error: #f56565;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { padding: 20px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .shell {
    max-width: 1280px;
    margin: 0 auto;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 650;
  }
  .sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .nav a,
  button {
    border: 1px solid var(--border-strong);
    background: var(--bg-subtle);
    color: var(--text);
    border-radius: 8px;
    height: 34px;
    padding: 0 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav a:hover,
  button:hover {
    background: var(--bg-hover);
    text-decoration: none;
  }
  button.primary {
    border-color: rgba(76,185,106,0.55);
    background: #2f7a3a;
  }
  button.primary:hover { background: #356f3e; }
  button:disabled { opacity: 0.55; cursor: default; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  }
  form.panel {
    padding: 14px;
    margin-bottom: 14px;
  }
  .filters {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
    align-items: end;
  }
  label {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input,
  select,
  textarea {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--bg-subtle);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  input,
  select {
    height: 34px;
    padding: 0 9px;
  }
  textarea {
    min-height: 34px;
    max-height: 92px;
    resize: vertical;
    padding: 8px 9px;
    line-height: 1.35;
  }
  input::placeholder,
  textarea::placeholder { color: var(--faint); }
  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .wide { grid-column: span 2; }
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .status strong { color: var(--text); font-weight: 650; }
  .error {
    color: var(--error);
    font-weight: 600;
  }
  .table-wrap {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    min-width: 920px;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  .col-rid { width: 27%; }
  .col-name { width: 15%; }
  .col-loop { width: 12%; }
  .col-site-type { width: 16%; }
  .col-raw { width: 18%; }
  .col-links { width: 12%; }
  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  td { color: var(--text); }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
  }
  .muted { color: var(--muted); }
  .rid {
    max-width: 340px;
    overflow-wrap: anywhere;
  }
  .name {
    max-width: 260px;
    overflow-wrap: anywhere;
  }
  .row-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .link-button {
    height: auto;
    min-height: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--accent);
  }
  .link-button:hover {
    background: transparent;
    color: var(--accent-hover);
    text-decoration: underline;
  }
  .link-button.active {
    color: var(--accent-hover);
  }
  .availability-row td {
    padding: 0;
    background: rgba(255,255,255,0.018);
  }
  .availability-panel {
    display: grid;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .availability-controls {
    display: grid;
    grid-template-columns: repeat(4, minmax(120px, 1fr)) auto;
    gap: 10px;
    align-items: end;
  }
  .availability-force {
    display: flex;
    min-height: 34px;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
    font-weight: 400;
  }
  .availability-force input {
    width: auto;
    height: auto;
  }
  .availability-result {
    display: grid;
    gap: 8px;
  }
  .availability-summary {
    color: var(--muted);
    font-size: 13px;
  }
  .availability-summary strong { color: var(--text); }
  .availability-days {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .day-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 26px;
    padding: 3px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--bg-subtle);
    color: var(--muted);
    font-size: 12px;
  }
  .day-pill.available {
    border-color: rgba(76,185,106,0.45);
    background: rgba(76,185,106,0.12);
    color: #87d99b;
  }
  .day-pill.partial {
    border-color: rgba(241,194,125,0.42);
    background: rgba(241,194,125,0.10);
    color: #f1c27d;
  }
  .availability-url {
    overflow-wrap: anywhere;
  }
  .availability-footer {
    display: flex;
    justify-content: flex-end;
  }
  details summary {
    cursor: pointer;
    color: var(--accent);
  }
  pre {
    margin: 8px 0 0;
    padding: 9px;
    max-width: 420px;
    max-height: 240px;
    overflow: auto;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .pager {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 14px;
  }
  .empty {
    padding: 34px 14px;
    color: var(--muted);
    text-align: center;
  }
  @media (max-width: 980px) {
    .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .top { align-items: flex-start; flex-direction: column; }
    .nav { justify-content: flex-start; }
    .filters { grid-template-columns: 1fr; }
    .wide { grid-column: span 1; }
    .actions { flex-wrap: wrap; }
    .table-wrap { overflow-x: visible; }
    table,
    tbody,
    tr,
    td {
      display: block;
    }
    table {
      min-width: 0;
      table-layout: auto;
    }
    thead { display: none; }
    tbody {
      display: grid;
      gap: 10px;
      padding: 10px;
    }
    tbody tr.result-row,
    tbody tr.availability-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.018);
      overflow: hidden;
    }
    tbody tr.result-row.is-expanded {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom-color: transparent;
    }
    tbody tr.availability-row {
      margin-top: -10px;
      border-top: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    tbody tr:hover { background: rgba(255,255,255,0.018); }
    tbody tr.result-row td {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    tbody tr.result-row td:last-child { border-bottom: 0; }
    tbody tr.result-row td::before {
      content: attr(data-label);
      grid-column: 1;
      grid-row: 1 / -1;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    tbody tr.result-row td > * {
      grid-column: 2;
    }
    .rid,
    .name {
      max-width: none;
    }
    .row-links { align-items: flex-start; }
    .availability-row td {
      display: block;
      border-bottom: 0;
    }
    .availability-panel {
      border-bottom: 0;
      padding: 12px 10px;
    }
    .availability-controls { grid-template-columns: 1fr; }
    .status,
    .pager { align-items: flex-start; flex-direction: column; }
    pre { max-width: 100%; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>Reservables</h1>
      <div class="sub">Active bookable catalog rows across vendors.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <a href="/">Map</a>
      <a href="/pois">POIs</a>
      <a href="/monitors">Monitors</a>
      <a href="/api/docs">API docs</a>
    </nav>
  </header>

  <form id="reservable-form" class="panel" autocomplete="off">
    <div class="filters">
      <label>
        Type
        <select name="type">
          <option value="site">site</option>
          <option value="">any</option>
        </select>
      </label>
      <label>
        Vendor
        <input name="vendor" placeholder="recgov, aspira_pc">
      </label>
      <label>
        Vendor ID
        <input name="vendor_id" placeholder="330257">
      </label>
      <label>
        Name
        <input name="name" placeholder="A12">
      </label>
      <label>
        Loop
        <input name="loop" placeholder="Loop A">
      </label>
      <label>
        Site Type
        <input name="site_type" placeholder="STANDARD">
      </label>
      <label class="wide">
        RID
        <input name="rid" placeholder="site:recgov:330257">
      </label>
      <label class="wide">
        Raw contains
        <textarea name="raw" spellcheck="false" placeholder='{"host":"reservation.pc.gc.ca"}'></textarea>
      </label>
      <label>
        Limit
        <select name="limit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="250">250</option>
          <option value="500">500</option>
        </select>
      </label>
      <div class="actions">
        <button class="primary" type="submit">Search</button>
        <button id="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </form>

  <section class="panel" aria-live="polite">
    <div id="status" class="status">
      <span>Ready.</span>
      <span class="mono muted" id="query-url"></span>
    </div>
    <div class="table-wrap">
      <table>
        <colgroup>
          <col class="col-rid">
          <col class="col-name">
          <col class="col-loop">
          <col class="col-site-type">
          <col class="col-raw">
          <col class="col-links">
        </colgroup>
        <thead>
          <tr>
            <th>RID</th>
            <th>Name</th>
            <th>Loop</th>
            <th>Site Type</th>
            <th>Raw</th>
            <th>Links</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No reservables match these filters.</div>
    </div>
    <div class="pager">
      <button id="prev-btn" type="button">Previous</button>
      <button id="next-btn" type="button">Next</button>
    </div>
  </section>
</main>
<script type="module" src="/web/reservables.js"></script>
</body>
</html>
