<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Reservables</title>
<link rel="stylesheet" href="/web/components/catalog.css">
</head>
<body class="catalog-page catalog-page-reservables">
<main class="shell">
  <header class="top">
    <div>
      <h1>Reservables</h1>
      <div class="sub">Active bookable catalog rows across vendors.</div>
    </div>
    <nav class="nav" aria-label="Page links">
      <div class="nav-group" aria-label="Catalog pages">
        <a href="/pois">POIs</a>
        <a href="/reservables" aria-current="page">Reservables</a>
        <a href="/pollers">Pollers</a>
        <a href="/logs">Logs</a>
      </div>
      <div class="nav-group" aria-label="Outside links">
        <a class="outside-link" href="/">Map</a>
        <a class="outside-link" href="/api/docs">API docs</a>
      </div>
    </nav>
  </header>

  <div id="reservable-query">
    <form id="reservable-form" class="panel" autocomplete="off">
      <div class="filters">
        <label>
          Type
          <select name="type">
            <option value="site">site</option>
            <option value="">any</option>
          </select>
        </label>
        <label>
          Vendor
          <input name="vendor" placeholder="recgov, aspira_pc">
        </label>
        <label>
          Vendor ID
          <input name="vendor_id" placeholder="330257">
        </label>
        <label>
          Name
          <input name="name" placeholder="A12">
        </label>
        <label>
          Loop
          <input name="loop" placeholder="Loop A">
        </label>
        <label>
          Site Type
          <input name="site_type" placeholder="STANDARD">
        </label>
        <label>
          POI ID
          <input name="poi_id" inputmode="numeric" placeholder="2258">
        </label>
        <label class="wide">
          ID
          <input name="id" placeholder="site:recgov:330257">
        </label>
        <label class="wide">
          Raw contains
          <textarea name="raw" spellcheck="false" placeholder='{"host":"reservation.pc.gc.ca"}'></textarea>
        </label>
        <label>
          Limit
          <select name="limit">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </label>
        <div class="actions">
          <button class="primary" type="submit">Search</button>
          <button data-action="reset-reservable-query" type="button">Reset</button>
        </div>
      </div>
    </form>
  </div>

  <section class="panel" aria-live="polite">
    <div id="status" class="status">
      <span>Ready.</span>
      <span class="mono muted" id="query-url"></span>
    </div>
    <div id="results"></div>
    <div id="empty" class="empty" hidden>No reservables match these filters.</div>
    <div class="pager">
      <button id="prev-btn" type="button">Previous</button>
      <button id="next-btn" type="button">Next</button>
    </div>
  </section>
</main>
<script type="module" src="/web/reservables.js"></script>
</body>
</html>
