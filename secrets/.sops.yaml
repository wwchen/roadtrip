# Who can decrypt the vaults in this directory.
#
# sops discovers this by walking up from the file being encrypted, so keeping
# it beside the vaults means the rule and the files it governs cannot drift.
#
# For dotenv files sops encrypts values and leaves keys in plaintext, which is
# what we want: `git diff` shows which secret changed without revealing what it
# changed to. Empty values stay empty — there is nothing to encrypt in an empty
# string — so an unset key is visibly unset.
#
# Adding a host or a person:
#   1. On that machine: ./secrets/manage.py init  — prints its age public key.
#   2. Add the key below with a comment naming the holder.
#   3. ./secrets/manage.py rotate   (from a host that can already decrypt)
#   4. Commit .sops.yaml and the re-wrapped vaults together.
#
# Removing a holder is the same edit in reverse, but that key has already seen
# the current values and git history keeps the ciphertext forever — rotate the
# underlying credentials at their providers, not just this file.

creation_rules:
  - path_regex: .*\.enc\.env$
    key_groups:
      - age:
          # wc@laptop — primary dev machine
          - age1gr7vhre9c8as5n03w4qa3gwenszx8gk6dsr4d8nj2stp55p3nqzsyu43ad
          # mini-ca — deploy host
          - age1fkpsyq9t7y9xu4f99kkgjs60hx7s9nsyntvyrqyjzzgc2ptjwdhqcvudap
          # lew
          - age1g3fas8e4uw45l74mqyv7xaumngpckph8a073mw0pu59ak2hyq32qz92pvk
          # attn
          - age1jqpzgvyzvygv98x3edrrjcd64k9ukwddv3nd8d5gtc8kcnxcd3kslhvjks
          # lew macbook air
          - age1ffphgu6jfpw9a4662r2w22uvreawknrm29jjnxkf87uvvct2sejs2l3jm2
