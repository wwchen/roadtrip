# The secret registry — the single source of truth for WHICH secrets exist,
# WHO receives them, and WHERE they are mandatory. No values live here.
#
# This file is not documentation that describes the system; it is the input the
# system is generated from. `docker-compose.secrets.yml` is produced from the
# `consumers` field below, and that generated file is what Compose actually
# runs — so a wrong `consumers` entry means the container genuinely does not
# receive the secret. The metadata cannot quietly disagree with reality, which
# is exactly what went wrong when the same list was maintained by hand in
# .env.example, application.yaml, docker-compose.yml, and the deploy workflow.
#
#   ./secrets/manage.py add NAME        add a secret (registry entry + value)
#   ./secrets/manage.py generate        regenerate docker-compose.secrets.yml
#   ./secrets/manage.py check           validate; also runs in CI and pre-commit
#
# Fields
#   description  what the value is for. Shown by `manage.py ls`.
#   consumers    who receives it. Drives generation and least privilege.
#                  backend | postgres | grafana | cookie-bot | cloudflared
#                  host-tools  — scripts/ run on the host, not in a container,
#                                so these are injected as env by `manage.py exec`
#   required_in  environments where absence is a boot failure. Empty means the
#                feature degrades gracefully (and the code must actually do so).
#
# Scope: secrets only. Non-secret tunables (OTEL_*, PROMETHEUS_RETENTION,
# COMPANION_*) keep their docker-compose.yml defaults and do not belong here.

POSTGRES_PASSWORD:
  description: Postgres superuser password.
  consumers: [postgres, backend]
  # Seeds the cluster on first init and is re-read by the backend on every
  # connect. Both sides must agree, so it is required wherever the DB is real.
  required_in: [prod]

GRAFANA_DB_PASSWORD:
  description: Password for grafana_reader, the read-only Postgres role Grafana queries with.
  # postgres-init creates the role with it; Grafana's datasource connects with
  # it. One definition, two consumers — they cannot drift.
  consumers: [postgres, grafana]
  required_in: [prod]

GRAFANA_ADMIN_PASSWORD:
  description: Grafana admin login. Applied when the admin user is first created.
  consumers: [grafana]
  required_in: [prod]

GRAFANA_SLACK_WEBHOOK_URL:
  description: Slack webhook for Grafana alert delivery.
  # Required everywhere, and not merely by convention: Grafana reads this with
  # $__file{} while parsing its alerting provisioning, and Compose creates no
  # file at all for an empty value — so a blank here is not "alerts disabled",
  # it is Grafana refusing to start. The vault holds an obvious placeholder
  # webhook until a real one is set.
  consumers: [grafana]
  required_in: [local, prod]

CLOUDFLARE_TUNNEL_TOKEN:
  description: Cloudflare tunnel token that fronts the public deployment.
  consumers: [cloudflared]
  # Delivered via TUNNEL_TOKEN_FILE rather than --token, keeping it off the
  # container's command line and out of `ps`.
  required_in: [prod]

MAPBOX_TOKEN:
  description: Server-side Mapbox token for /api/route and /api/geocode.
  consumers: [backend]
  # Absent, both endpoints return 503 and the trip planner is inert but the app
  # serves everything else — a real degraded mode in local dev.
  required_in: [prod]

ROADTRIP_AUTH_ISSUER:
  description: OIDC issuer URL (RFC 0009). Blank disables auth entirely.
  consumers: [backend]
  required_in: [prod]

ROADTRIP_AUTH_CLIENT_ID:
  description: OIDC client id.
  consumers: [backend]
  required_in: [prod]

ROADTRIP_AUTH_CLIENT_SECRET:
  description: OIDC client secret. Also the HMAC key signing the login-flow cookie.
  consumers: [backend]
  required_in: [prod]

SLACK_BOT_TOKEN:
  description: Slack bot token for availability alert delivery.
  consumers: [backend]
  required_in: []

SLACK_ALERT_CHANNEL:
  description: Default Slack channel for availability alerts.
  consumers: [backend]
  required_in: []

SLACK_SIGNING_SECRET:
  description: Verifies Slack interactivity callbacks. Unset leaves the route unregistered.
  consumers: [backend]
  required_in: []

RESEND_API_KEY:
  description: Resend API key for email alert delivery.
  consumers: [backend]
  required_in: []

CAMPFLARE_API_KEY:
  description: Campflare API key. Read by the backend client and scripts/fetch_campflare_dump.py.
  consumers: [backend, host-tools]
  required_in: []

RIDB_API_KEY:
  description: Recreation.gov RIDB key. Used only by scripts/fetch_recgov.py on the host.
  consumers: [host-tools]
  required_in: []

COOKIE_BOT_TOKEN:
  description: Shared token authenticating callers of the cookie-bot sidecar.
  consumers: [cookie-bot, host-tools]
  required_in: []
