<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26272d">
<title>Watches</title>
<link rel="stylesheet" href="/web/design-system/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--rt-bg-sunken);
    color: var(--rt-text);
    font-family: var(--rt-sans);
  }
  body { padding: 20px; }
  a { color: var(--rt-brand); text-decoration: none; }
  a:hover { color: var(--rt-brand-hover); text-decoration: underline; }
  .shell { max-width: 1080px; margin: 0 auto; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 650; }
  .sub { margin-top: 4px; color: var(--rt-muted); font-size: 13px; }
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav a {
    border: 1px solid var(--rt-border-strong);
    background: var(--rt-fill-subtle);
    color: var(--rt-text);
    border-radius: var(--rt-r-md);
    height: 34px;
    padding: 0 12px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
  }
  .nav a:hover { background: var(--rt-fill-hover); text-decoration: none; }
  .nav a.outside-link { gap: 7px; }
  .nav a.outside-link::after {
    content: "";
    width: 10px; height: 10px;
    border-top: 1.5px solid currentColor;
    border-right: 1.5px solid currentColor;
    opacity: 0.7;
  }
  #banner-host { margin-bottom: 12px; }
  #banner-host:empty { margin-bottom: 0; }
  #form-host { margin-bottom: 16px; }
  .cg-btn {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--rt-border-strong);
    border-radius: var(--rt-r-md);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .cg-btn-primary {
    border-color: var(--rt-brand);
    background: var(--rt-brand);
    color: #fff;
    font-weight: 600;
  }
  .cg-btn-primary:hover { background: var(--rt-brand-hover); border-color: var(--rt-brand-hover); }
  .cg-btn-secondary {
    background: var(--rt-fill-subtle);
    color: var(--rt-text);
  }
  .cg-btn-secondary:hover { background: var(--rt-fill-hover); }
  .cg-btn:disabled { opacity: 0.55; cursor: default; }
  .test-notifications-details {
    margin-top: 40px;
    border: 1px solid var(--rt-warn);
    border-radius: var(--rt-r-md);
    overflow: hidden;
  }
  .test-notifications-summary {
    padding: 10px 14px;
    background: color-mix(in srgb, var(--rt-warn) 10%, transparent);
    color: var(--rt-warn);
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    user-select: none;
  }
  .test-notifications-summary:hover {
    background: color-mix(in srgb, var(--rt-warn) 18%, transparent);
  }
  .test-notifications {
    padding: 14px;
  }
  .test-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .test-label {
    min-width: 50px;
    font-size: 13px;
    font-weight: 600;
    color: var(--rt-muted);
  }
  .test-input {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--rt-border-strong);
    border-radius: var(--rt-r-md);
    background: var(--rt-bg);
    color: var(--rt-text);
    font: inherit;
    font-size: 13px;
    width: 200px;
  }
  .test-status {
    font-size: 12px;
    color: var(--rt-muted);
  }
  .test-status.ok { color: var(--rt-brand); }
  .test-status.err { color: var(--rt-warn); }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .top { align-items: flex-start; flex-direction: column; }
    .test-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div>
      <h1>Watches</h1>
      <div class="sub">Manage availability watches — get notified when campsites open up.</div>
    </div>
    <nav class="nav">
      <a class="outside-link" href="/">Map</a>
      <a class="outside-link" href="/availability.html">Dashboard</a>
    </nav>
  </header>

  <div id="banner-host"></div>
  <div id="form-host"></div>
  <div id="table-host"></div>

  <details class="test-notifications-details">
    <summary class="test-notifications-summary">Test notifications</summary>
    <div class="test-notifications">
      <div class="test-row">
        <label class="test-label">Slack</label>
        <input id="test-slack-channel" type="text" placeholder="#alerts" class="test-input">
        <button id="test-slack-btn" class="cg-btn cg-btn-secondary">Send test</button>
        <span id="test-slack-status" class="test-status"></span>
      </div>
      <div class="test-row">
        <label class="test-label">Email</label>
        <input id="test-email-to" type="email" placeholder="you@example.com" class="test-input">
        <button id="test-email-btn" class="cg-btn cg-btn-secondary">Send test</button>
        <span id="test-email-status" class="test-status"></span>
      </div>
    </div>
  </details>
</main>
<script type="module" src="/web/watches/watches-page.js"></script>
</body>
</html>
